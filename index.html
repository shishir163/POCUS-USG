const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone=o=>JSON.parse(JSON.stringify(o));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v));}
function T(k){return (UI[prefs.lang]||UI.bn)[k];}
function L(o){return o==null?'':(typeof o==='string'?o:(o[prefs.lang]||o.bn||o.en||''));}
let _toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2000);}
const rid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- prefs (per device) ---------- */
const DEFAULT_PREFS={lang:'bn',theme:'rose',fontBn:"'Hind Siliguri'",fontEn:"'Inter'",fontSize:16,tile:'soft',gridSize:'s',sort:'manual',module:'all',cat:'__all__',cardSize:{},done:{},fav:{},recent:[],showRound:true};
let prefs=Object.assign(clone(DEFAULT_PREFS),loadJSON(PREF_KEY)||{});
function savePrefs(){try{saveJSON(PREF_KEY,prefs);}catch(e){}}

/* ---------- data ---------- */
function normCard(c){
  return {id:String(c.id),module:c.module==='echo'?'echo':'lung',cat:c.cat||'',color:c.color||'#e5799a',emoji:c.emoji||'📄',
    titleBn:c.titleBn||'',titleEn:c.titleEn||'',bodyBn:c.bodyBn||'',bodyEn:c.bodyEn||'',
    order:typeof c.order==='number'?c.order:0,slots:c.slots||{},gallery:Array.isArray(c.gallery)?c.gallery:[],seed:!!c.seed};
}
function normCats(c){c=c||{};return {lung:Array.isArray(c.lung)?c.lung:clone(DEFAULT_CATS.lung),echo:Array.isArray(c.echo)?c.echo:clone(DEFAULT_CATS.echo)};}
function seedCards(){
  const lung=LUNG_SEED_CARDS.map((c,i)=>normCard({...c,module:'lung',order:(i+1)*10,seed:true,images:undefined}));
  const echo=ECHO_SEED.map((c,i)=>normCard({...c,module:'echo',order:(i+1)*10,seed:true}));
  return lung.concat(echo);
}
const SEED_IDS=new Set(seedCards().map(c=>c.id));
/* old single-document format → new cards (+ images pulled out) */
function fromLegacy(st){
  const images={};
  const lung=(st.cards||[]).map((c,i)=>{
    const gallery=[];
    (c.images||[]).forEach((d,j)=>{const iid='leg'+c.id+'_'+j;images[iid]=d;gallery.push('img:'+iid);});
    return normCard({...c,module:'lung',order:(i+1)*10,gallery,seed:SEED_IDS.has(String(c.id))});
  });
  const echo=ECHO_SEED.map((c,i)=>normCard({...c,module:'echo',order:(i+1)*10,seed:true}));
  return {cards:lung.concat(echo),cats:{lung:Array.isArray(st.cats)?st.cats:clone(DEFAULT_CATS.lung),echo:clone(DEFAULT_CATS.echo)},images};
}
let localImgs=loadJSON(IMG_KEY)||{};
function saveImgsLocal(){try{saveJSON(IMG_KEY,localImgs);return true;}catch(e){return false;}}
let data=loadJSON(DATA_KEY);
if(!data||!Array.isArray(data.cards)){
  const old=loadJSON(OLD_KEY);
  if(old&&Array.isArray(old.cards)&&old.cards.length){
    const m=fromLegacy(old);
    data={cards:m.cards,cats:m.cats};
    Object.assign(localImgs,m.images);
    if(!saveImgsLocal()){try{localStorage.removeItem(OLD_KEY);}catch(e){} saveImgsLocal();}
    if(old.theme&&THEMES.some(t=>t[0]===old.theme)&&!loadJSON(PREF_KEY))prefs.theme=old.theme;
  }else{
    data={cards:seedCards(),cats:clone(DEFAULT_CATS)};
  }
}
data.cards=data.cards.map(normCard);data.cats=normCats(data.cats);
function saveData(){try{saveJSON(DATA_KEY,{cards:data.cards,cats:data.cats});}catch(e){}}
saveData();
const byId=id=>data.cards.find(c=>c.id===id);
const byOrder=(a,b)=>(MOD_ORDER.indexOf(a.module)-MOD_ORDER.indexOf(b.module))||(a.order-b.order);
function modCards(m){return data.cards.filter(c=>c.module===m).sort((a,b)=>a.order-b.order);}

/* ---------- cloud state ---------- */
let cloudOn=false,isAdmin=false,currentUser=null,seeding=false,editMode=false,started=false;
const canEdit=()=>!cloudOn||isAdmin;

/* ---------- commit / undo / redo (with cloud diff) ---------- */
let hist=[],future=[];
const snapStr=()=>JSON.stringify({cards:data.cards,cats:data.cats});
function commit(fn){
  const before=snapStr();hist.push(before);if(hist.length>40)hist.shift();future=[];
  fn();
  afterChange(before);
}
function afterChange(beforeStr){
  data.cards=data.cards.map(normCard);IDX=null;saveData();pushDiff(JSON.parse(beforeStr));renderAll();
}
function undo(){if(!hist.length)return;const cur=snapStr();future.push(cur);const p=JSON.parse(hist.pop());data.cards=p.cards;data.cats=p.cats;afterChange(cur);toast(T('undone'));}
function redo(){if(!future.length)return;const cur=snapStr();hist.push(cur);const p=JSON.parse(future.pop());data.cards=p.cards;data.cats=p.cats;afterChange(cur);toast(T('redone'));}
function pushDiff(prev){
  if(!cloudOn||!isAdmin)return;
  const pm={};(prev.cards||[]).forEach(c=>pm[c.id]=JSON.stringify(normCard(c)));
  const fail=e=>{console.warn(e);toast(T('saveFail')+(e&&e.code?' ('+e.code+')':''));};
  data.cards.forEach(c=>{if(pm[c.id]!==JSON.stringify(c))POCUS.putCard(c).catch(fail);delete pm[c.id];});
  Object.keys(pm).forEach(id=>POCUS.delCard(id).catch(fail));
  if(JSON.stringify(normCats(prev.cats))!==JSON.stringify(data.cats))POCUS.putMeta({cats:data.cats,seedVersion:SEED_VERSION}).catch(fail);
}

/* ---------- images ---------- */
const imgMem={};
function driveFix(u){const m=String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':u;}
function imgSrc(ref){if(!ref)return null;if(ref.startsWith('img:')){const id=ref.slice(4);return imgMem[id]||localImgs[id]||null;}return driveFix(ref);}
async function ensureImg(ref){
  if(!ref||!ref.startsWith('img:'))return;const id=ref.slice(4);
  if(imgMem[id]||localImgs[id])return;
  if(cloudOn){try{const d=await POCUS.getImage(id);if(d)imgMem[id]=d;}catch(e){}}
}
function loadImgEl(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function toJpeg(img,max){
  max=max||1400;let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  let q=.82,out=cv.toDataURL('image/jpeg',q);while(out.length>700000&&q>.45){q-=.1;out=cv.toDataURL('image/jpeg',q);}
  if(out.length>700000&&max>400)return toJpeg(img,Math.round(max*.7));
  return out;
}
async function compressFile(file){const url=URL.createObjectURL(file);try{return toJpeg(await loadImgEl(url));}finally{URL.revokeObjectURL(url);}}
async function shrinkDataURL(d){if(!d||d.length<700000)return d;try{return toJpeg(await loadImgEl(d));}catch(e){return d;}}
async function storeImage(dataURL){
  const id=rid('i');
  if(cloudOn){await POCUS.putImage(id,dataURL);imgMem[id]=dataURL;}
  else{localImgs[id]=dataURL;if(!saveImgsLocal()){delete localImgs[id];toast('Storage full');return null;}}
  return 'img:'+id;
}
function pickFile(){return new Promise(res=>{const inp=$('#imgPicker');inp.value='';inp.onchange=()=>res(inp.files&&inp.files[0]||null);inp.click();});}
async function addImageTo(cardId,slotId){
  const f=await pickFile();if(!f)return;
  toast(T('imgWorking'));
  try{
    const ref=await storeImage(await compressFile(f));if(!ref)return;
    commit(()=>{const c=byId(cardId);if(!c)return;if(slotId)c.slots={...c.slots,[slotId]:ref};else c.gallery=[...c.gallery,ref];});
    refreshOpenCard();toast(T('imgDone'));
  }catch(e){console.warn(e);toast(T('imgFail'));}
}
function addLinkTo(cardId,slotId){
  const u=prompt(T('linkAsk'));if(!u||!/^https?:\/\//i.test(u.trim()))return;
  commit(()=>{const c=byId(cardId);if(slotId)c.slots={...c.slots,[slotId]:u.trim()};else c.gallery=[...c.gallery,u.trim()];});
  refreshOpenCard();
}
function viewImage(src,cap){$('#lbImg').src=src;$('#lbCap').textContent=cap||'';$('#lightbox').classList.add('open');}

/* ---------- search engine ---------- */
let IDX=null;
const ALL_CASES=LUNG_CASES.map((c,i)=>({...c,module:'lung',cid:'L'+(i+1)})).concat(ECHO_CASES.map((c,i)=>({...c,module:'echo',cid:'E'+(i+1)})));
function stripHTML(h){const d=document.createElement('div');d.innerHTML=h||'';d.querySelectorAll('svg,style,script').forEach(n=>n.remove());
  d.querySelectorAll('.imgslot').forEach(n=>{n.textContent=' '+(n.dataset.cap||'')+' ';});
  return (d.textContent||'').normalize('NFC').replace(/[‌‍]/g,'').replace(/\s+/g,' ').trim();}
const nrm=s=>(s||'').normalize('NFC').replace(/[‌‍]/g,'').toLowerCase();
function buildIndex(){
  const recs=data.cards.map(c=>({type:'card',c,title:nrm(c.titleBn+' | '+c.titleEn),cat:nrm(c.cat+' '+c.module),tBn:stripHTML(c.bodyBn),tEn:stripHTML(c.bodyEn)}));
  ALL_CASES.forEach(k=>recs.push({type:'case',k,title:nrm('case '+k.qBn+' '+k.qEn),cat:nrm('case '+k.module+' '+k.lvl),tBn:stripHTML(k.sBn+' '+k.aBn),tEn:stripHTML(k.sEn+' '+k.aEn)}));
  recs.forEach(r=>{r.body=nrm(r.tBn+' '+r.tEn);r.words=Array.from(new Set((r.title+' '+r.body).split(/[^\p{L}\p{M}\p{N}-]+/u).filter(w=>w.length>2)));});
  IDX=recs;
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function variantsOf(tok){const v=new Set([tok]);(SEARCH_SYN[tok]||[]).forEach(x=>v.add(nrm(x)));return Array.from(v);}
function countOcc(h,n){let c=0,i=h.indexOf(n);while(i>=0&&c<5){c++;i=h.indexOf(n,i+n.length);}return c;}
function runSearch(q){
  if(!IDX)buildIndex();
  const toks=nrm(q).split(/[\s,;]+/).filter(Boolean);if(!toks.length)return {list:[],terms:[]};
  const terms=[];const full=[],part=[];
  const tv=toks.map(t=>{const v=variantsOf(t);terms.push(...v);return v;});
  IDX.forEach(r=>{
    let score=0,hit=0;
    tv.forEach((vars,ti)=>{
      let s=0;
      vars.forEach(v=>{if(r.title.includes(v))s=Math.max(s,12);else if(r.cat.includes(v))s=Math.max(s,5);else{const n=countOcc(r.body,v);if(n)s=Math.max(s,1+n);}});
      if(!s&&/^[a-z0-9-]{4,}$/.test(toks[ti])){const tol=toks[ti].length>=7?2:1;if(r.words.some(w=>Math.abs(w.length-toks[ti].length)<=tol&&lev(toks[ti],w)<=tol))s=1.5;}
      if(s){hit++;score+=s;}
    });
    if(r.type==='case')score*=.8;
    if(hit===tv.length)full.push({r,score});else if(hit)part.push({r,score:score*hit/tv.length});
  });
  const list=(full.length?full:part).sort((a,b)=>b.score-a.score).slice(0,40);
  return {list,terms,partial:!full.length&&part.length>0};
}
function snippet(r,terms){
  const order=prefs.lang==='en'?[r.tEn,r.tBn]:[r.tBn,r.tEn];
  for(const t of order){const low=t.toLowerCase();let at=-1,len=0;terms.forEach(v=>{const i=low.indexOf(v);if(i>=0&&(at<0||i<at)){at=i;len=v.length;}});
    if(at>=0){const s=Math.max(0,at-60),e=Math.min(t.length,at+len+90);return (s>0?'…':'')+highlight(t.slice(s,e),terms)+(e<t.length?'…':'');}}
  return esc(order[0].slice(0,140))+'…';
}
function highlight(text,terms){
  const ts=terms.filter(Boolean).sort((a,b)=>b.length-a.length);if(!ts.length)return esc(text);
  const re=new RegExp('('+ts.map(escRe).join('|')+')','gi');
  return text.split(re).map((p,i)=>i%2?'<mark>'+esc(p)+'</mark>':esc(p)).join('');
}
function markInContent(root,terms){
  const ts=terms.filter(t=>t&&t.length>1).sort((a,b)=>b.length-a.length);if(!ts.length)return;
  const re=new RegExp('('+ts.map(escRe).join('|')+')','gi');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('svg,.slotacts,mark')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;if(!re.test(t))return;re.lastIndex=0;
    const frag=document.createDocumentFragment();t.split(re).forEach((p,i)=>{if(!p)return;if(i%2){const m=document.createElement('mark');m.textContent=p;frag.appendChild(m);}else frag.appendChild(document.createTextNode(p));});
    n.parentNode.replaceChild(frag,n);});
  const first=root.querySelector('mark');if(first)setTimeout(()=>first.scrollIntoView({block:'center',behavior:'smooth'}),150);
}
let lastTerms=[];
function renderSearch(){
  const q=$('#search').value.trim();$('#sclear').style.display=q?'block':'none';
  const res=$('#results'),main=$('#mainview');
  if(!q){res.classList.remove('show');main.style.display='';renderChips();return;}
  const {list,terms,partial}=runSearch(q);lastTerms=terms;
  main.style.display='none';res.classList.add('show');
  let h=`<div class="reshead">${list.length} ${T('results')}${partial?' — '+T('partial'):''}</div>`;
  if(!list.length)h+=`<div class="hint">${T('noRes')}</div>`;
  list.forEach(({r})=>{
    if(r.type==='card'){const c=r.c;const t=prefs.lang==='en'?(c.titleEn||c.titleBn):(c.titleBn||c.titleEn);
      h+=`<div class="res" style="--cc:${esc(c.color)}" data-act="openres" data-id="${esc(c.id)}"><div class="re">${esc(c.emoji)}</div><div><div class="rt">${highlight(t,terms)}</div><div class="rm">${MODS[c.module].e} ${L(MODS[c.module])} · ${esc(c.cat)}</div><div class="rs">${snippet(r,terms)}</div></div></div>`;}
    else{const k=r.k;h+=`<div class="res" style="--cc:#8b6fd0" data-act="opencase" data-id="${k.cid}"><div class="re">🧠</div><div><div class="rt">${T('caseLbl')} ${k.cid} <span class="lvl ${k.lvl}">${T('lvl')[k.lvl]}</span></div><div class="rm">${MODS[k.module].e} ${L(MODS[k.module])}</div><div class="rs">${snippet(r,terms)}</div></div></div>`;}
  });
  res.innerHTML=h;
}
function rememberSearch(){const q=$('#search').value.trim();if(!q)return;prefs.recent=[q,...prefs.recent.filter(x=>x!==q)].slice(0,6);savePrefs();}
function renderChips(){
  const items=[...prefs.recent.map(x=>'🕘 '+x),...QUICK_TERMS.filter(x=>!prefs.recent.includes(x))];
  $('#schips').innerHTML=items.map(x=>`<button class="schip" data-act="chipsearch" data-q="${esc(x.replace(/^🕘 /,''))}">${esc(x)}</button>`).join('');
}

/* ---------- render: dashboard ---------- */
function applyPrefs(){
  if(!THEMES.some(t=>t[0]===prefs.theme))prefs.theme='rose';
  document.body.dataset.theme=prefs.theme;document.body.dataset.tile=prefs.tile;
  document.documentElement.style.setProperty('--font-ui',`${prefs.fontEn}, ${prefs.fontBn}, system-ui, -apple-system, sans-serif`);
  document.documentElement.style.setProperty('--fs',prefs.fontSize+'px');
  const th=THEMES.find(t=>t[0]===prefs.theme);document.querySelector('meta[name=theme-color]').setAttribute('content',th[2]);
  document.documentElement.lang=prefs.lang;
  $('#langBtn').textContent=prefs.lang==='bn'?'EN':'বা';
  $('#search').placeholder=T('search');
  document.querySelectorAll('[data-l10n]').forEach(el=>{el.textContent=T(el.dataset.l10n);});
  $('#editBtn').style.display=canEdit()?'grid':'none';
  $('#editBtn').classList.toggle('on',editMode);
  document.body.classList.toggle('editing',editMode&&canEdit());
  document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.sz===prefs.gridSize));
  $('#sortBtn').textContent={manual:T('sortManual'),az:T('sortAz'),cat:T('sortCat')}[prefs.sort];
  $('#roundTitle').style.display=$('#roundbar').style.display=prefs.showRound?'':'none';
}
function renderTabs(){
  const tabs=[['all','✨',T('all')],['lung',MODS.lung.e,L(MODS.lung)],['echo',MODS.echo.e,L(MODS.echo)],['fav','⭐',T('saved')]];
  $('#modtabs').innerHTML=tabs.map(([k,e,n])=>{
    let list=k==='all'?data.cards:k==='fav'?data.cards.filter(c=>prefs.fav[c.id]):data.cards.filter(c=>c.module===k);
    const done=list.filter(c=>prefs.done[c.id]).length;
    const p=k==='fav'?list.length:`${done}/${list.length}`;
    return `<button class="modtab${prefs.module===k?' active':''}" data-act="module" data-v="${k}"><span class="me">${e}</span><span class="mn">${esc(n)}</span><span class="mp">${p}</span></button>`;
  }).join('');
}
function renderRound(){
  $('#roundbar').innerHTML=ROUND_ITEMS.filter(r=>r.tool||byId(r.card)).map((r,i)=>`<button class="rpill" style="--rc:${r.c}" data-act="round" data-i="${i}">${r.e} ${esc(L(r.t))}</button>`).join('');
}
function currentCats(){
  if(prefs.module==='lung'||prefs.module==='echo')return data.cats[prefs.module];
  const s=[];MOD_ORDER.forEach(m=>data.cats[m].forEach(c=>{if(!s.includes(c))s.push(c);}));return s;
}
function renderCats(){
  const cats=currentCats();if(prefs.cat!=='__all__'&&!cats.includes(prefs.cat))prefs.cat='__all__';
  $('#catbar').innerHTML=`<button class="chip${prefs.cat==='__all__'?' active':''}" data-act="cat" data-v="__all__">${T('all')}</button>`+
    cats.map(c=>`<button class="chip${prefs.cat===c?' active':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('');
}
function visibleCards(){
  let list=data.cards.slice();
  if(prefs.module==='fav')list=list.filter(c=>prefs.fav[c.id]);
  else if(prefs.module!=='all')list=list.filter(c=>c.module===prefs.module);
  if(prefs.cat!=='__all__')list=list.filter(c=>c.cat===prefs.cat);
  const tl=c=>prefs.lang==='en'?(c.titleEn||c.titleBn):(c.titleBn||c.titleEn);
  if(prefs.sort==='az')list.sort((a,b)=>tl(a).localeCompare(tl(b),prefs.lang));
  else if(prefs.sort==='cat')list.sort((a,b)=>(MOD_ORDER.indexOf(a.module)-MOD_ORDER.indexOf(b.module))||(data.cats[a.module].indexOf(a.cat)-data.cats[b.module].indexOf(b.cat))||(a.order-b.order));
  else list.sort(byOrder);
  return list;
}
function stepIndex(c){return modCards(c.module).findIndex(x=>x.id===c.id)+1;}
function cardTile(c){
  const sz=prefs.cardSize[c.id]||prefs.gridSize;
  const title=prefs.lang==='en'?(c.titleEn||c.titleBn):(c.titleBn||c.titleEn);
  const meta=(prefs.module==='all'||prefs.module==='fav'?MODS[c.module].e+' ':'')+esc(c.cat);
  const badges=(prefs.done[c.id]?'<span class="bdone">✓</span>':'')+(prefs.fav[c.id]?'<span>⭐</span>':'');
  const txt=`<div class="txtwrap"><div class="cat">${meta}</div><div class="ttl">${esc(title)}</div>${sz!=='xs'?`<div class="stepno">${T('step')} ${stepIndex(c)}</div>`:''}</div>`;
  return `<div class="card ${sz}" style="--cc:${esc(c.color)}" data-act="open" data-id="${esc(c.id)}"><div class="accentbar"></div><div class="badges">${badges}</div><button class="more" data-act="menu" data-id="${esc(c.id)}">⋮</button><div class="iconbox">${esc(c.emoji)}</div>${txt}</div>`;
}
function renderGrid(){
  const list=visibleCards();let h='',last=null;
  list.forEach(c=>{
    if(prefs.sort==='cat'){const g=(prefs.module==='all'||prefs.module==='fav'?MODS[c.module].e+' '+L(MODS[c.module])+' · ':'')+c.cat;if(g!==last){h+=`<div class="grouphdr">${esc(g)}</div>`;last=g;}}
    h+=cardTile(c);
  });
  $('#grid').innerHTML=h;
  const hint=$('#emptyHint');hint.style.display=list.length?'none':'block';hint.textContent=prefs.module==='fav'?T('emptyFav'):T('empty');
}
function renderBottom(){
  const b=$('#bottombar');
  if(editMode&&canEdit()){
    b.innerHTML=`<button data-act="undo" ${hist.length?'':'disabled'}>↶ Undo</button><button data-act="redo" ${future.length?'':'disabled'}>↷ Redo</button><button class="primary" data-act="new">${T('newCard')}</button>`;
  }else{
    b.innerHTML=`<button data-act="tools">${T('dx')}</button><button data-act="cases">${T('cases')}</button>`;
  }
}
function renderAll(){applyPrefs();renderTabs();renderRound();renderCats();renderGrid();renderBottom();if($('#search').value.trim())renderSearch();else renderChips();}

/* ---------- sheet ---------- */
let openCardId=null,sheetMode=null;
function openSheet(html,mode){const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;s.scrollTop=0;sheetMode=mode||'x';$('#overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSheet(){$('#overlay').classList.remove('open');openCardId=null;sheetMode=null;document.body.style.overflow='';}

/* ---------- content view ---------- */
function bodyOf(c){return (prefs.lang==='en'?(c.bodyEn||c.bodyBn):(c.bodyBn||c.bodyEn))||'';}
function fillSlot(el,c){
  const id=el.dataset.slot,cap=el.dataset.cap||'',ref=(c.slots||{})[id];
  el.innerHTML='';el.classList.remove('filled','loadingimg');
  if(ref){
    el.classList.add('filled');const img=document.createElement('img');img.alt=cap;img.loading='lazy';
    const s=imgSrc(ref);if(s)img.src=s;else{el.classList.add('loadingimg');ensureImg(ref).then(()=>{const s2=imgSrc(ref);if(s2){img.src=s2;el.classList.remove('loadingimg');}});}
    img.addEventListener('click',()=>viewImage(img.src,cap));el.appendChild(img);
  }else{
    el.insertAdjacentHTML('beforeend',`<div class="slotph"><span class="slotic">📷</span><span>${canEdit()?T('addImgHere'):T('imgSoon')}</span></div>`);
  }
  if(cap)el.insertAdjacentHTML('beforeend',`<div class="slotcap">${esc(cap)}</div>`);
  if(canEdit()){
    el.insertAdjacentHTML('beforeend',`<div class="slotacts"><button data-act="slotimg" data-id="${esc(c.id)}" data-slot="${esc(id)}">${ref?T('replace'):T('addImg')}</button><button data-act="slotlink" data-id="${esc(c.id)}" data-slot="${esc(id)}">${T('addLink')}</button>${ref?`<button data-act="slotrm" data-id="${esc(c.id)}" data-slot="${esc(id)}">${T('remove')}</button>`:''}</div>`);
  }
}
function galleryHTML(c){
  if(!c.gallery.length&&!canEdit())return '';
  let h=`<h3 style="margin-top:22px">${T('gallery')}</h3><div class="gallery">`;
  c.gallery.forEach((ref,i)=>{h+=`<div class="gi"><img data-gref="${esc(ref)}" alt="">${canEdit()?`<button data-act="galrm" data-id="${esc(c.id)}" data-i="${i}">✕</button>`:''}</div>`;});
  if(canEdit())h+=`<button class="gadd" data-act="galadd" data-id="${esc(c.id)}">${T('addImg')}</button><button class="gadd" data-act="gallink" data-id="${esc(c.id)}">${T('addLink')}</button>`;
  return h+'</div>';
}
function openCard(id,opt){
  opt=opt||{};const c=byId(id);if(!c)return;openCardId=id;
  const sib=modCards(c.module),i=sib.findIndex(x=>x.id===id),prev=sib[i-1],next=sib[i+1];
  const title=prefs.lang==='en'?(c.titleEn||c.titleBn):(c.titleBn||c.titleEn);
  const html=`<div class="shead" style="--cc:${esc(c.color)}"><div class="iconbox">${esc(c.emoji)}</div><div><h2>${esc(title)}</h2><div class="meta">${MODS[c.module].e} ${L(MODS[c.module])} · ${esc(c.cat)} · ${T('step')} ${i+1}/${sib.length}</div></div></div>
  <div class="sacts">
    <div class="seg"><button class="${prefs.lang==='bn'?'active':''}" data-act="lang" data-v="bn">বাংলা</button><button class="${prefs.lang==='en'?'active':''}" data-act="lang" data-v="en">English</button></div>
    <button class="chip${prefs.done[id]?' active':''}" data-act="done" data-id="${esc(id)}">${prefs.done[id]?T('isDone'):T('markDone')}</button>
    <button class="chip${prefs.fav[id]?' active':''}" data-act="fav" data-id="${esc(id)}">${prefs.fav[id]?T('isFav'):T('fav')}</button>
  </div>
  <div class="content" id="cbody"></div>
  <div id="cgal">${galleryHTML(c)}</div>
  <div class="navrow"><button data-act="open" data-id="${prev?esc(prev.id):''}" ${prev?'':'disabled'}>${T('prev')}</button><button class="nx" data-act="open" data-id="${next?esc(next.id):''}" ${next?'':'disabled'}>${T('next')}</button></div>
  ${canEdit()?`<div class="actions"><button class="btn-del" data-act="del" data-id="${esc(id)}">${T('del')}</button><button class="btn-save" data-act="edit" data-id="${esc(id)}">${T('edit')}</button></div>`:''}
  <div class="actions"><button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  if(sheetMode==='card'&&$('#overlay').classList.contains('open')){const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;if(!opt.keepScroll)s.scrollTop=0;}
  else openSheet(html,'card');
  const body=$('#cbody');body.innerHTML=bodyOf(c);
  body.querySelectorAll('.imgslot').forEach(el=>fillSlot(el,c));
  document.querySelectorAll('#cgal img[data-gref]').forEach(img=>{const ref=img.dataset.gref;const s=imgSrc(ref);
    if(s)img.src=s;else ensureImg(ref).then(()=>{const s2=imgSrc(ref);if(s2)img.src=s2;});img.addEventListener('click',()=>viewImage(img.src,''));});
  if(opt.terms)markInContent(body,opt.terms);
}
function refreshOpenCard(){if(openCardId&&sheetMode==='card'){const s=$('#sheet'),st=s.scrollTop;openCard(openCardId,{keepScroll:true});s.scrollTop=st;}}

/* ---------- card menu ---------- */
let delArm=null,delTimer=null;
function openMenu(id){
  const c=byId(id);if(!c)return;const cur=prefs.cardSize[id]||'';
  const title=prefs.lang==='en'?(c.titleEn||c.titleBn):(c.titleBn||c.titleEn);
  let h=`<div class="shead" style="--cc:${esc(c.color)}"><div class="iconbox">${esc(c.emoji)}</div><div><h2>${esc(title)}</h2><div class="meta">${L(MODS[c.module])} · ${esc(c.cat)}</div></div></div>
  <div class="field"><label>${T('size')}</label><div class="seg">${['','xs','s','m','l'].map(s=>`<button class="${s===cur?'active':''}" data-act="cardsize" data-id="${esc(id)}" data-sz="${s}">${s?s.toUpperCase():'Auto'}</button>`).join('')}</div></div>`;
  if(canEdit()){
    h+=`<div class="row" style="margin-bottom:10px"><button class="btn btn-cancel" data-act="move" data-id="${esc(id)}" data-d="-1">${T('moveUp')}</button><button class="btn btn-cancel" data-act="move" data-id="${esc(id)}" data-d="1">${T('moveDown')}</button></div>
    <div class="row" style="margin-bottom:10px"><button class="btn btn-cancel" data-act="dup" data-id="${esc(id)}">${T('dup')}</button><button class="btn btn-save" data-act="edit" data-id="${esc(id)}">${T('edit')}</button></div>
    <div class="actions"><button class="btn-del" data-act="del" data-id="${esc(id)}">${T('del')}</button></div>`;
  }
  h+=`<div class="actions"><button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  openSheet(h,'menu');
}
function moveCard(id,d){
  const c=byId(id);const sib=modCards(c.module);const i=sib.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=sib.length)return;
  commit(()=>{const a=byId(sib[i].id),b=byId(sib[j].id);const t=a.order;a.order=b.order;b.order=t;if(a.order===b.order)a.order+=d;});
  toast(d<0?T('moveUp'):T('moveDown'));
}
function deleteCard(id,btn){
  if(delArm!==id){delArm=id;if(btn)btn.textContent=T('delConfirm');clearTimeout(delTimer);delTimer=setTimeout(()=>{delArm=null;if(btn)btn.textContent=T('del');},4000);return;}
  delArm=null;commit(()=>{data.cards=data.cards.filter(c=>c.id!==id);});closeSheet();toast(T('deleted'));
}

/* ---------- editor ---------- */
let edState=null;
function rtbar(t){
  return `<div class="rtbar">
  <button type="button" data-rt="bold" data-t="${t}"><b>B</b></button><button type="button" data-rt="italic" data-t="${t}"><i>I</i></button><button type="button" data-rt="underline" data-t="${t}"><u>U</u></button>
  <button type="button" data-rt="h3" data-t="${t}">H</button><button type="button" data-rt="ul" data-t="${t}">• —</button><button type="button" data-rt="ol" data-t="${t}">1.</button>
  <button type="button" data-rt="box" data-t="${t}">▢ Box</button><button type="button" data-rt="tip" data-t="${t}">✅ Tip</button><button type="button" data-rt="warn" data-t="${t}">⚠ Warn</button>
  <button type="button" data-rt="slot" data-t="${t}">📷 ছবির জায়গা</button>
  <button type="button" data-rt="big" data-t="${t}">A+</button><button type="button" data-rt="small" data-t="${t}">A−</button><button type="button" data-rt="clear" data-t="${t}">⌫</button></div>`;
}
function prepEditor(el){
  el.querySelectorAll('.imgslot').forEach(s=>{s.setAttribute('contenteditable','false');s.textContent='📷 '+(s.dataset.cap||'image');});
  el.querySelectorAll('.linkbtn').forEach(s=>s.setAttribute('contenteditable','false'));
}
function cleanEditor(el){
  const w=el.cloneNode(true);
  w.querySelectorAll('.imgslot').forEach(s=>{s.innerHTML='';s.removeAttribute('contenteditable');s.classList.remove('filled','loadingimg');});
  w.querySelectorAll('.linkbtn').forEach(s=>s.removeAttribute('contenteditable'));
  w.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  return w.innerHTML.trim();
}
function catOptions(mod,sel){return data.cats[mod].map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')+`<option value="__new__">＋ ${T('newCat')}…</option>`;}
function openEditor(id){
  const isNew=!id;const c=isNew?normCard({id:'new',module:prefs.module==='lung'||prefs.module==='echo'?prefs.module:'echo',cat:'',color:COLORS[Math.floor(Math.random()*COLORS.length)],emoji:'📄'}):clone(byId(id));
  if(!isNew&&!byId(id))return;
  edState={isNew,id:c.id,color:c.color};
  const h=`<h2>${isNew?T('newCard_'):T('editCard')}</h2><div class="sub">${esc(c.titleBn||c.titleEn||'')}</div>
  <div class="row"><div class="field"><label>${T('fModule')}</label><select id="f_mod">${MOD_ORDER.map(m=>`<option value="${m}" ${m===c.module?'selected':''}>${MODS[m].e} ${MODS[m].en}</option>`).join('')}</select></div>
  <div class="field"><label>${T('fCat')}</label><select id="f_cat">${catOptions(c.module,c.cat)}</select></div></div>
  <div class="row"><div class="field" style="flex:0 0 90px"><label>${T('fEmoji')}</label><input id="f_emoji" value="${esc(c.emoji)}" maxlength="4"></div>
  <div class="field"><label>${T('fColor')}</label><input id="f_color" type="color" value="${esc(c.color)}" style="height:44px;padding:4px"><div class="palette">${COLORS.map(x=>`<i style="background:${x}" data-act="pickcolor" data-v="${x}" class="${x===c.color?'on':''}"></i>`).join('')}</div></div></div>
  <div class="field"><label>${T('fTitleBn')}</label><input id="f_tbn" value="${esc(c.titleBn)}"></div>
  <div class="field"><label>${T('fTitleEn')}</label><input id="f_ten" value="${esc(c.titleEn)}"></div>
  <div class="field"><label>${T('fBodyBn')}</label>${rtbar('bbn')}<div class="editor" id="f_bbn" contenteditable="true" data-ph="${esc(T('phBn'))}"></div></div>
  <div class="field"><label>${T('fBodyEn')}</label>${rtbar('ben')}<div class="editor" id="f_ben" contenteditable="true" data-ph="${esc(T('phEn'))}"></div></div>
  <div class="actions"><button class="btn-cancel" data-act="close">${T('cancel')}</button><button class="btn-save" data-act="saveedit">${T('save')}</button></div>`;
  openSheet(h,'edit');
  const bb=$('#f_bbn'),be=$('#f_ben');bb.innerHTML=c.bodyBn;be.innerHTML=c.bodyEn;prepEditor(bb);prepEditor(be);
  $('#f_mod').onchange=()=>{$('#f_cat').innerHTML=catOptions($('#f_mod').value,'');};
  $('#f_cat').onchange=()=>{if($('#f_cat').value==='__new__'){const n=(prompt(T('newCat'))||'').trim();const m=$('#f_mod').value;
    if(n){if(!data.cats[m].includes(n))edState.newCat={m,n};$('#f_cat').insertAdjacentHTML('afterbegin',`<option>${esc(n)}</option>`);$('#f_cat').value=n;}else $('#f_cat').selectedIndex=0;}};
}
function saveEditor(){
  const v=id=>$('#'+id).value;
  const vals={module:v('f_mod'),cat:v('f_cat')==='__new__'?'':v('f_cat'),emoji:v('f_emoji')||'📄',color:v('f_color'),titleBn:v('f_tbn').trim(),titleEn:v('f_ten').trim(),
    bodyBn:cleanEditor($('#f_bbn')),bodyEn:cleanEditor($('#f_ben'))};
  if(!vals.titleBn&&!vals.titleEn){$('#f_tbn').focus();return;}
  const st=edState;
  commit(()=>{
    if(st.newCat&&!data.cats[st.newCat.m].includes(st.newCat.n))data.cats[st.newCat.m].push(st.newCat.n);
    const maxO=m=>modCards(m).reduce((a,c)=>Math.max(a,c.order),0);
    if(st.isNew)data.cards.push(normCard({...vals,id:rid('c'),order:maxO(vals.module)+10}));
    else{const c=byId(st.id);if(c.module!==vals.module)vals.order=maxO(vals.module)+10;Object.assign(c,vals);}
  });
  closeSheet();toast(T('saved_'));
}
function rtCmd(cmd,t){
  const ed=$('#f_'+t);if(!ed)return;ed.focus();const sel=window.getSelection();const txt=sel&&sel.rangeCount?sel.toString():'';
  const ins=h=>document.execCommand('insertHTML',false,h);
  switch(cmd){
    case 'bold':case 'italic':case 'underline':document.execCommand(cmd);break;
    case 'h3':document.execCommand('formatBlock',false,'h3');break;
    case 'ul':document.execCommand('insertUnorderedList');break;
    case 'ol':document.execCommand('insertOrderedList');break;
    case 'box':case 'tip':case 'warn':ins(`<div class="${cmd}">${esc(txt)||'…'}</div><p><br></p>`);break;
    case 'slot':{const cap=(prompt(T('slotAsk'))||'').trim();if(!cap)return;ins(`<div class="imgslot" data-slot="${rid('s')}" data-cap="${esc(cap)}" contenteditable="false">📷 ${esc(cap)}</div><p><br></p>`);break;}
    case 'big':case 'small':if(!txt){toast(T('selectFirst'));return;}ins(`<span class="${cmd}">${esc(txt)}</span>`);break;
    case 'clear':document.execCommand('removeFormat');document.execCommand('formatBlock',false,'p');break;
  }
}

async function exportData(){
  const images={};const refs=new Set();data.cards.forEach(c=>{Object.values(c.slots).forEach(r=>refs.add(r));c.gallery.forEach(r=>refs.add(r));});
  for(const r of refs){if(r.startsWith('img:')){await ensureImg(r);const s=imgSrc(r);if(s)images[r.slice(4)]=s;}}
  const blob=new Blob([JSON.stringify({app:'POCUS USG',version:SEED_VERSION,exported:new Date().toISOString(),cards:data.cards,cats:data.cats,images})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pocus-usg-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importData(){
  const inp=$('#importPicker');inp.value='';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{
    try{let d=JSON.parse(ev.target.result);if(d.state&&d.state.cards)d=d.state;
      let pkg;if(d.app==='POCUS USG'&&Array.isArray(d.cards))pkg={cards:d.cards.map(normCard),cats:normCats(d.cats),images:d.images||{}};
      else if(Array.isArray(d.cards))pkg=fromLegacy(d);else throw 0;
      for(const id of Object.keys(pkg.images)){const img=await shrinkDataURL(pkg.images[id]);if(cloudOn){await POCUS.putImage(id,img);imgMem[id]=img;}else localImgs[id]=img;}
      if(!cloudOn)saveImgsLocal();
      commit(()=>{data.cards=pkg.cards;data.cats=pkg.cats;});closeSheet();toast(T('imported'));
    }catch(e){toast(T('importFail'));}};r.readAsText(f);};
  inp.click();
}
function addMissing(){
  const have=new Set(data.cards.map(c=>c.id));const miss=seedCards().filter(c=>!have.has(c.id));
  if(!miss.length){toast(T('nothing'));return;}
  commit(()=>{miss.forEach(c=>{c.order=modCards(c.module).reduce((a,x)=>Math.max(a,x.order),0)+10;data.cards.push(c);});
    MOD_ORDER.forEach(m=>DEFAULT_CATS[m].forEach(x=>{if(!data.cats[m].includes(x))data.cats[m].push(x);}));});
  toast(miss.length+' '+T('added'));
}

/* ---------- diagnosis tools ---------- */
let dx=null;
function openTools(){
  const h=`<h2>${T('tools')}</h2><div class="sub">${T('toolsSub')}</div>`+Object.entries(DX_TREES).map(([k,t])=>`<div class="toolcard" style="--cc:${t.color}" data-act="dx" data-v="${k}"><div class="te">${t.emoji}</div><div><b>${esc(L(t.title))}</b><br><small>${esc(L(t.sub))}</small></div></div>`).join('')+
  `<div class="actions"><button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  openSheet(h,'tools');
}
function startDx(k){dx={k,node:DX_TREES[k].start,stack:[],path:[]};renderDx();}
function renderDx(){
  const tree=DX_TREES[dx.k];let inner='';
  const depth=dx.stack.length;const total=Math.max(depth+1,3);
  const prog=`<div class="dxprog">${Array.from({length:total},(_,i)=>`<span class="${i<depth?'on':''}"></span>`).join('')}</div>`;
  if(dx.node.startsWith('r:')){
    const r=tree.results[dx.node.slice(2)];
    inner=`<div class="dxres"><div class="badge">${esc(r.badge)}</div><div style="color:var(--muted);font-size:.85rem;margin-top:8px">${T('likely')}</div><div class="dz">${esc(L(r.dz))}</div><div class="path">${dx.path.map(esc).join('  →  ')}</div></div>
    <div class="dxact"><b>${T('action')}</b>${L(r.act)}</div>
    ${r.card&&byId(r.card)?`<button class="btn btn-cancel" style="width:100%;margin-top:12px" data-act="opencard" data-id="${r.card}">${T('readMore')}</button>`:''}
    <div class="dxwarn">${esc(L(DX_WARN))}</div>
    <div class="actions"><button class="btn-cancel" data-act="dxback">${T('back')}</button><button class="btn-save" data-act="dx" data-v="${dx.k}">${T('again')}</button></div>
    <div class="actions"><button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  }else{
    const n=tree.nodes[dx.node];
    inner=prog+`<div class="dxq">${esc(L(n.q))}</div><div class="dxsub">${esc(L(n.s))}</div>`+
      n.opts.map((o,i)=>`<button class="dxopt" data-act="dxpick" data-i="${i}"><b>${esc(L(o.l))}</b>${L(o.d)?`<small>${esc(L(o.d))}</small>`:''}</button>`).join('')+
      `<div class="actions">${depth?`<button class="btn-cancel" data-act="dxback">${T('back')}</button>`:`<button class="btn-cancel" data-act="tools">${T('back')}</button>`}<button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  }
  openSheet(`<h2>${tree.emoji} ${esc(L(tree.title))}</h2><div class="sub">${esc(L(tree.sub))}</div>`+inner,'dx');
}
function dxPick(i){const n=DX_TREES[dx.k].nodes[dx.node];const o=n.opts[i];dx.stack.push(dx.node);dx.path.push(L(o.l));dx.node=o.next;renderDx();}
function dxBack(){if(!dx.stack.length)return;dx.node=dx.stack.pop();dx.path.pop();renderDx();}

/* ---------- cases ---------- */
let cs={f:'all',lv:'all',i:0,show:false};
function caseList(){return ALL_CASES.filter(c=>(cs.f==='all'||c.module===cs.f)&&(cs.lv==='all'||c.lvl===cs.lv));}
function openCases(f,cid){cs.f=f||cs.f||'all';if(cid)cs.lv='all';const list=caseList();cs.i=cid?Math.max(0,list.findIndex(c=>c.cid===cid)):0;cs.show=!!cid;renderCase();}
function renderCase(){
  const list=caseList();if(!list.length){cs.lv='all';return renderCase();}
  if(cs.i>=list.length)cs.i=0;const c=list[cs.i];
  if(!prefs.caseDone)prefs.caseDone={};
  const nDone=list.filter(x=>prefs.caseDone[x.cid]).length;
  const tabs=`<div class="seg" style="margin-bottom:8px">${[['all',T('all')],['lung','🫁 Lung'],['echo','🫀 Echo']].map(x=>`<button class="${cs.f===x[0]?'active':''}" data-act="casef" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="toolbar" style="padding:0 0 8px">${[['all',T('all')],['easy',T('lvl').easy],['mid',T('lvl').mid],['hard',T('lvl').hard]].map(x=>`<button class="chip${cs.lv===x[0]?' active':''}" data-act="caselv" data-v="${x[0]}">${x[1]}</button>`).join('')}<span class="sp"></span><button class="chip" data-act="caserand">🎲 ${T('random')}</button></div>`;
  const done=prefs.caseDone[c.cid];
  const ans=cs.show?`<div class="caseans"><h4>${T('answer')}</h4>${prefs.lang==='en'?c.aEn:c.aBn}</div>
    <button class="btn ${done?'btn-save':'btn-cancel'}" style="width:100%;margin-top:10px" data-act="casedone">${done?T('caseDoneY'):T('caseDoneQ')}</button>`
    :`<button class="btn btn-save" style="width:100%;margin-top:6px" data-act="casereveal">${T('show')}</button>`;
  const h=`<h2>🧠 ${T('casesT')} <span class="lvl ${c.lvl}">${T('lvl')[c.lvl]}</span>${done?' <span class="lvl easy">✓</span>':''}</h2><div class="sub">${T('casesSub')}</div>${tabs}
  <div class="casenum">${MODS[c.module].e} ${L(MODS[c.module])} · ${T('caseLbl')} ${cs.i+1} ${T('of')} ${list.length} · ✓ ${nDone}</div>
  <div class="casescenario">${prefs.lang==='en'?c.sEn:c.sBn}</div><div class="caseq">${prefs.lang==='en'?c.qEn:c.qBn}</div>${ans}
  <div class="navrow"><button data-act="casego" data-d="-1">${T('prevC')}</button><button class="nx" data-act="casego" data-d="1">${T('nextC')}</button></div>
  <div class="actions"><button class="btn-cancel" data-act="close">${T('close')}</button></div>`;
  openSheet(h,'case');
}

/* ---------- auth & cloud ---------- */
function showLogin(msg){$('#loading').style.display='none';$('#login').classList.add('show');$('#l_err').textContent=msg||'';}
function hideLogin(){$('#login').classList.remove('show');}
async function ensureCloudSeed(){
  let n;try{n=await POCUS.serverCardCount();}catch(e){return;}
  if(n>0)return;
  seeding=true;toast(T('seeding'));
  try{
    const legacy=await POCUS.loadLegacy();
    const src=legacy&&Array.isArray(legacy.cards)&&legacy.cards.length?fromLegacy(legacy):{cards:data.cards,cats:data.cats,images:{}};
    const refs=new Set();src.cards.forEach(c=>{Object.values(c.slots).forEach(r=>refs.add(r));c.gallery.forEach(r=>refs.add(r));});
    for(const r of refs){if(!r.startsWith('img:'))continue;const id=r.slice(4);const d=src.images[id]||localImgs[id];if(d){const s=await shrinkDataURL(d);await POCUS.putImage(id,s);imgMem[id]=s;}}
    await POCUS.putCardsBatch(src.cards);await POCUS.putMeta({cats:src.cats,seedVersion:SEED_VERSION});
    data.cards=src.cards;data.cats=src.cats;saveData();toast(T('seeded'));
  }catch(e){console.warn(e);toast(T('saveFail')+(e&&e.code?' ('+e.code+')':''));}
  seeding=false;
}
function onRemoteCards(list){
  if(seeding||!list.length)return;
  data.cards=list.map(normCard).sort(byOrder);IDX=null;saveData();renderAll();
}
/* login screen modes */

function showLoginBox(){$('#loginBox').style.display='';$('#waitBox').style.display='none';}
let cloudStarted=false,usersList=[];
async function startCloud(user){
  if(cloudStarted)return;cloudStarted=true;
  currentUser=user;cloudOn=true;
  hideLogin();showLoginBox();$('#loading').style.display='none';renderAll();
  if(!isAdmin){try{await POCUS.claimSession(user.uid);POCUS.watchSession(user.uid,()=>{toast(T('kicked'));setTimeout(()=>POCUS.logout(),1200);});}catch(e){}}
  else POCUS.watchUsers(list=>{usersList=list;updateUserDot();if(sheetMode==='settings')openSettings();});
  POCUS.watchMeta(m=>{if(m&&m.cats&&!seeding){data.cats=normCats(m.cats);saveData();renderCats();}});
  if(isAdmin)await ensureCloudSeed();
  POCUS.watchCards(onRemoteCards,err=>console.warn(err));
}
function updateUserDot(){const n=usersList.filter(u=>u.status==='pending').length;const b=$('#setBtn');const d=b.querySelector('.dot');
  if(n&&!d)b.insertAdjacentHTML('beforeend','<span class="dot"></span>');if(!n&&d)d.remove();}
function boot(){
  if(started)return;started=true;
  if(!window.POCUS||!POCUS.ready()){$('#loading').style.display='none';renderAll();toast(T('offline'));return;}
  $('#l_btn').onclick=doLogin;$('#l_pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('#l_toggle').onclick=()=>setLoginMode(!regMode);
  $('#l_forgot').onclick=async()=>{const em=$('#l_email').value.trim();if(!em){$('#l_err').className='err';$('#l_err').textContent='আগে Email লিখুন';return;}
    try{await POCUS.resetPassword(em);$('#l_err').className='err ok';$('#l_err').textContent='Password বদলানোর লিংক ইমেইলে পাঠানো হয়েছে';}catch(e){$('#l_err').className='err';$('#l_err').textContent='লিংক পাঠানো গেল না';}};
  $('#w_logout').onclick=()=>POCUS.logout();
  POCUS.onAuth(async user=>{
    if(!user){cloudOn=false;isAdmin=false;currentUser=null;editMode=false;cloudStarted=false;usersList=[];updateUserDot();setLoginMode(false);showLoginBox();showLogin();return;}
    isAdmin=POCUS.isAdminEmail(user.email);
    if(isAdmin){startCloud(user);return;}
    /* colleagues: need admin approval */
    let me;try{me=await POCUS.ensureUserDoc(user);}catch(e){showLoginBox();showLogin('সংযোগে সমস্যা — আবার চেষ্টা করুন');return;}
    POCUS.watchMyUser(user.uid,d=>{
      const st=d&&d.status||'pending';
      if(st==='approved')startCloud(user);
      else if(cloudStarted){toast(st==='blocked'?'প্রবেশাধিকার বন্ধ করা হয়েছে':'অনুমোদন তুলে নেওয়া হয়েছে');setTimeout(()=>POCUS.logout(),1200);}
      else showWait(st,user.email);
    });
  });
}
async function doLogin(){
  const email=$('#l_email').value.trim(),pass=$('#l_pass').value,btn=$('#l_btn'),err=$('#l_err');err.className='err';
  if(!email||!pass){err.textContent='Email ও password দিন';return;}
  if(regMode&&!$('#l_name').value.trim()){err.textContent='আপনার নাম লিখুন';return;}
  if(regMode&&pass.length<6){err.textContent='Password কমপক্ষে ৬ অক্ষর';return;}
  btn.disabled=true;err.textContent='';
  try{if(regMode)await POCUS.register($('#l_name').value,email,pass);else await POCUS.login(email,pass);}
  catch(e){const m={'auth/invalid-credential':'Email বা password ভুল','auth/invalid-email':'Email ঠিক নয়','auth/user-not-found':'এই ইউজার নেই','auth/wrong-password':'Password ভুল','auth/too-many-requests':'অনেকবার চেষ্টা — একটু পরে দেখুন','auth/network-request-failed':'ইন্টারনেট সংযোগ নেই','auth/email-already-in-use':'এই Email দিয়ে আগেই অ্যাকাউন্ট আছে — Login করুন','auth/weak-password':'Password আরও শক্ত দিন'}[e.code]||(regMode?'অ্যাকাউন্ট খোলা গেল না':'লগইন ব্যর্থ');showLogin(m);}
  btn.disabled=false;
}
/* the Firebase module loads after this script — wait for it, but never hang */
window.addEventListener('pocus-ready',boot);
if(window.POCUS)boot();
setTimeout(()=>{if(!started)boot();},6000);
applyPrefs();renderChips();
</script>
