<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fef2f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POCUS USG">
<title>POCUS USG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Roboto:wght@400;700&family=Poppins:wght@400;600;700&family=Nunito:wght@400;700&family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Baloo+Da+2:wght@400;600;700&family=Anek+Bangla:wght@400;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Inter','Hind Siliguri',system-ui,sans-serif;
  --fs:16px;
  --bg:#fef2f4;--bg2:#fff;--card:#fff;--text:#1f2430;--muted:#8a93a6;--border:#eceef3;
  --accent:#e5799a;--accent2:#5b9f88;--onacc:#fff;--shadow:0 2px 10px rgba(30,40,70,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font-ui);font-size:var(--fs);background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:100px;-webkit-text-size-adjust:100%}
button{font-family:inherit}
input,select,textarea{font-size:16px}

/* ---------- THEMES ---------- */
body[data-theme="rose"]{--bg:#fef2f4;--bg2:#fff;--card:#fff;--text:#1f2430;--muted:#8a93a6;--border:#eceef3;--accent:#e5799a;--accent2:#5b9f88;--onacc:#fff}
body[data-theme="mint"]{--bg:#eef7f3;--bg2:#fff;--card:#fff;--text:#16241f;--muted:#7d9088;--border:#e2efe9;--accent:#2f9e78;--accent2:#e59b4a;--onacc:#fff}
body[data-theme="sky"]{--bg:#eef4fb;--bg2:#fff;--card:#fff;--text:#15202e;--muted:#7e8ba0;--border:#e3ecf5;--accent:#3b82d4;--accent2:#ec8aa8;--onacc:#fff}
body[data-theme="lavender"]{--bg:#f4f1fb;--bg2:#fff;--card:#fff;--text:#221f2e;--muted:#8d879e;--border:#ebe7f5;--accent:#8b6fd0;--accent2:#e59b4a;--onacc:#fff}
body[data-theme="sand"]{--bg:#fbf6ee;--bg2:#fff;--card:#fff;--text:#2a2318;--muted:#9a9080;--border:#f0e9db;--accent:#c27a2c;--accent2:#5b9f88;--onacc:#fff}
body[data-theme="peach"]{--bg:#fff3ec;--bg2:#fff;--card:#fff;--text:#2b1d17;--muted:#9a8579;--border:#f6e4da;--accent:#ea7a4f;--accent2:#4e9bb9;--onacc:#fff}
body[data-theme="lemon"]{--bg:#fbf9e8;--bg2:#fff;--card:#fff;--text:#24220f;--muted:#8d8a6c;--border:#efecd2;--accent:#a8860f;--accent2:#5b8fd0;--onacc:#fff}
body[data-theme="aqua"]{--bg:#ebf8f9;--bg2:#fff;--card:#fff;--text:#122426;--muted:#7a9396;--border:#dbeff1;--accent:#1597a3;--accent2:#e5799a;--onacc:#fff}
body[data-theme="berry"]{--bg:#fbf0f6;--bg2:#fff;--card:#fff;--text:#2a1622;--muted:#97808c;--border:#f3e1ea;--accent:#c2367a;--accent2:#3aa38a;--onacc:#fff}
body[data-theme="pearl"]{--bg:#f4f5f7;--bg2:#fff;--card:#fff;--text:#1d2128;--muted:#848b97;--border:#e6e8ec;--accent:#475569;--accent2:#e5799a;--onacc:#fff}
body[data-theme="ocean"]{--bg:#0b1220;--bg2:#121a2b;--card:#1a2336;--text:#e8eefc;--muted:#9fb0d0;--border:#263251;--accent:#14b8a6;--accent2:#f59e0b;--onacc:#06211d;--shadow:none}
body[data-theme="midnight"]{--bg:#05070d;--bg2:#0a0f1a;--card:#111826;--text:#dce6fa;--muted:#8295b5;--border:#1c2740;--accent:#38bdf8;--accent2:#818cf8;--onacc:#05151f;--shadow:none}
body[data-theme="slate"]{--bg:#0d0f12;--bg2:#15181d;--card:#1d2127;--text:#e7ebf0;--muted:#a3adba;--border:#2a2f38;--accent:#22d3ee;--accent2:#f59e0b;--onacc:#06212a;--shadow:none}
body[data-theme="forest"]{--bg:#0c1612;--bg2:#13211b;--card:#1a2c24;--text:#e6f4ec;--muted:#9bb8a8;--border:#25402f;--accent:#4ade80;--accent2:#f59e0b;--onacc:#052e16;--shadow:none}
body[data-theme="plum"]{--bg:#140f1a;--bg2:#1c1524;--card:#251c30;--text:#efe6fa;--muted:#b3a3c8;--border:#382a48;--accent:#c084fc;--accent2:#f472b6;--onacc:#1f0a33;--shadow:none}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logomark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.logomark svg{width:24px;height:24px}
.lt{font-weight:700;font-size:1.1rem;line-height:1.1}
.ls{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--border);color:var(--accent);width:40px;height:40px;border-radius:12px;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.iconbtn:active{transform:scale(.92)}
.iconbtn.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}

/* ---------- SEARCH ---------- */
.searchwrap{padding:12px 16px 2px}
.searchbox{position:relative}
.searchbox .sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.searchbox input{width:100%;padding:14px 44px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;box-shadow:var(--shadow)}
.searchbox input:focus{outline:2px solid var(--accent);border-color:transparent}
.searchbox input::placeholder{color:var(--muted)}
.searchbox .sclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--border);color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;display:none}
.schips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.schips::-webkit-scrollbar{display:none}
.schip{flex:0 0 auto;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:5px 11px;border-radius:999px;font-size:.78rem;cursor:pointer;white-space:nowrap}

/* ---------- MODULE TABS ---------- */
.modtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px 4px}
.modtab{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:9px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text);box-shadow:var(--shadow)}
.modtab .me{font-size:1.25rem;line-height:1.2}
.modtab .mn{font-weight:700;font-size:.85rem}
.modtab .mp{font-size:.66rem;color:var(--muted)}
.modtab.active{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.modtab.active .mp{color:var(--onacc);opacity:.85}

/* ---------- ICU ROUND BAR ---------- */
.sectitle{padding:10px 16px 2px;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.roundbar{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 6px;scrollbar-width:none}
.roundbar::-webkit-scrollbar{display:none}
.rpill{flex:0 0 auto;border:0;border-radius:14px;padding:9px 14px;cursor:pointer;color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(0,0,0,.08);background:linear-gradient(135deg,var(--rc),color-mix(in srgb,var(--rc) 70%,#000))}
.rpill:active{transform:scale(.95)}

/* ---------- TOOLBARS ---------- */
.toolbar{padding:6px 16px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:999px;font-size:.8rem;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:600}
.toolbar .sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 10px;cursor:pointer;font-size:.82rem}
.seg button.active{background:var(--accent);color:var(--onacc);font-weight:600}

/* ---------- GRID & CARDS ---------- */
.grid{padding:8px 16px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grouphdr{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:.8rem;margin-top:8px;display:flex;align-items:center;gap:8px}
.grouphdr:after{content:"";flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px 13px 13px 17px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:96px;box-shadow:var(--shadow);transition:transform .12s ease}
.card:active{transform:scale(.97)}
.card:before{content:"";position:absolute;inset:0;background:var(--cc);opacity:.08;pointer-events:none}
.card .accentbar{position:absolute;top:0;left:0;bottom:0;width:5px;background:var(--cc)}
.card .iconbox{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.4rem;background:var(--cc);box-shadow:0 2px 6px color-mix(in srgb,var(--cc) 45%,transparent);position:relative;flex:0 0 auto}
.card .cat{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;position:relative}
.card .ttl{font-weight:700;font-size:.98rem;position:relative;line-height:1.3}
.card .txtwrap{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.card .badges{position:absolute;top:6px;right:34px;display:flex;gap:4px;font-size:.75rem;z-index:2}
.card .bdone{background:#2f9e78;color:#fff;border-radius:999px;width:18px;height:18px;display:grid;place-items:center;font-size:.65rem}
.card .stepno{font-size:.62rem;font-weight:700;color:var(--cc);position:relative}
.card .more{position:absolute;top:4px;right:4px;z-index:3;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:1.15rem;cursor:pointer;display:grid;place-items:center}
.card .more:active{background:var(--border)}
.card.xs{grid-column:span 1;min-height:76px;padding:11px 9px 11px 13px;gap:6px}
.card.s{grid-column:span 2;min-height:80px}
.card.m{grid-column:span 2;min-height:118px}
.card.l{grid-column:span 4;min-height:96px}
.card.s,.card.l{flex-direction:row;align-items:center;gap:12px}
.card.xs .iconbox{width:32px;height:32px;font-size:1.05rem;border-radius:10px}
.card.xs .ttl{font-size:.86rem;line-height:1.25}
.card.xs .cat{font-size:.58rem}
.card.l .iconbox{width:50px;height:50px;font-size:1.7rem}
.card.m .ttl{font-size:1.05rem}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.card.xs,.card.s{grid-column:span 1}.card.m,.card.l{grid-column:span 2}.card.s{flex-direction:column;align-items:flex-start;gap:8px}}
/* tile styles */
body[data-tile="solid"] .card{background:var(--cc);border-color:transparent;color:#fff}
body[data-tile="solid"] .card:before,body[data-tile="solid"] .card .accentbar{display:none}
body[data-tile="solid"] .card .cat,body[data-tile="solid"] .card .more,body[data-tile="solid"] .card .stepno{color:rgba(255,255,255,.85)}
body[data-tile="solid"] .card .iconbox{background:rgba(255,255,255,.22);box-shadow:none}
body[data-tile="outline"] .card{border:2px solid color-mix(in srgb,var(--cc) 55%,transparent)}
body[data-tile="outline"] .card:before,body[data-tile="outline"] .card .accentbar{display:none}
body[data-tile="outline"] .card .iconbox{background:color-mix(in srgb,var(--cc) 18%,transparent);box-shadow:none}

/* ---------- SEARCH RESULTS ---------- */
.results{padding:6px 16px 20px;display:none}
.results.show{display:block}
.reshead{font-size:.8rem;color:var(--muted);margin:6px 2px 10px}
.res{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--cc,var(--accent));border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:11px}
.res .re{font-size:1.4rem;line-height:1.2}
.res .rt{font-weight:700}
.res .rm{font-size:.7rem;color:var(--muted);margin:1px 0 3px}
.res .rs{font-size:.85rem;color:var(--muted);line-height:1.5}
mark{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}

/* ---------- BOTTOM BAR ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(30,40,70,.06)}
.bottombar button{flex:1;border:1px solid var(--border);border-radius:14px;padding:11px 6px;font-size:.86rem;font-weight:600;cursor:pointer;background:var(--card);color:var(--text)}
.bottombar button.primary{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.bottombar button:disabled{opacity:.4}

/* ---------- SHEET ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:720px;height:94vh;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:22px 22px 0 0;border:1px solid var(--border);border-bottom:0;padding:16px 18px calc(40px + env(safe-area-inset-bottom))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-size:1.15rem}
.sheet .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.shead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.shead .iconbox{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--cc);flex:0 0 auto}
.shead .meta{font-size:.75rem;color:var(--muted)}
.sacts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button,.btn{flex:1;padding:12px;border-radius:12px;border:0;font-weight:600;cursor:pointer}
.btn-save{background:var(--accent);color:var(--onacc)}
.btn-cancel{background:var(--card);color:var(--text);border:1px solid var(--border)!important}
.btn-del{background:#ef4444;color:#fff}
.hr{height:1px;background:var(--border);margin:18px 0}

/* ---------- CONTENT ---------- */
.content h3{margin:20px 0 8px;color:var(--accent);font-size:1.05rem;padding-left:10px;border-left:4px solid var(--accent);line-height:1.35}
.content p{margin:8px 0}
.content ul,.content ol{margin:8px 0;padding-left:22px}
.content li{margin:3px 0}
.content .big{font-size:1.25em}.content .small{font-size:.82em}
.content svg{max-width:100%;height:auto;display:block;margin:12px 0;border-radius:12px;background:#0f1117;border:1px solid var(--border)}
.content .figcap{color:var(--muted);font-size:.8rem;text-align:center;margin:-4px 0 14px}
.content .box,.content .tip,.content .warn{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 13px;margin:12px 0}
.content .tip{border-left-color:#2f9e78;background:color-mix(in srgb,#2f9e78 8%,var(--card))}
.content .warn{border-left-color:#e0803a;background:color-mix(in srgb,#e0803a 9%,var(--card))}
.content .warn ul{margin:6px 0 0}
.content table.mini{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92em}
.content table.mini td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.content table.mini td:first-child{color:var(--muted);padding-right:12px;min-width:90px;font-weight:600}
.content pre.report{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:.74rem;overflow-x:auto;white-space:pre;line-height:1.5}
.content img{max-width:100%}
.linkbtn{display:block;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;border-radius:14px;padding:12px;margin:10px 0 14px;cursor:pointer}
/* image slots */
.imgslot{margin:14px 0;border-radius:14px;overflow:hidden;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 5%,var(--card))}
.imgslot.filled{border-style:solid;border-color:var(--border);background:var(--card)}
.imgslot img{display:block;width:100%;height:auto;cursor:zoom-in;background:#000;min-height:60px}
.imgslot .slotph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;color:var(--muted);font-size:.85rem;padding:14px;text-align:center}
.imgslot .slotph .slotic{font-size:1.8rem;opacity:.7}
.imgslot .slotcap{font-size:.8rem;color:var(--muted);padding:8px 12px;text-align:center;border-top:1px solid var(--border)}
.imgslot .slotacts{display:flex;gap:6px;justify-content:center;padding:0 10px 10px;flex-wrap:wrap}
.imgslot .slotacts button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 11px;font-size:.78rem;cursor:pointer}
.imgslot.loadingimg img{opacity:.3}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.gallery .gi{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1;background:#000}
.gallery .gi img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gallery .gi button{position:absolute;top:4px;right:4px;background:#ef4444;color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.8rem}
.gadd{border:2px dashed var(--border);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:transparent;font-size:.8rem}
.navrow{display:flex;gap:10px;margin-top:20px}
.navrow button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;cursor:pointer}
.navrow button.nx{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.navrow button:disabled{opacity:.35}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px}
.lightbox .lcap{color:#ddd;margin-top:10px;font-size:.85rem;text-align:center}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer}

/* ---------- SETTINGS ---------- */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border:2px solid var(--border);border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66rem;color:var(--muted);background:var(--card)}
.sw.active{border-color:var(--accent);color:var(--text);font-weight:700}
.sw .dots{display:flex;border-radius:999px;overflow:hidden;width:36px;height:22px;border:1px solid rgba(0,0,0,.08)}
.sw .dots i{flex:1}
.fontgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fopt{border:2px solid var(--border);border-radius:12px;padding:9px 10px;cursor:pointer;background:var(--card);color:var(--text);text-align:left}
.fopt.active{border-color:var(--accent)}
.fopt .fs1{font-size:1.05rem}.fopt .fs2{font-size:.68rem;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.catrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.catrow span{flex:1}

/* ---------- EDITOR ---------- */
.rtbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;position:sticky;top:-16px;background:var(--bg2);padding:4px 0;z-index:2}
.rtbar button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:9px;min-width:36px;height:34px;font-size:.85rem;cursor:pointer;padding:0 8px}
.editor{min-height:160px;max-height:50vh;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:12px;line-height:1.6}
.editor:focus{outline:2px solid var(--accent)}
.editor:empty:before{content:attr(data-ph);color:var(--muted)}
.editor h3{color:var(--accent);font-size:1.05rem;margin:12px 0 4px}
.editor .imgslot{padding:12px;text-align:center;color:var(--muted);font-size:.85rem;user-select:none}
.editor .box,.editor .tip,.editor .warn{border-left:4px solid var(--accent);padding:6px 10px;margin:8px 0;background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:8px}
.editor .warn{border-left-color:#e0803a}.editor .tip{border-left-color:#2f9e78}

/* ---------- DX / CASES ---------- */
.dxprog{display:flex;gap:6px;margin:4px 0 16px}
.dxprog span{height:5px;flex:1;border-radius:3px;background:var(--border)}
.dxprog span.on{background:var(--accent)}
.dxq{font-size:1.12rem;font-weight:700;margin:4px 0 4px}
.dxsub{color:var(--muted);font-size:.88rem;margin-bottom:14px}
.dxopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;font-size:1rem;color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
.dxopt:active{transform:scale(.98)}
.dxopt b{display:block}
.dxopt small{color:var(--muted);font-size:.82rem}
.dxres{text-align:center;padding:6px 0}
.dxres .badge{display:inline-block;background:var(--accent);color:var(--onacc);font-weight:700;font-size:1.2rem;padding:7px 20px;border-radius:14px;margin:4px 0}
.dxres .dz{font-size:1.4rem;font-weight:700;margin:10px 0 4px}
.dxres .path{color:var(--muted);font-size:.8rem;margin:10px 0}
.dxact{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:12px}
.dxact ul{margin:4px 0;padding-left:20px}
.dxwarn{background:#fff4e6;border:1px solid #f5c87a;color:#8a5a12;border-radius:12px;padding:11px 13px;font-size:.84rem;margin-top:14px;text-align:left}
body[data-theme="ocean"] .dxwarn,body[data-theme="midnight"] .dxwarn,body[data-theme="slate"] .dxwarn,body[data-theme="forest"] .dxwarn,body[data-theme="plum"] .dxwarn{background:#2a2012;border-color:#5a4420;color:#e8c88a}
.toolcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--cc);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.toolcard .te{font-size:1.8rem}
.toolcard small{color:var(--muted)}
.casescenario{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;padding:13px 15px;margin:8px 0 12px;line-height:1.6}
.caseq{font-weight:600;margin:10px 0}
.caseans{background:var(--bg);border:1px dashed var(--border);border-radius:14px;padding:13px 15px;margin-top:12px}
.caseans h4{margin:0 0 8px;color:var(--accent)}
.lvl{display:inline-block;font-size:.68rem;padding:2px 9px;border-radius:999px;font-weight:700;margin-left:6px;vertical-align:middle}
.lvl.easy{background:#d9f2e4;color:#1a7a4a}.lvl.mid{background:#fdeecf;color:#9a6a12}.lvl.hard{background:#fcdce2;color:#b03052}
.casenum{color:var(--muted);font-size:.8rem}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}

.loginbox .logomark{margin:0 auto 8px;width:54px;height:54px;border-radius:16px}

.loginbox p.sub{text-align:center;color:var(--muted);font-size:.85rem;margin:0 0 18px}
.loginbox .go{width:100%;padding:13px;border:0;border-radius:13px;background:var(--accent);color:var(--onacc);font-weight:700;font-size:1rem;cursor:pointer}
.loginbox .err{color:#e11d48;font-size:.82rem;text-align:center;min-height:18px;margin-top:6px}

.loginlinks{display:flex;justify-content:space-between;gap:8px;margin-top:8px}

.dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#ef4444;border:2px solid var(--bg)}
#setBtn{position:relative}
.urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.urow .ui{flex:1;min-width:0}
.urow .un{font-weight:700;font-size:.9rem}
.urow .ue{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ust{font-size:.66rem;font-weight:700;border-radius:999px;padding:2px 8px}
.ust.pending{background:#fdeecf;color:#9a6a12}.ust.approved{background:#d9f2e4;color:#1a7a4a}.ust.blocked{background:#fcdce2;color:#b03052}
.urow .chip{padding:6px 10px}
.loading{position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.editbanner{display:none;margin:6px 16px 0;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:8px 12px;font-size:.82rem}
body.editing .editbanner{display:block}
</style>

<script>
/* ===== CONTENT: lung (from original app) ===== */
const LUNG_SEED_CARDS=[
    {
      id:1, cat:'Basics', size:'xs', color:'#14b8a6', emoji:'🫁',
      titleBn:'লাং আলট্রাসাউন্ড কী', titleEn:'What is Lung USG',
      bodyBn:`<h3>মূল ধারণা</h3>
<p>লাং আলট্রাসাউন্ড আসলে <b>"আর্টিফ্যাক্ট পড়ার"</b> বিদ্যা। অন্য অঙ্গে (লিভার, কিডনি) আমরা আসল অঙ্গ দেখি। কিন্তু নরমাল ফুসফুস বাতাসে ভরা, আর বাতাস বিম পুরোপুরি ছড়িয়ে দেয় — তাই আসল টিস্যু দেখা যায় না, বিম আর টিস্যুর সীমানায় তৈরি প্রতিফলন (আর্টিফ্যাক্ট) দেখা যায়। এই আর্টিফ্যাক্টই রোগ বলে দেয়।</p>
<div class="box"><b>মূল নিয়ম:</b> বেশি বাতাস = A-line (শুকনো, নরমাল)। বেশি পানি/ঘনত্ব = B-line বা consolidation (ভেজা, অস্বাভাবিক)।</div>
<h3>কোন probe</h3>
<ul>
<li><b>Curvilinear / Phased array</b> — পুরো বুক স্ক্যানের মূল probe, গভীরে দেখা যায়</li>
<li><b>Linear</b> — শুধু pleura খুঁটিয়ে দেখার জন্য (lung sliding, pneumothorax সন্দেহে)</li>
</ul>
<h3>probe কীভাবে ধরব</h3>
<p>marker সবসময় <b>রোগীর মাথার দিকে</b>, probe খাড়া (longitudinal), পাঁজর বরাবর লম্বালম্বি। স্ক্রিনে উপরের দিক = মাথা, নিচ = পা।</p>
<h3>Bat sign — মূল ল্যান্ডমার্ক</h3>
<p>দুই পাঁজরের মাঝে probe বসালে বাদুড়ের মতো চেহারা তৈরি হয় — দুই পাঁজর ডানা, মাঝের চকচকে সাদা রেখা বাদুড়ের শরীর = <b>pleural line</b>।</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><ellipse cx="70" cy="80" rx="28" ry="15" fill="#555"/><ellipse cx="300" cy="80" rx="28" ry="15" fill="#555"/><rect x="55" y="92" width="30" height="130" fill="#0a0a0a" opacity=".85"/><rect x="285" y="92" width="30" height="130" fill="#0a0a0a" opacity=".85"/><path d="M85 96 Q190 114 285 96" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="70" y="84" text-anchor="middle" fill="#fff" font-size="11">পাঁজর</text><text x="300" y="84" text-anchor="middle" fill="#fff" font-size="11">পাঁজর</text><text x="190" y="160" text-anchor="middle" fill="#bbb" font-size="10">rib shadow</text><text x="190" y="215" text-anchor="middle" fill="#9df" font-size="11">↑ সাদা রেখা = pleural line</text></svg>
<div class="figcap">দুই পাঁজর = ডানা, মাঝের সাদা রেখা = pleural line</div>
<div class="box"><b>নিয়ম:</b> probe বসিয়ে আগে bat sign খুঁজুন। pleural line পরিষ্কার না দেখলে scan শুরু করবেন না — পরের সব (sliding, A/B-line) এই রেখার উপরেই নির্ভর করে।</div>`,
      bodyEn:`<h3>Core idea</h3>
<p>Lung USG is the art of reading <b>artifacts</b>. In other organs we see the real organ; but normal lung is full of air, which scatters the beam — so you see reflections at boundaries, not real tissue. These artifacts tell the diagnosis.</p>
<div class="box"><b>Key rule:</b> more air = A-lines (dry, normal). More fluid/density = B-lines or consolidation (wet, abnormal).</div>
<h3>Which probe</h3>
<ul>
<li><b>Curvilinear / Phased array</b> — main probe for the whole chest, sees deep</li>
<li><b>Linear</b> — only to study the pleura (sliding, suspected pneumothorax)</li>
</ul>
<h3>How to hold</h3>
<p>Marker always <b>toward the head</b>, probe vertical (longitudinal) along the ribs. On screen, up = head, down = feet.</p>
<h3>Bat sign — the key landmark</h3>
<p>Between two ribs a bat shape appears — two rib shadows are the wings, the bright line between is the <b>pleural line</b>.</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><ellipse cx="70" cy="80" rx="28" ry="15" fill="#555"/><ellipse cx="300" cy="80" rx="28" ry="15" fill="#555"/><rect x="55" y="92" width="30" height="130" fill="#0a0a0a" opacity=".85"/><rect x="285" y="92" width="30" height="130" fill="#0a0a0a" opacity=".85"/><path d="M85 96 Q190 114 285 96" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="70" y="84" text-anchor="middle" fill="#fff" font-size="11">rib</text><text x="300" y="84" text-anchor="middle" fill="#fff" font-size="11">rib</text><text x="190" y="160" text-anchor="middle" fill="#bbb" font-size="10">rib shadow</text><text x="190" y="215" text-anchor="middle" fill="#9df" font-size="11">↑ white line = pleural line</text></svg>
<div class="figcap">Two ribs = wings, bright line = pleural line</div>
<div class="box"><b>Rule:</b> find the bat sign first. No scan until the pleural line is clear — everything else depends on it.</div>`,
      images:[]
    },
    {
      id:2, cat:'Signs', size:'xs', color:'#f59e0b', emoji:'〰️',
      titleBn:'A-line ও B-line', titleEn:'A-lines & B-lines',
      bodyBn:`<p>এই দুটোই লাং আলট্রাসাউন্ডের মূল ভাষা। প্রথমেই মনে রাখুন — <b>A-line = শুকনো/বাতাস (নরমাল), B-line = ভেজা/পানি (অস্বাভাবিক হতে পারে)।</b></p>

<h3>A-line</h3>
<p>এগুলো pleural line-এর নিচে <b>আড়াআড়ি সমান্তরাল রেখা</b>, নিয়মিত দূরত্বে সাজানো।</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="15" width="340" height="210" rx="6" fill="#111318"/><ellipse cx="60" cy="48" rx="20" ry="11" fill="#555"/><ellipse cx="320" cy="48" rx="20" ry="11" fill="#555"/><path d="M80 58 Q190 70 300 58" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="190" y="40" text-anchor="middle" fill="#bbb" font-size="12">pleural line</text><line x1="40" y1="108" x2="340" y2="108" stroke="#eaeaea" stroke-width="2.5" opacity=".9"/><line x1="40" y1="155" x2="340" y2="155" stroke="#d0d0d0" stroke-width="2" opacity=".7"/><line x1="40" y1="200" x2="340" y2="200" stroke="#b0b0b0" stroke-width="1.6" opacity=".5"/><text x="348" y="112" text-anchor="end" fill="#8bd" font-size="11">A1</text><text x="348" y="159" text-anchor="end" fill="#8bd" font-size="11">A2</text></svg>
<div class="figcap">আড়াআড়ি সমান্তরাল রেখা = নরমাল বাতাসভরা ফুসফুস</div>
<p><b>A-line আসলে কী?</b> এটা pleural line-এরই প্রতিধ্বনি (reverberation)। বিম pleura-তে বাড়ি খেয়ে ফিরে আসে, আবার যায় — তাই সমান দূরত্বে কয়েকটা নকল রেখা তৈরি হয়, নিচে যত যায় তত হালকা।</p>
<div class="box"><b>মনে রাখুন:</b> A মানে <b>Air</b>। A-line দেখলেন মানে ওখানে বাতাস ঠিক আছে। A-line + ভালো sliding = <b>নরমাল ফুসফুস</b>।</div>

<h3>B-line</h3>
<p>একদম উল্টো — <b>খাড়া রেখা</b>, pleural line থেকে নিচ পর্যন্ত নেমে যায়, লেজারের মতো উজ্জ্বল।</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="15" width="340" height="210" rx="6" fill="#111318"/><ellipse cx="60" cy="48" rx="20" ry="11" fill="#555"/><ellipse cx="320" cy="48" rx="20" ry="11" fill="#555"/><path d="M80 58 Q190 70 300 58" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="190" y="40" text-anchor="middle" fill="#bbb" font-size="12">pleural line</text><polygon points="120,62 116,222 128,222 124,62" fill="#eaf3ff" opacity=".92"/><polygon points="195,63 191,222 203,222 199,63" fill="#eaf3ff" opacity=".92"/><polygon points="270,62 266,222 278,222 274,62" fill="#eaf3ff" opacity=".92"/></svg>
<div class="figcap">খাড়া উজ্জ্বল রেখা = ফুসফুসে পানি/ঘনত্ব</div>
<div class="box"><b>মনে রাখুন:</b> B মানে পানি (water)। B-line মানে ওখানে pleura-র নিচে পানি জমেছে বা টিস্যু ঘন হয়েছে।</div>

<h3>B-line চেনার ৫টি পাকা শর্ত</h3>
<p>সব কটা মিললে তবেই আসল B-line:</p>
<ul>
<li><b>pleural line থেকেই শুরু</b> (উপর থেকে, মাঝখান থেকে নয়)</li>
<li><b>স্ক্রিনের একদম নিচ পর্যন্ত</b> যায়, মাঝপথে থামে না</li>
<li><b>লেজারের মতো উজ্জ্বল</b>, ঝাপসা নয়</li>
<li><b>A-line মুছে দেয়</b> — যেখানে B-line, সেখানে A-line নেই</li>
<li><b>ফুসফুসের সাথে নড়ে</b> (sliding-এর সাথে দোলে)</li>
</ul>

<h3>কয়টা B-line মানে কী</h3>
<table class="mini">
<tr><td>জোনে ০–২টা</td><td>স্বাভাবিক হতে পারে (বিশেষত নিচে-পেছনে)</td></tr>
<tr><td>একই জোনে ৩টা+</td><td>অস্বাভাবিক — <b>positive zone</b> (interstitial পানি)</td></tr>
<tr><td>মিলে সাদা পর্দা</td><td>ভারী পানি — pulmonary edema / ARDS</td></tr>
</table>

<h3>রোগ বুঝতে একটা জরুরি পার্থক্য</h3>
<ul>
<li><b>দুই ফুসফুসে সব জায়গায় সমান B-line</b> → সাধারণত cardiogenic pulmonary edema (হার্ট ফেইলিওর)</li>
<li><b>ছাড়া-ছাড়া/patchy B-line</b> (কিছু জায়গায় A-line) → pneumonia বা ARDS</li>
</ul>`,
      bodyEn:`<p>These two are the core language of lung ultrasound. Remember first — <b>A-lines = dry/air (normal), B-lines = wet/fluid (can be abnormal).</b></p>

<h3>A-lines</h3>
<p><b>Horizontal parallel lines</b> below the pleural line, at regular spacing.</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="15" width="340" height="210" rx="6" fill="#111318"/><ellipse cx="60" cy="48" rx="20" ry="11" fill="#555"/><ellipse cx="320" cy="48" rx="20" ry="11" fill="#555"/><path d="M80 58 Q190 70 300 58" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="190" y="40" text-anchor="middle" fill="#bbb" font-size="12">pleural line</text><line x1="40" y1="108" x2="340" y2="108" stroke="#eaeaea" stroke-width="2.5" opacity=".9"/><line x1="40" y1="155" x2="340" y2="155" stroke="#d0d0d0" stroke-width="2" opacity=".7"/><line x1="40" y1="200" x2="340" y2="200" stroke="#b0b0b0" stroke-width="1.6" opacity=".5"/><text x="348" y="112" text-anchor="end" fill="#8bd" font-size="11">A1</text><text x="348" y="159" text-anchor="end" fill="#8bd" font-size="11">A2</text></svg>
<div class="figcap">Horizontal parallel lines = normal aerated lung</div>
<p><b>What is an A-line?</b> It's a reverberation of the pleural line — the beam bounces off the pleura repeatedly, making fainter echoes at equal depths.</p>
<div class="box"><b>Remember:</b> A = <b>Air</b>. A-lines + good sliding = <b>normal lung</b>.</div>

<h3>B-lines</h3>
<p>The opposite — <b>vertical lines</b> from the pleural line to the bottom, laser-bright.</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="15" width="340" height="210" rx="6" fill="#111318"/><ellipse cx="60" cy="48" rx="20" ry="11" fill="#555"/><ellipse cx="320" cy="48" rx="20" ry="11" fill="#555"/><path d="M80 58 Q190 70 300 58" fill="none" stroke="#f0f0f0" stroke-width="4"/><text x="190" y="40" text-anchor="middle" fill="#bbb" font-size="12">pleural line</text><polygon points="120,62 116,222 128,222 124,62" fill="#eaf3ff" opacity=".92"/><polygon points="195,63 191,222 203,222 199,63" fill="#eaf3ff" opacity=".92"/><polygon points="270,62 266,222 278,222 274,62" fill="#eaf3ff" opacity=".92"/></svg>
<div class="figcap">Vertical bright lines = fluid/density in lung</div>
<div class="box"><b>Remember:</b> B = water. B-lines mean fluid or thickened tissue under the pleura.</div>

<h3>5 criteria for a true B-line</h3>
<ul>
<li><b>Starts from the pleural line</b></li>
<li><b>Reaches the bottom</b> of the screen</li>
<li><b>Laser-bright</b></li>
<li><b>Erases A-lines</b> where it passes</li>
<li><b>Moves with sliding</b></li>
</ul>

<h3>How many B-lines</h3>
<table class="mini">
<tr><td>0–2 per zone</td><td>can be normal (esp. low/posterior)</td></tr>
<tr><td>3+ in one zone</td><td>abnormal — <b>positive zone</b></td></tr>
<tr><td>coalescent white</td><td>heavy fluid — edema / ARDS</td></tr>
</table>

<h3>Key for diagnosis</h3>
<ul>
<li><b>Even B-lines both lungs</b> → usually cardiogenic pulmonary edema</li>
<li><b>Patchy B-lines</b> (A-lines elsewhere) → pneumonia or ARDS</li>
</ul>`,

      bodyBn:`<p>পুরো বুক এলোমেলোভাবে দেখলে হবে না। প্রতি বুকে <b>৩টি জোন</b>, দুই বুকে মোট ৬টি পয়েন্ট — যাতে কোনো অংশ বাদ না পড়ে।</p>
<svg viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="22" width="150" height="110" rx="10" fill="#3b82d4" opacity=".16"/><rect x="20" y="22" width="150" height="110" rx="10" fill="none" stroke="#3b82d4" stroke-width="1.5"/><line x1="20" y1="77" x2="170" y2="77" stroke="#3b82d4" stroke-width="1" stroke-dasharray="3 3"/><text x="95" y="18" text-anchor="middle" fill="#3b82d4" font-size="11">সামনে (anterior)</text><text x="95" y="54" text-anchor="middle" fill="#3b82d4" font-size="15" font-weight="bold">1</text><text x="95" y="108" text-anchor="middle" fill="#3b82d4" font-size="15" font-weight="bold">2</text><rect x="210" y="22" width="150" height="110" rx="10" fill="#2f9e78" opacity=".16"/><rect x="210" y="22" width="150" height="110" rx="10" fill="none" stroke="#2f9e78" stroke-width="1.5"/><line x1="210" y1="77" x2="360" y2="77" stroke="#2f9e78" stroke-width="1" stroke-dasharray="3 3"/><text x="285" y="18" text-anchor="middle" fill="#2f9e78" font-size="11">পাশে (lateral)</text><text x="285" y="54" text-anchor="middle" fill="#2f9e78" font-size="15" font-weight="bold">3</text><text x="285" y="108" text-anchor="middle" fill="#2f9e78" font-size="15" font-weight="bold">4</text><rect x="110" y="165" width="160" height="95" rx="10" fill="#d08a3c" opacity=".16"/><rect x="110" y="165" width="160" height="95" rx="10" fill="none" stroke="#d08a3c" stroke-width="1.5"/><line x1="110" y1="212" x2="270" y2="212" stroke="#d08a3c" stroke-width="1" stroke-dasharray="3 3"/><text x="190" y="161" text-anchor="middle" fill="#d08a3c" font-size="11">পেছনে (posterior)</text><text x="190" y="196" text-anchor="middle" fill="#d08a3c" font-size="13" font-weight="bold">5</text><text x="190" y="243" text-anchor="middle" fill="#d08a3c" font-size="13" font-weight="bold">6</text></svg>
<div class="figcap">এক পাশের বুকের ৬ পয়েন্ট (দুই পাশেই একই নিয়ম)</div>
<h3>সামনের জোন (১ ও ২)</h3>
<p>collarbone থেকে nipple পর্যন্ত, বুকের মাঝ বরাবর (midclavicular)। চিত অবস্থায় বাতাস উপরে ওঠে — তাই <b>pneumothorax</b> এখানেই সবচেয়ে ভালো ধরা পড়ে।</p>
<h3>পাশের জোন (৩ ও ৪)</h3>
<p>বগলের নিচ বরাবর (axillary line)। জোন ৪ (পিছন-নিচের কোণা) = <b>PLAPS point</b> — effusion ও consolidation এখানে সবচেয়ে আগে জমে।</p>
<h3>পেছনের জোন (৫ ও ৬)</h3>
<p>রোগীকে একটু কাত করে বা বসিয়ে পিঠের দিক থেকে। পানি নিচে নামে, তাই effusion ও consolidation এখানে ভালো ধরা পড়ে।</p>
<div class="box"><b>স্ক্যানের সূত্র:</b> উপর থেকে নিচে, সামনে থেকে পাশে, তারপর পেছনে। বাতাস উপরে ওঠে → pneumothorax উপরে খুঁজুন; পানি নিচে নামে → effusion নিচে-পেছনে খুঁজুন।</div>
<p>প্রতি জোনে ক্রম: bat sign → pleural line → তারপর দেখুন কী হচ্ছে (নড়ছে কিনা, নিচে কী লাইন)।</p>`,
      bodyEn:`<p>Don't scan randomly. <b>3 zones per side</b>, 6 points total, so nothing is missed.</p>
<svg viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="22" width="150" height="110" rx="10" fill="#3b82d4" opacity=".16"/><rect x="20" y="22" width="150" height="110" rx="10" fill="none" stroke="#3b82d4" stroke-width="1.5"/><line x1="20" y1="77" x2="170" y2="77" stroke="#3b82d4" stroke-width="1" stroke-dasharray="3 3"/><text x="95" y="18" text-anchor="middle" fill="#3b82d4" font-size="11">anterior</text><text x="95" y="54" text-anchor="middle" fill="#3b82d4" font-size="15" font-weight="bold">1</text><text x="95" y="108" text-anchor="middle" fill="#3b82d4" font-size="15" font-weight="bold">2</text><rect x="210" y="22" width="150" height="110" rx="10" fill="#2f9e78" opacity=".16"/><rect x="210" y="22" width="150" height="110" rx="10" fill="none" stroke="#2f9e78" stroke-width="1.5"/><line x1="210" y1="77" x2="360" y2="77" stroke="#2f9e78" stroke-width="1" stroke-dasharray="3 3"/><text x="285" y="18" text-anchor="middle" fill="#2f9e78" font-size="11">lateral</text><text x="285" y="54" text-anchor="middle" fill="#2f9e78" font-size="15" font-weight="bold">3</text><text x="285" y="108" text-anchor="middle" fill="#2f9e78" font-size="15" font-weight="bold">4</text><rect x="110" y="165" width="160" height="95" rx="10" fill="#d08a3c" opacity=".16"/><rect x="110" y="165" width="160" height="95" rx="10" fill="none" stroke="#d08a3c" stroke-width="1.5"/><line x1="110" y1="212" x2="270" y2="212" stroke="#d08a3c" stroke-width="1" stroke-dasharray="3 3"/><text x="190" y="161" text-anchor="middle" fill="#d08a3c" font-size="11">posterior</text><text x="190" y="196" text-anchor="middle" fill="#d08a3c" font-size="13" font-weight="bold">5</text><text x="190" y="243" text-anchor="middle" fill="#d08a3c" font-size="13" font-weight="bold">6</text></svg>
<div class="figcap">6 points on one side (same on both sides)</div>
<h3>Anterior (1 & 2)</h3><p>Collarbone to nipple, midclavicular. Supine, air rises here — best for <b>pneumothorax</b>.</p>
<h3>Lateral (3 & 4)</h3><p>Along the axillary line. Zone 4 (posterolateral) = <b>PLAPS point</b> — effusion & consolidation collect first.</p>
<h3>Posterior (5 & 6)</h3><p>From the back. Fluid sinks, so effusion & consolidation show well.</p>
<div class="box"><b>Scan rule:</b> top to bottom, front to side, then back. Air rises → look up for pneumothorax; fluid sinks → look low/back for effusion.</div>
<p>At each zone: bat sign → pleural line → then watch what happens.</p>`,

      id:4, cat:'Signs', size:'xs', color:'#a855f7', emoji:'🌊',
      titleBn:'Lung sliding', titleEn:'Lung sliding',
      bodyBn:`<p>Lung sliding লাং আলট্রাসাউন্ডের সবচেয়ে কাজের জিনিস, বিশেষত pneumothorax ধরতে।</p>
<h3>কী</h3>
<p>pleura দুই স্তর — একটা বুকের দেয়ালে, আরেকটা ফুসফুসের গায়ে। শ্বাস নিলে ভেতরের স্তর বাইরের স্তরের উপর <b>পিছলে যায়</b>। আলট্রাসাউন্ডে pleural line <b>ঝিকমিক করে</b> — যেন পিঁপড়ের সারি হাঁটছে।</p>
<h3>সহজ নিয়ম</h3>
<ul><li><b>Sliding আছে</b> → ওখানে pneumothorax নেই</li><li><b>Sliding নেই</b> → সন্দেহ (নিশ্চিত নয়)</li></ul>
<div class="box"><b>ফাঁদ:</b> sliding না থাকা মানেই pneumothorax নয়। consolidation, atelectasis, adhesion, বা এক পাশে টিউব ঢুকে গেলেও sliding বন্ধ হয়। তাই <b>sliding থাকা</b> খুব নির্ভরযোগ্য (pneumothorax নেই), কিন্তু <b>sliding না থাকা</b> শুধু সন্দেহ।</div>
<h3>M-mode — নড়াচড়া স্থির ছবিতে ধরা</h3>
<p>sliding একটা নড়াচড়া, স্থির ছবিতে বোঝা কঠিন। M-mode সময়ের সাথে এক লাইনের নড়াচড়া দেখায়। দুটো প্যাটার্ন:</p>
<svg viewBox="0 0 380 230" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="15" width="172" height="165" rx="6" fill="#111318"/><rect x="196" y="15" width="172" height="165" rx="6" fill="#111318"/><line x1="12" y1="78" x2="184" y2="78" stroke="#f0f0f0" stroke-width="2.5"/><line x1="196" y1="78" x2="368" y2="78" stroke="#f0f0f0" stroke-width="2.5"/><g stroke="#bbb" stroke-width="1" opacity=".5"><line x1="22" y1="35" x2="174" y2="35"/><line x1="22" y1="52" x2="174" y2="52"/><line x1="22" y1="66" x2="174" y2="66"/></g><g fill="#ccc"><circle cx="35" cy="100" r="1.3"/><circle cx="70" cy="120" r="1.3"/><circle cx="100" cy="105" r="1.3"/><circle cx="130" cy="135" r="1.3"/><circle cx="55" cy="150" r="1.3"/><circle cx="110" cy="160" r="1.3"/><circle cx="150" cy="115" r="1.3"/><circle cx="80" cy="95" r="1.3"/><circle cx="45" cy="130" r="1.3"/><circle cx="140" cy="155" r="1.3"/><circle cx="160" cy="140" r="1.3"/></g><g stroke="#bbb" stroke-width="1" opacity=".45"><line x1="206" y1="35" x2="358" y2="35"/><line x1="206" y1="52" x2="358" y2="52"/><line x1="206" y1="66" x2="358" y2="66"/><line x1="206" y1="100" x2="358" y2="100"/><line x1="206" y1="120" x2="358" y2="120"/><line x1="206" y1="140" x2="358" y2="140"/><line x1="206" y1="160" x2="358" y2="160"/></g><text x="98" y="202" text-anchor="middle" fill="#5dcaa5" font-size="12" font-weight="bold">Seashore</text><text x="282" y="202" text-anchor="middle" fill="#f0a" font-size="12" font-weight="bold">Barcode</text></svg>
<div class="figcap">বাঁয়ে Seashore (ঢেউ+বালি) = sliding আছে। ডানে Barcode = sliding নেই।</div>
<table class="mini">
<tr><td><b>Seashore</b></td><td>উপরে সোজা রেখা (ঢেউ), নিচে দানাদার বালি → sliding আছে, <b>নরমাল</b></td></tr>
<tr><td><b>Barcode</b></td><td>সব সোজা সমান্তরাল রেখা, বালি নেই → sliding নেই, <b>সতর্ক</b></td></tr>
</table>
<div class="box"><b>সূত্র:</b> বালি দেখলে শান্তি (নরমাল), বারকোড দেখলে সতর্ক।</div>
<h3>Lung point — pneumothorax নিশ্চিত</h3>
<p>যেখানে "sliding নেই" অংশ আর "sliding আছে" অংশ পাশাপাশি মেলে — শ্বাসের তালে একবার sliding, একবার barcode। এটা দেখলে pneumothorax <b>১০০% নিশ্চিত</b>।</p>`,
      bodyEn:`<p>Lung sliding is the most useful sign in lung ultrasound, especially for pneumothorax.</p>
<h3>What</h3>
<p>The pleura has two layers. With breathing the inner layer <b>slides</b> over the outer — the pleural line <b>shimmers</b>, like "ants marching".</p>
<h3>Rule</h3>
<ul><li><b>Sliding present</b> → no pneumothorax there</li><li><b>Sliding absent</b> → suspicious (not certain)</li></ul>
<div class="box"><b>Pitfall:</b> absent sliding ≠ pneumothorax. Consolidation, atelectasis, adhesion, or a one-sided tube also stop sliding. Sliding <b>present</b> is very reliable; sliding <b>absent</b> is only a suspicion.</div>
<h3>M-mode</h3>
<p>Sliding is motion, hard to see in a still image. M-mode shows one line's motion over time. Two patterns:</p>

<h3>Lung point</h3>
<p>Where "no sliding" meets "sliding" — alternating with breathing. This confirms pneumothorax <b>100%</b>.</p>`,

      id:5, cat:'Signs', size:'xs', color:'#22d3ee', emoji:'💧',
      titleBn:'Pleural effusion ও কতটুকু', titleEn:'Pleural effusion & amount',
      bodyBn:`<p>এখানে প্রথমবার আপনি <b>আসল পানি</b> দেখবেন, আর্টিফ্যাক্ট নয়। পানি আলট্রাসাউন্ডে <b>কালো (anechoic)</b> দেখায়, আর সবসময় নিচে জমে।</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><path d="M18 52 Q110 44 190 54" fill="none" stroke="#f0f0f0" stroke-width="3"/><text x="90" y="36" text-anchor="middle" fill="#bbb" font-size="11">chest wall</text><path d="M18 118 Q190 92 362 118 L362 172 Q190 150 18 172 Z" fill="#05060a"/><text x="140" y="150" text-anchor="middle" fill="#6ab" font-size="13" font-weight="bold">পানি</text><ellipse cx="288" cy="148" rx="42" ry="22" fill="#4a4a4a"/><text x="288" y="152" text-anchor="middle" fill="#ddd" font-size="10">চুপসানো ফুসফুস</text><path d="M18 180 Q190 162 362 180" fill="none" stroke="#e8c060" stroke-width="4"/><text x="95" y="204" text-anchor="middle" fill="#e8c060" font-size="11">diaphragm</text></svg>
<div class="figcap">কালো = পানি, উপরে চুপসানো ফুসফুস ভাসছে</div>
<h3>চেনার চিহ্ন</h3>
<ul>
<li><b>Quad sign</b> — চার সীমানা মিলে চতুর্ভুজ (দুই পাঁজর, উপরে চুপসানো ফুসফুস, নিচে diaphragm)</li>
<li><b>Jellyfish/sinusoid sign</b> — ভেতরের চুপসানো ফুসফুস পানির ঢেউয়ে জেলিফিশের মতো দোলে</li>
<li>পানির ওপাশে <b>diaphragm ও লিভার/প্লীহা পরিষ্কার</b> দেখা যায়</li>
</ul>
<div class="box">নরমাল ফুসফুসে diaphragm-এর উপরে কিছু দেখা যায় না। <b>effusion থাকলে diaphragm পেরিয়ে উপরে কালো পানি দেখবেন</b> — এটাই সবচেয়ে সহজ ইঙ্গিত।</div>
<h3>কতটুকু — separation মাপা</h3>
<p>diaphragm-এর উপরে দুই pleura-র দূরত্ব (শ্বাসের শেষে, end-expiration):</p>
<table class="mini">
<tr><td>&lt; ১–২ সেমি</td><td>অল্প (small)</td></tr>
<tr><td>~ ২–৪ সেমি</td><td>মাঝারি (moderate)</td></tr>
<tr><td>&gt; ৪–৫ সেমি</td><td>বেশি (large)</td></tr>
</table>
<p>দ্রুত আন্দাজ: <b>separation (সেমি) × ২০ ≈ mL</b> (যেমন ৩ সেমি ≈ ৬০০ mL)। নিখুঁত নয়, কিন্তু "কতটা বড়" বুঝতে কাজ চলে।</p>
<div class="box"><b>সতর্কতা:</b> পানি কেবল কালো নাও হতে পারে। ভেতরে ভাসমান কণা, তন্তু বা থোকা দেখলে সেটা সাধারণ পানি নয় — <b>empyema (পুঁজ)</b> বা <b>রক্ত</b> হতে পারে, tap/drain-এর সিদ্ধান্ত আলাদা।</div>
<p>Tap করার আগে সবচেয়ে গভীর ও নিরাপদ পকেটটা probe দিয়ে খুঁজে নেবেন (diaphragm, লিভার/প্লীহা কোথায় দেখে), যাতে সুই নিচের অঙ্গে না লাগে।</p>`,
      bodyEn:`<p>Here you see <b>real fluid</b>, not an artifact. Fluid looks <b>black (anechoic)</b> and always collects low.</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><path d="M18 52 Q110 44 190 54" fill="none" stroke="#f0f0f0" stroke-width="3"/><text x="90" y="36" text-anchor="middle" fill="#bbb" font-size="11">chest wall</text><path d="M18 118 Q190 92 362 118 L362 172 Q190 150 18 172 Z" fill="#05060a"/><text x="140" y="150" text-anchor="middle" fill="#6ab" font-size="13" font-weight="bold">fluid</text><ellipse cx="288" cy="148" rx="42" ry="22" fill="#4a4a4a"/><text x="288" y="152" text-anchor="middle" fill="#ddd" font-size="10">collapsed lung</text><path d="M18 180 Q190 162 362 180" fill="none" stroke="#e8c060" stroke-width="4"/><text x="95" y="204" text-anchor="middle" fill="#e8c060" font-size="11">diaphragm</text></svg>
<div class="figcap">Black = fluid, collapsed lung floating above</div>
<h3>Signs</h3>
<ul>
<li><b>Quad sign</b> — quadrilateral of 4 borders</li>
<li><b>Jellyfish/sinusoid sign</b> — collapsed lung sways in the fluid</li>
<li>Diaphragm and liver/spleen seen clearly beyond the fluid</li>
</ul>
<div class="box">Normally nothing is seen above the diaphragm. With effusion you see <b>black fluid above the diaphragm</b> — the easiest clue.</div>
<h3>Amount — measure separation</h3>
<table class="mini">
<tr><td>&lt; 1–2 cm</td><td>small</td></tr>
<tr><td>~ 2–4 cm</td><td>moderate</td></tr>
<tr><td>&gt; 4–5 cm</td><td>large</td></tr>
</table>
<p>Quick estimate: <b>separation (cm) × 20 ≈ mL</b>.</p>
<div class="box"><b>Caution:</b> particles/strands/loculations = not simple fluid — may be empyema or blood.</div>
<p>Before tapping, find the deepest safe pocket with the probe (note the diaphragm and liver/spleen) so the needle avoids organs below.</p>`,

      id:6, cat:'Signs', size:'xs', color:'#34d399', emoji:'🫀',
      titleBn:'Consolidation', titleEn:'Consolidation',
      bodyBn:`<p>ফুসফুসের বাতাস-থলি পুঁজ/তরল/কোষে ভরে গেলে (যেমন নিউমোনিয়া) ফুসফুস আর বাতাসের মতো আচরণ করে না — বরং <b>লিভারের মতো ঘন টিস্যু</b> হয়ে যায়। একে বলে <b>hepatization</b> (ফুসফুস যেন লিভার)।</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><path d="M18 48 Q110 40 190 50" fill="none" stroke="#f0f0f0" stroke-width="3"/><text x="90" y="34" text-anchor="middle" fill="#bbb" font-size="11">pleural line</text><path d="M18 70 Q190 56 362 70 L362 185 Q190 200 18 185 Z" fill="#3a3632"/><text x="100" y="130" text-anchor="middle" fill="#e8d0a0" font-size="12" font-weight="bold">টিস্যুর মতো</text><text x="100" y="146" text-anchor="middle" fill="#e8d0a0" font-size="10">(লিভারের মতো)</text><g fill="#f5f0e0"><circle cx="215" cy="105" r="3"/><circle cx="250" cy="128" r="2.5"/><circle cx="285" cy="112" r="3"/><circle cx="235" cy="150" r="2.5"/><circle cx="290" cy="155" r="3"/></g><path d="M205 100 Q250 120 305 125" fill="none" stroke="#f5f0e0" stroke-width="1.3" opacity=".7"/><text x="300" y="215" text-anchor="end" fill="#f5f0e0" font-size="10">সাদা বিন্দু = air bronchogram</text></svg>
<div class="figcap">লিভারের মতো টিস্যু + ভেতরে সাদা air bronchogram</div>
<h3>চেনার চিহ্ন</h3>
<ul>
<li><b>Hepatization</b> — ফুসফুস লিভারের মতো ঘন টিস্যু, আসল টিস্যু দেখা যায়</li>
<li><b>Air bronchogram</b> — ভেতরে সাদা উজ্জ্বল বিন্দু/ডালপালা (ব্রংকাসে আটকানো বাতাস)</li>
<li><b>Dynamic air bronchogram</b> — শ্বাসের তালে সাদা বিন্দু নড়লে → নিউমোনিয়ার জোরালো প্রমাণ</li>
<li><b>Shred/fractal sign</b> — গভীর সীমানা এবড়োখেবড়ো, ছেঁড়া (নরমাল pleural line সোজা)</li>
<li>উপরে প্রায়ই B-line বা অল্প effusion</li>
</ul>
<h3>Effusion বনাম Consolidation — সহজ নিয়ম</h3>
<table class="mini">
<tr><td><b>Effusion</b></td><td>কালো (anechoic), পানি, নিচে জমে, ভেতরে জেলিফিশের মতো দোলে</td></tr>
<tr><td><b>Consolidation</b></td><td>ধূসর টিস্যু (লিভারের মতো), সাদা air bronchogram, ছেঁড়া সীমানা</td></tr>
</table>
<p>দুটো একসাথেও থাকতে পারে — নিচে কালো পানি, উপরে ধূসর জমাট ফুসফুস (নিউমোনিয়া + para-pneumonic effusion-এ common)।</p>
<div class="box"><b>মনে রাখুন:</b> consolidation-এ sliding কমে যেতে বা না থাকতে পারে (ফুসফুস ফুলছে না)। তাই "sliding নেই" মানেই pneumothorax নয় — consolidation-ও একটা কারণ।</div>`,
      bodyEn:`<p>When air sacs fill with pus/fluid/cells (e.g. pneumonia), lung stops behaving like air and becomes <b>liver-like dense tissue</b> — called <b>hepatization</b>.</p>
<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg"><rect x="18" y="12" width="344" height="216" rx="6" fill="#111318"/><path d="M18 48 Q110 40 190 50" fill="none" stroke="#f0f0f0" stroke-width="3"/><text x="90" y="34" text-anchor="middle" fill="#bbb" font-size="11">pleural line</text><path d="M18 70 Q190 56 362 70 L362 185 Q190 200 18 185 Z" fill="#3a3632"/><text x="100" y="130" text-anchor="middle" fill="#e8d0a0" font-size="12" font-weight="bold">tissue-like</text><text x="100" y="146" text-anchor="middle" fill="#e8d0a0" font-size="10">(like liver)</text><g fill="#f5f0e0"><circle cx="215" cy="105" r="3"/><circle cx="250" cy="128" r="2.5"/><circle cx="285" cy="112" r="3"/><circle cx="235" cy="150" r="2.5"/><circle cx="290" cy="155" r="3"/></g><path d="M205 100 Q250 120 305 125" fill="none" stroke="#f5f0e0" stroke-width="1.3" opacity=".7"/><text x="300" y="215" text-anchor="end" fill="#f5f0e0" font-size="10">white dots = air bronchogram</text></svg>
<div class="figcap">Liver-like tissue + white air bronchograms inside</div>
<h3>Signs</h3>
<ul>
<li><b>Hepatization</b> — lung looks like dense tissue</li>
<li><b>Air bronchogram</b> — white dots/branches (air in bronchi)</li>
<li><b>Dynamic air bronchogram</b> — dots move with breath → strong for pneumonia</li>
<li><b>Shred/fractal sign</b> — ragged deep border</li>
<li>Often B-lines or small effusion above</li>
</ul>
<h3>Effusion vs Consolidation</h3>
<table class="mini">
<tr><td><b>Effusion</b></td><td>black, fluid, collects low, jellyfish motion inside</td></tr>
<tr><td><b>Consolidation</b></td><td>grey tissue (liver-like), white air bronchograms, ragged border</td></tr>
</table>
<p>Both can coexist — black fluid below, grey consolidated lung above.</p>
<div class="box"><b>Remember:</b> sliding may be reduced/absent in consolidation — so absent sliding ≠ pneumothorax.</div>`,

      bodyBn:`<p>এটাই সব টুকরো জোড়ার জায়গা — শ্বাসকষ্টের রোগীর কারণ মিনিটে বের করা। পুরোটা দাঁড়িয়ে তিনটি প্রশ্নের উপর: <b>sliding আছে? A নাকি B? নিচে কী?</b></p>
<svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg"><rect x="130" y="10" width="120" height="34" rx="8" fill="#818cf8" opacity=".2"/><rect x="130" y="10" width="120" height="34" rx="8" fill="none" stroke="#818cf8" stroke-width="1.3"/><text x="190" y="32" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">Lung sliding?</text><line x1="160" y1="44" x2="90" y2="66" stroke="#aaa" stroke-width="1.5"/><line x1="220" y1="44" x2="290" y2="66" stroke="#aaa" stroke-width="1.5"/><rect x="25" y="68" width="130" height="30" rx="7" fill="#2f9e78" opacity=".18"/><text x="90" y="88" text-anchor="middle" fill="#2f9e78" font-size="11" font-weight="bold">আছে</text><rect x="225" y="68" width="130" height="30" rx="7" fill="#e5799a" opacity=".2"/><text x="290" y="88" text-anchor="middle" fill="#c04e72" font-size="11" font-weight="bold">নেই</text><line x1="60" y1="98" x2="40" y2="120" stroke="#aaa" stroke-width="1.2"/><line x1="120" y1="98" x2="135" y2="120" stroke="#aaa" stroke-width="1.2"/><rect x="8" y="122" width="78" height="42" rx="6" fill="#3b82d4" opacity=".16"/><text x="47" y="139" text-anchor="middle" fill="#3b82d4" font-size="9.5" font-weight="bold">A-line</text><text x="47" y="155" text-anchor="middle" fill="#3b82d4" font-size="8">COPD/PE</text><rect x="98" y="122" width="82" height="42" rx="6" fill="#3b82d4" opacity=".16"/><text x="139" y="139" text-anchor="middle" fill="#3b82d4" font-size="9.5" font-weight="bold">সব B-line</text><text x="139" y="155" text-anchor="middle" fill="#3b82d4" font-size="8">edema</text><line x1="270" y1="98" x2="250" y2="120" stroke="#aaa" stroke-width="1.2"/><line x1="315" y1="98" x2="330" y2="120" stroke="#aaa" stroke-width="1.2"/><rect x="200" y="122" width="82" height="42" rx="6" fill="#d08a3c" opacity=".18"/><text x="241" y="139" text-anchor="middle" fill="#d08a3c" font-size="9.5" font-weight="bold">lung point</text><text x="241" y="155" text-anchor="middle" fill="#d08a3c" font-size="8">pneumothorax</text><rect x="292" y="122" width="80" height="42" rx="6" fill="#d08a3c" opacity=".18"/><text x="332" y="139" text-anchor="middle" fill="#d08a3c" font-size="9.5" font-weight="bold">B/consol.</text><text x="332" y="155" text-anchor="middle" fill="#d08a3c" font-size="8">pneumonia</text><rect x="95" y="200" width="190" height="40" rx="8" fill="#2f9e78" opacity=".14"/><rect x="95" y="200" width="190" height="40" rx="8" fill="none" stroke="#2f9e78" stroke-width="1"/><text x="190" y="217" text-anchor="middle" fill="#2f9e78" font-size="10.5" font-weight="bold">নিচে PLAPS দেখুন</text><text x="190" y="232" text-anchor="middle" fill="#2f9e78" font-size="9">effusion / consolidation?</text><line x1="47" y1="164" x2="120" y2="198" stroke="#aaa" stroke-width="1.2"/></svg>
<div class="figcap">BLUE protocol — sliding → A/B → নিচে</div>
<h3>প্রশ্ন ১ — sliding আছে কি?</h3>
<p>সামনের জোনে probe রেখে দেখুন pleural line নড়ছে কিনা।</p>
<h3>sliding থাকলে → A নাকি B?</h3>
<table class="mini">
<tr><td>সব জোনে <b>A-line</b> (শুকনো)</td><td>COPD / হাঁপানি / PE</td></tr>
<tr><td>সব জোনে <b>সমান B-line</b></td><td>pulmonary edema (হার্ট ফেইলিওর)</td></tr>
<tr><td><b>ছাড়া-ছাড়া</b> A ও B</td><td>pneumonia</td></tr>
</table>
<h3>sliding না থাকলে → lung point?</h3>
<table class="mini">
<tr><td>A-line + <b>lung point</b></td><td>pneumothorax নিশ্চিত</td></tr>
<tr><td>B-line / consolidation</td><td>pneumonia</td></tr>
</table>
<h3>প্রশ্ন ৩ — নিচে PLAPS</h3>
<p>উপরের জোন উত্তর না দিলে নিচে-পেছনে যান। effusion (কালো পানি) বা consolidation পেলে → pneumonia / effusion।</p>
<div class="box"><b>সতর্কতা:</b> POCUS কখনও একা সিদ্ধান্ত দেয় না। সবসময় ইতিহাস, পরীক্ষা, ECG, দরকারে X-ray/CT মিলিয়ে দেখবেন।</div>`,
      bodyEn:`<p>This is where all the pieces join — finding the cause of dyspnea in minutes. Three questions: <b>sliding? A or B? what's below?</b></p>

      bodyBn:`<h3>Lung point</h3>
<p>pneumothorax-এর <b>১০০% নির্দিষ্ট</b> চিহ্ন। যেখানে "sliding নেই" (ভেঙে যাওয়া) অংশ আর "sliding আছে" (স্বাভাবিক) অংশ ঠিক পাশাপাশি মেলে — সেই সীমানা বিন্দুই lung point। একই জায়গায় শ্বাসের তালে একবার sliding, একবার barcode। এটা দেখলে pneumothorax নিশ্চিত, আর কিছু লাগে না।</p>
<h3>PLAPS point</h3>
<p>Posterolateral Alveolar/Pleural Syndrome — নিচের-পেছনের জোন (জোন ৪/৬)। effusion ও consolidation এখানে সবচেয়ে আগে জমে। shock বা শ্বাসকষ্টের রোগীতে এই point অবশ্যই দেখবেন।</p>
<h3>Lung pulse — খুব কাজের</h3>
<p>হার্ট বুকের ভেতরেই ধুকপুক করছে। যদি দুই pleura লেগে থাকে (মাঝে বাতাস নেই), প্রতিটা স্পন্দন pleural line-এ সামান্য কাঁপুনি পাঠায় — pleural line হার্টের তালে কাঁপে। একেই বলে lung pulse।</p>
<svg viewBox="0 0 380 210" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="12" width="172" height="150" rx="6" fill="#111318"/><rect x="196" y="12" width="172" height="150" rx="6" fill="#111318"/><line x1="12" y1="68" x2="184" y2="68" stroke="#f0f0f0" stroke-width="2.5"/><line x1="196" y1="68" x2="368" y2="68" stroke="#f0f0f0" stroke-width="2.5"/><g stroke="#bbb" stroke-width="1" opacity=".4"><line x1="22" y1="32" x2="174" y2="32"/><line x1="22" y1="50" x2="174" y2="50"/><line x1="22" y1="90" x2="174" y2="90"/><line x1="22" y1="120" x2="174" y2="120"/><line x1="22" y1="150" x2="174" y2="150"/></g><g stroke="#5dcaa5" stroke-width="1.5"><path d="M50 90 q3 -7 6 0" fill="none"/><path d="M95 120 q3 -7 6 0" fill="none"/><path d="M135 90 q3 -7 6 0" fill="none"/><path d="M70 150 q3 -7 6 0" fill="none"/></g><g stroke="#bbb" stroke-width="1" opacity=".4"><line x1="206" y1="32" x2="358" y2="32"/><line x1="206" y1="50" x2="358" y2="50"/><line x1="206" y1="90" x2="358" y2="90"/><line x1="206" y1="120" x2="358" y2="120"/><line x1="206" y1="150" x2="358" y2="150"/></g><text x="98" y="185" text-anchor="middle" fill="#5dcaa5" font-size="11" font-weight="bold">pulse আছে</text><text x="98" y="200" text-anchor="middle" fill="#999" font-size="9">pleura লেগে</text><text x="282" y="185" text-anchor="middle" fill="#f0a" font-size="11" font-weight="bold">pulse নেই</text><text x="282" y="200" text-anchor="middle" fill="#999" font-size="9">মাঝে বাতাস</text></svg>

<div class="box"><b>সূত্র:</b> sliding বা lung pulse — যেকোনো একটা থাকলেই ওখানে pneumothorax নেই। দুটোই অনুপস্থিত হলেই সন্দেহ, lung point পেলে নিশ্চিত।</div>
<p>বিশেষ কাজে লাগে: এক পাশে টিউব ঢুকে গেলে (ওই পাশে sliding নেই কিন্তু lung pulse আছে → pneumothorax নয়, টিউব ঠিক করুন), বা full atelectasis-এ।</p>`,
      bodyEn:`<h3>Lung point</h3>
<p><b>100% specific</b> for pneumothorax. Where "no sliding" meets "sliding" side by side — alternating sliding/barcode with breathing at that spot. Confirms pneumothorax, nothing else needed.</p>
<h3>PLAPS point</h3>
<p>Posterolateral zone (4/6). Effusion & consolidation collect here first. Always check in shock/dyspnea.</p>
<h3>Lung pulse — very useful</h3>
<p>The heart beats inside the chest. If the two pleura are touching (no air between), each beat sends a flicker into the pleural line — it quivers with the heartbeat. That is lung pulse.</p>
<svg viewBox="0 0 380 210" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="12" width="172" height="150" rx="6" fill="#111318"/><rect x="196" y="12" width="172" height="150" rx="6" fill="#111318"/><line x1="12" y1="68" x2="184" y2="68" stroke="#f0f0f0" stroke-width="2.5"/><line x1="196" y1="68" x2="368" y2="68" stroke="#f0f0f0" stroke-width="2.5"/><g stroke="#bbb" stroke-width="1" opacity=".4"><line x1="22" y1="32" x2="174" y2="32"/><line x1="22" y1="50" x2="174" y2="50"/><line x1="22" y1="90" x2="174" y2="90"/><line x1="22" y1="120" x2="174" y2="120"/><line x1="22" y1="150" x2="174" y2="150"/></g><g stroke="#5dcaa5" stroke-width="1.5"><path d="M50 90 q3 -7 6 0" fill="none"/><path d="M95 120 q3 -7 6 0" fill="none"/><path d="M135 90 q3 -7 6 0" fill="none"/><path d="M70 150 q3 -7 6 0" fill="none"/></g><g stroke="#bbb" stroke-width="1" opacity=".4"><line x1="206" y1="32" x2="358" y2="32"/><line x1="206" y1="50" x2="358" y2="50"/><line x1="206" y1="90" x2="358" y2="90"/><line x1="206" y1="120" x2="358" y2="120"/><line x1="206" y1="150" x2="358" y2="150"/></g><text x="98" y="185" text-anchor="middle" fill="#5dcaa5" font-size="11" font-weight="bold">pulse present</text><text x="282" y="185" text-anchor="middle" fill="#f0a" font-size="11" font-weight="bold">pulse absent</text></svg>
<div class="figcap">Left: flicker with heartbeat = not pneumothorax. Right: none = suspicious.</div>
<table class="mini">

<tr><td><b>no sliding + no pulse</b></td><td>stronger suspicion of pneumothorax</td></tr>
</table>
<div class="box"><b>Rule:</b> sliding OR lung pulse present → no pneumothorax there. Both absent → suspicion; lung point → confirmed.</div>
<p>Useful for: one-sided tube (no sliding but pulse present → not pneumothorax, fix the tube), or full atelectasis.</p>`,

      bodyBn:`<p>Profile হলো BLUE protocol-এর আসল ভাষা — ওই সিদ্ধান্ত গাছটাকেই ছোট নাম দিয়ে ডাকা, যাতে দ্রুত বলা যায়।</p>

<table class="mini">
<tr><td><b>A</b></td><td>A-line + sliding → COPD / হাঁপানি / PE</td></tr>
<tr><td><b>B</b></td><td>সব জোনে B-line + sliding → pulmonary edema</td></tr>
<tr><td><b>A/B</b></td><td>একপাশে A, একপাশে B → pneumonia</td></tr>
<tr><td><b>C</b></td><td>সামনে consolidation → pneumonia</td></tr>
<tr><td><b>A′</b></td><td>A-line + sliding <b>নেই</b> → pneumothorax</td></tr>
<tr><td><b>B′</b></td><td>B-line + sliding <b>নেই</b> → pneumonia</td></tr>
</table>
<h3>একটা জিনিস মনে রাখলেই যথেষ্ট</h3>
<p><b>′ (prime) = sliding নেই।</b> এটাই A থেকে A′ আর B থেকে B′-এর পার্থক্য। A মানে নিরাপদ শুকনো ফুসফুস, কিন্তু A′ মানে বিপদ (pneumothorax)। B মানে edema, কিন্তু B′ মানে pneumonia (edema-তে sliding থাকে, এখানে নেই)।</p>

<div class="box">কেউ "রোগীর B-profile" বললে আপনি এখন সাথে সাথে বুঝবেন — মানে pulmonary edema।</div>`,
      bodyEn:`<p>Profiles are the shorthand of the BLUE protocol — the decision tree given short names for quick communication.</p>
<div class="box"><b>Core idea:</b> sliding present? + A or B-lines → each combination is a profile pointing to a disease. <b>′ (prime) always means "no sliding".</b></p>
<table class="mini">
<tr><td><b>A</b></td><td>A-lines + sliding → COPD / asthma / PE</td></tr>
<tr><td><b>B</b></td><td>B-lines all zones + sliding → pulmonary edema</td></tr>
<tr><td><b>A/B</b></td><td>A one side, B other → pneumonia</td></tr>
<tr><td><b>C</b></td><td>anterior consolidation → pneumonia</td></tr>
<tr><td><b>A′</b></td><td>A-lines + <b>no</b> sliding → pneumothorax</td></tr>
<tr><td><b>B′</b></td><td>B-lines + <b>no</b> sliding → pneumonia</td></tr>
</table>
<h3>Remember just one thing</h3>
<p><b>′ (prime) = no sliding.</b> That's what separates A from A′ and B from B′. A = safe dry lung, A′ = danger (pneumothorax). B = edema, B′ = pneumonia.</p>
<p>PLAPS effusion/consolidation → <b>PLAPS-positive</b>.</p>
<div class="box">"B-profile" → you now instantly know: pulmonary edema.</div>`,

      bodyBn:`<p>এই ফাঁদগুলো না জানলে ভুল রোগ ধরতে পারেন — ICU-তে এগুলোই সবচেয়ে বেশি ভুল করায়।</p>
<h3>১. Subcutaneous emphysema (সবচেয়ে বিপজ্জনক)</h3>
<p>ট্রমা বা chest tube-এর রোগীতে চামড়ার নিচে বাতাস probe ও pleura-র <b>মাঝে</b> চলে আসে — pleural line-ই দেখা যায় না, পুরো স্ক্রিন অগোছালো। এটা আসল pneumothorax-কে ঢেকে দেয়।</p>
<div class="box">চামড়ায় probe চাপলে "কড়কড়" (crepitus) অনুভব হয়, pleural line খুঁজেই পাবেন না। <b>pleural line না পেলে ওই জায়গা দিয়ে কোনো সিদ্ধান্ত নেবেন না।</b></div>
<h3>২. pleural line নিশ্চিত না করে scan</h3>
<p>rib shadow বা অন্য রেখাকে pleural line ভাবা — সবচেয়ে সাধারণ ভুল। নিয়ম সেই একই: আগে bat sign, তারপর সব।</p>
<h3>৩. পুরনো রোগের নকল B-line</h3>
<p>পুরনো fibrosis বা দাগে B-line-এর মতো রেখা দেখা যায়, কিন্তু নতুন পানি নয়।</p>
<table class="mini">
<tr><td>পুরনো রোগ</td><td>অসম, খসখসে pleural line, ছাড়া-ছাড়া</td></tr>
<tr><td>Edema</td><td>মসৃণ pleural line, সব জোনে সমান</td></tr>
</table>
<h3>৪. নড়াচড়াকে sliding ভাবা</h3>
<p>রোগী নড়লে বা probe কাঁপলে মনে হতে পারে sliding আছে। নিশ্চিত হতে M-mode — seashore এলে তবেই।</p>`,
      bodyEn:`<p>Missing these pitfalls leads to wrong diagnoses — the most common ICU errors.</p>
<h3>1. Subcutaneous emphysema (most dangerous)</h3>
<p>In trauma/chest-tube patients, air under the skin sits <b>between</b> probe and pleura — pleural line invisible, screen messy. It hides real pneumothorax.</p>
<div class="box">"Crackle" (crepitus) on pressing, no pleural line. <b>No decision through that area without the pleural line.</b></div>
<h3>2. Scanning without confirming the pleural line</h3>
<p>Mistaking rib shadow for pleura — commonest error. Bat sign first, always.</p>
<h3>3. Fake B-lines from old disease</h3>
<table class="mini">
<tr><td>Old disease</td><td>uneven, rough pleural line, patchy</td></tr>
<tr><td>Edema</td><td>smooth pleural line, even all zones</td></tr>
</table>
<h3>4. Mistaking motion for sliding</h3>
<p>Patient/probe movement can look like sliding. Confirm with M-mode — only seashore counts.</p>`,

<tr><td>already all B-lines</td><td>not fluid, think diuretic</td></tr>
</table>
<div class="box">Lung says "can the patient <b>tolerate</b> fluid?", echo says "does it <b>need</b> fluid?".</div>

{lvl:'mid',
 sBn:'৪০ বছরের মহিলা, কয়েক সপ্তাহ ধরে বাড়তে থাকা শ্বাসকষ্ট, ডান বুকে ভার লাগে। ডান নিচে-পেছনে: বড় কালো (anechoic) জায়গা, ভেতরে চুপসানো ফুসফুস শ্বাসে জেলিফিশের মতো দুলছে, diaphragm পেরিয়ে উপরে কালো দেখা যাচ্ছে। separation ~৫ সেমি।',
 sEn:'40F, weeks of rising dyspnoea, right-sided heaviness. Right lower-posterior: large black (anechoic) space, collapsed lung swaying like jellyfish, black seen above the diaphragm. Separation ~5 cm.',
 qBn:'এটা কী? কতটুকু (আন্দাজ)? ভেতরে কণা দেখলে কী ভাবতেন?',qEn:'What is this? Rough amount? If particles inside?',
 aBn:'<b>Pleural effusion</b> (কালো anechoic, নিচে, jellyfish/sinusoid sign, diaphragm পেরিয়ে কালো)। <b>পরিমাণ:</b> separation ~৫ সেমি = বড় (large); আন্দাজ ৫×২০ ≈ ১০০০ mL। <b>ভেতরে কণা/তন্তু/থোকা থাকলে</b> সাধারণ পানি নয় — empyema (পুঁজ) বা রক্ত, tap/drain-এর সিদ্ধান্ত আলাদা। tap-এর আগে সবচেয়ে গভীর নিরাপদ পকেট খুঁজে নেবেন।',
 aEn:'<b>Pleural effusion</b> (black, low, jellyfish/sinusoid, black above diaphragm). <b>Amount:</b> ~5 cm = large; ≈ 5×20 = 1000 mL. <b>Particles/strands inside</b> → not simple fluid — empyema or blood. Find the deepest safe pocket before tapping.'},
{lvl:'hard',
 sBn:'৩৫ বছরের পুরুষ, মোটরসাইকেল দুর্ঘটনা, বুকে আঘাত, শ্বাসকষ্ট। বাম সামনে: A-line, sliding আছে (নরমাল)। ডান পাশে (৩/৪ জোন): একটা নির্দিষ্ট জায়গায় ঘন B-line ও ছোট consolidation, pleural line একটু অসম; আশেপাশের জোন মোটামুটি স্বাভাবিক। X-ray এখনো হয়নি।',
 sEn:'35M, motorbike crash, chest injury, dyspnoea. Left anterior: A-lines, sliding (normal). Right lateral (zones 3/4): focal dense B-lines + small consolidation at one spot, slightly uneven pleural line; nearby zones fairly normal. No X-ray yet.',
 qBn:'ডান পাশের ওই জায়গা কী? edema থেকে কীভাবে আলাদা? সতর্কতা?',qEn:'The right focal area? How to tell from edema? Caution?',
 aBn:'<b>Pulmonary contusion</b> — আঘাতের জায়গায় <b>focal</b> ঘন B-line/ছোট consolidation, pleural line অসম। <b>edema থেকে আলাদা:</b> contusion জায়গা-নির্দিষ্ট (যেখানে আঘাত), edema দুই ফুসফুসে সমান ও ছড়ানো; সাথে ট্রমার ইতিহাস। লাং POCUS X-ray-র আগেই এটা ধরতে পারে। <b>সতর্কতা:</b> ট্রমায় contusion আর pneumothorax পাশাপাশি থাকতে পারে — প্রতিটা জোন আলাদা করে দেখুন (sliding/lung point), একটা পেয়ে থামবেন না। contusion-এ fluid সাবধানে।',
 aEn:'<b>Pulmonary contusion</b> — <b>focal</b> dense B-lines/small consolidation at the injury site, uneven pleural line. <b>vs edema:</b> contusion is focal (at impact), edema is even/diffuse both lungs; plus trauma history. POCUS detects it before X-ray. <b>Caution:</b> contusion and pneumothorax can coexist — scan every zone (sliding/lung point), don\'t stop at one. Give fluid carefully.'}
];

{id:'echo-01',cat:'Basics',color:'#e5799a',emoji:'🫀',seed:true,
titleBn:'Echo POCUS কী — শুরু এখানে',titleEn:'What is POCUS Echo — start here',
bodyBn:`<p>ICU-তে POCUS Echo মানে রোগীর বিছানার পাশে নিজে probe ধরে কয়েক মিনিটে হৃৎপিণ্ডের জরুরি প্রশ্নের উত্তর খোঁজা। এটা পূর্ণাঙ্গ formal echocardiography নয়। লক্ষ্য হলো স্পষ্ট অস্বাভাবিকতা ধরা, সূক্ষ্ম মাপজোখ নয়।</p>
<div class="box"><b>সবচেয়ে বড় নিয়ম:</b> স্ক্যান শুরুর আগে নিজেকে প্রশ্ন করুন, এই ছবি কোন সিদ্ধান্ত বদলাবে? উত্তর না থাকলে চিকিৎসা থামিয়ে স্ক্যান করবেন না।</div>
<h3>POCUS Echo যে পাঁচটি প্রশ্নের উত্তর দেয়</h3>
<ul>
<li>হৃৎপিণ্ডের চারপাশে পানি আছে কি, আর সেটা চাপ দিচ্ছে কি? (<b>pericardial effusion, tamponade</b>)</li>
<li>LV কতটা জোরে চাপ দিচ্ছে? (<b>LV systolic function</b>)</li>
<li>RV কি বড় হয়ে চাপে আছে? (<b>PE, acute cor pulmonale</b>)</li>
<li>শরীরে পানির অবস্থা কেমন, রোগী fluid সহ্য করবে কি? (<b>IVC, LVOT VTI</b>)</li>
<li>বড় কোনো valve-এর গোলমাল আছে কি? (<b>gross MR, AR, AS</b>)</li>
</ul>
<h3>পাঁচটি মূল view এক নজরে</h3>
<table class="mini">
<tr><td><b>PLAX</b></td><td>বুকের হাড়ের বাঁ পাশে, ৩য়–৪র্থ পাঁজরের ফাঁকে। LV function, effusion, MV ও AoV দেখা।</td></tr>
<tr><td><b>PSAX</b></td><td>PLAX থেকে probe ৯০° ঘুরিয়ে। LV-র চারদিকের নড়াচড়া, D-shaped septum।</td></tr>
<tr><td><b>A4C</b></td><td>Apex beat-এর ওপর। চারটি chamber একসাথে, RV:LV অনুপাত, TAPSE।</td></tr>
<tr><td><b>Subcostal 4C</b></td><td>Xiphisternum-এর নিচে। Effusion দেখার সেরা view; ventilator ও CPR-এ ভরসা।</td></tr>
<tr><td><b>IVC</b></td><td>Subcostal থেকে ঘুরিয়ে লম্বালম্বি। Volume status, tamponade-এ plethora।</td></tr>
</table>
${SVG_CHEST('PLAX/PSAX','A4C','SC4C','IVC','সাদা বিন্দু = probe marker-এর দিক')}
<div class="figcap">বুকের ওপর চারটি জায়গা; সাদা বিন্দু দেখায় marker কোন দিকে থাকবে</div>
<h3>শেখার তিনটি স্তর</h3>
<ol>
<li><b>Acquisition</b> — সঠিক view তোলা। প্রথম দিনের পুরো কাজ এটাই।</li>
<li><b>Interpretation</b> — ছবি দেখে স্বাভাবিক না অস্বাভাবিক বোঝা।</li>
<li><b>Integration</b> — ছবি আর রোগীর অবস্থা মিলিয়ে সিদ্ধান্ত নেওয়া।</li>
</ol>
<p>প্রতিটি কার্ডের নিচে <b>"পরের ধাপ ▶"</b> চেপে ক্রম অনুযায়ী এগিয়ে যান।</p>
${SLOT('basics-machine','আপনার মেশিন ও cardiac (phased-array) probe')}
<div class="warn"><b>সীমা মনে রাখুন:</b> POCUS স্পষ্ট অস্বাভাবিকতা ধরতে পারে, কিন্তু "সব স্বাভাবিক" নিশ্চিত করতে পারে না। সন্দেহ থাকলে formal echo করান।</div>`,
bodyEn:`<p>POCUS Echo in the ICU means holding the probe yourself at the bedside and answering urgent cardiac questions within minutes. It is not formal echocardiography. The aim is to catch obvious abnormality, not precise measurement.</p>
<div class="box"><b>The biggest rule:</b> before scanning, ask what decision this image will change. If none, do not pause treatment to scan.</div>
<h3>The five questions POCUS Echo answers</h3>
<ul>
<li>Is there fluid around the heart, and is it compressing it? (<b>pericardial effusion, tamponade</b>)</li>
<li>How well is the LV squeezing? (<b>LV systolic function</b>)</li>
<li>Is the RV dilated and strained? (<b>PE, acute cor pulmonale</b>)</li>
<li>What is the volume status, will the patient tolerate fluid? (<b>IVC, LVOT VTI</b>)</li>
<li>Is there a gross valve problem? (<b>gross MR, AR, AS</b>)</li>
</ul>
<h3>Five core views</h3>
<table class="mini">
<tr><td><b>PLAX</b></td><td>Left parasternal, 3rd–4th intercostal space. LV function, effusion, MV and AoV.</td></tr>
<tr><td><b>PSAX</b></td><td>Rotate 90° from PLAX. Circumferential LV motion, D-shaped septum.</td></tr>
<tr><td><b>A4C</b></td><td>Over the apex beat. All four chambers, RV:LV ratio, TAPSE.</td></tr>
<tr><td><b>Subcostal 4C</b></td><td>Below the xiphisternum. Best for effusion; works in ventilated patients and during CPR.</td></tr>
<tr><td><b>IVC</b></td><td>Rotate from subcostal into long axis. Volume status, plethora in tamponade.</td></tr>
</table>
${SVG_CHEST('PLAX/PSAX','A4C','SC4C','IVC','white dot = probe marker side')}
<div class="figcap">Four probe sites; the white dot shows the marker side</div>
<h3>Three levels of learning</h3>
<ol><li><b>Acquisition</b> — getting the view. Day 1 is entirely this.</li><li><b>Interpretation</b> — normal vs abnormal.</li><li><b>Integration</b> — combining images with the clinical picture.</li></ol>
<p>Use <b>"Next step ▶"</b> at the bottom of each card to move in order.</p>
${SLOT('basics-machine','Your machine and cardiac (phased-array) probe')}
<div class="warn"><b>Remember the limit:</b> POCUS can rule in obvious abnormality but cannot confirm that everything is normal. If in doubt, get a formal echo.</div>`},
