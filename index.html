{id:'echo-18',cat:'Reference',color:'#f59e0b',emoji:'📋',seed:true,
titleBn:'স্বাভাবিক মান ও রিপোর্ট',titleEn:'Normal values & report',
bodyBn:`<h3>দ্রুত দেখার স্বাভাবিক মান</h3>
<table class="mini">
<tr><td>EPSS</td><td>৭ mm বা কম; বেশি হলে EF কম</td></tr>
<tr><td>MAPSE</td><td>১০ mm-এর বেশি; ৮-এর কম হলে LV দুর্বল</td></tr>
<tr><td>TAPSE</td><td>১৭ mm বা বেশি</td></tr>
<tr><td>RV:LV (A4C)</td><td>০.৬-এর কম; ১ বা বেশি হলে খুব বড়</td></tr>
<tr><td>RV free wall</td><td>৫ mm-এর কম; বেশি হলে পুরনো RV চাপ</td></tr>
<tr><td>IVC</td><td>২.১ cm-এর কম, শ্বাসে ৫০%-এর বেশি চুপসায়</td></tr>
<tr><td>LVOT VTI</td><td>১৮–২২ cm</td></tr>
<tr><td>LVOT diameter</td><td>১.৮–২.২ cm</td></tr>
<tr><td>Cardiac output</td><td>৪–৮ L/min</td></tr>
<tr><td>PLR-এ VTI বৃদ্ধি</td><td>১০–১২% বা বেশি হলে fluid responsive</td></tr>
<tr><td>Effusion</td><td>ছোট ১ cm-এর কম, মাঝারি ১–২ cm, বড় ২ cm-এর বেশি</td></tr>
<tr><td>Aortic root</td><td>৪ cm-এর বেশি হলে সন্দেহ</td></tr>
</table>
<h3>ICU round-এ দ্রুত ক্রম (প্রায় ৫ মিনিট)</h3>
<ol>
<li>প্রশ্ন ঠিক করুন: কোন সিদ্ধান্তের জন্য স্ক্যান?</li>
<li>Subcostal 4C → effusion, RV, LV এক নজরে।</li>
<li>IVC।</li>
<li>PLAX → PSAX → A4C (যতটা পাওয়া যায়)।</li>
<li>দুই পাশের lung।</li>
<li>দরকার হলে VTI ও PLR।</li>
<li>Clip সেভ, রিপোর্ট লিখুন।</li>
</ol>
<h3>রিপোর্টের কাঠামো</h3>
<pre class="report">FOCUSED ICU POCUS ECHO — not a formal echocardiogram
Patient/ID:            Date/time:
Operator:              Machine/probe:
Clinical question:     (e.g. cause of shock / ? tamponade)
Image quality:         Good / Limited / Non-diagnostic
Views:                 PLAX  PSAX  A4C  SC4C  IVC  Lung  [A5C-VTI]

Pericardium:  No effusion / small / moderate / large
              Tamponade signs: RA collapse __  RV collapse __
LV function:  Hyperdynamic / Normal / Mod. reduced / Severely reduced
              (EPSS __ mm, MAPSE __ mm)
RV:           Normal / Dilated (RV:LV __), TAPSE __ mm, D-septum __
IVC:          __ cm, collapse __ %  (ventilated: Y/N)
Valves:       MR __ AR __ AS __ TR __  (present/absent only)
Lung:         A-lines / B-lines (focal/diffuse) / effusion / no sliding
LVOT VTI:     __ cm  (PLR change __ %)

Impression:   1–2 lines
Action:       e.g. fluid challenge and reassess VTI
Formal echo requested: Y/N (reason)</pre>
${SLOT('report-sheet','আপনার ইউনিটের রিপোর্ট ফর্ম')}
<div class="tip">রিপোর্টে সবসময় লিখুন প্রশ্নের উত্তর মিলেছে কি না। "Non-diagnostic" একটা বৈধ, নিরাপদ ফলাফল।</div>`,
bodyEn:`<h3>Quick normal values</h3>
<table class="mini"><tr><td>EPSS</td><td>≤ 7 mm</td></tr><tr><td>MAPSE</td><td>&gt; 10 mm; &lt; 8 impaired</td></tr><tr><td>TAPSE</td><td>≥ 17 mm</td></tr><tr><td>RV:LV</td><td>&lt; 0.6; ≥ 1 severe</td></tr><tr><td>RV free wall</td><td>&lt; 5 mm</td></tr><tr><td>IVC</td><td>&lt; 2.1 cm, &gt; 50% collapse</td></tr><tr><td>LVOT VTI</td><td>18–22 cm</td></tr><tr><td>LVOT diameter</td><td>1.8–2.2 cm</td></tr><tr><td>CO</td><td>4–8 L/min</td></tr><tr><td>PLR VTI rise</td><td>≥ 10–12% responsive</td></tr><tr><td>Effusion</td><td>&lt; 1 / 1–2 / &gt; 2 cm</td></tr><tr><td>Aortic root</td><td>&gt; 4 cm suspicious</td></tr></table>
<h3>ICU round sequence (~5 min)</h3><ol><li>Define the question.</li><li>Subcostal 4C.</li><li>IVC.</li><li>PLAX → PSAX → A4C.</li><li>Both lungs.</li><li>VTI and PLR if needed.</li><li>Save clips, write the report.</li></ol>
<h3>Report template</h3>
<pre class="report">FOCUSED ICU POCUS ECHO — not a formal echocardiogram
Patient/ID:            Date/time:
Operator:              Machine/probe:
Clinical question:
Image quality:         Good / Limited / Non-diagnostic
Views:                 PLAX  PSAX  A4C  SC4C  IVC  Lung  [A5C-VTI]

Pericardium:  No effusion / small / moderate / large; RA __ RV __ collapse
LV function:  Hyperdynamic / Normal / Mod. reduced / Severely reduced
RV:           Normal / Dilated (RV:LV __), TAPSE __ mm, D-septum __
IVC:          __ cm, collapse __ % (ventilated Y/N)
Valves:       MR __ AR __ AS __ TR __ (present/absent)
Lung:         A / B (focal/diffuse) / effusion / no sliding
LVOT VTI:     __ cm (PLR change __ %)

Impression:
Action:
Formal echo requested: Y/N</pre>
${SLOT('report-sheet','Your unit’s report form')}`},

{id:'echo-19',cat:'Reference',color:'#2f9e78',emoji:'🗓️',seed:true,
titleBn:'অনুশীলন পরিকল্পনা ও scan log',titleEn:'Practice plan & scan log',
bodyBn:`<p>বই পড়ে echo শেখা যায় না; হাতে-কলমে স্ক্যান করতে হয়। এই পরিকল্পনা ধরে এগোলে কয়েক সপ্তাহে view তোলা সহজ হয়ে যাবে।</p>
<h3>প্রথম দিন — শুধু view তোলা</h3>
<table class="mini">
<tr><td>১ম ঘণ্টা</td><td>মেশিন, probe marker, চারটি নড়াচড়া</td></tr>
<tr><td>২য় ঘণ্টা</td><td>PLAX</td></tr>
<tr><td>৩য় ঘণ্টা</td><td>PSAX, তিনটি level</td></tr>
<tr><td>৪র্থ ঘণ্টা</td><td>A4C</td></tr>
<tr><td>৫ম ঘণ্টা</td><td>Subcostal 4C ও IVC</td></tr>

<h3>পরের চার সপ্তাহ</h3>

bodyEn:`<p>Echo is learnt by scanning. Follow this plan.</p>
<h3>Day 1 — acquisition</h3><table class="mini"><tr><td>Hour 1</td><td>Machine, marker, four movements</td></tr><tr><td>Hour 2</td><td>PLAX</td></tr><tr><td>Hour 3</td><td>PSAX levels</td></tr><tr><td>Hour 4</td><td>A4C</td></tr><tr><td>Hour 5</td><td>Subcostal 4C and IVC</td></tr><tr><td>Hour 6</td><td>All five views on 2–3 patients; target 10 minutes</td></tr></table>
<h3>Day 2 — interpretation</h3><table class="mini"><tr><td>Hour 1</td><td>Effusion and tamponade</td></tr><tr><td>Hour 2</td><td>LV and RV function</td></tr><tr><td>Hour 3</td><td>IVC and fluid</td></tr><tr><td>Hour 4</td><td>Lung integration</td></tr><tr><td>Hour 5</td><td>Valve screening</td></tr><tr><td>Hour 6</td><td>LVOT VTI (optional) and cases</td></tr></table>
<h3>Next four weeks</h3><ul><li>Full set on at least 2 patients each round.</li><li>5 clips a week reviewed by an expert.</li><li>Target 50 logged scans.</li></ul>
<h3>Scan log fields</h3><p>Date, bed/ID, views obtained, clinical question, finding, interpretation and action, image quality, reviewer.</p>
${SLOT('practice-log','Your scan log or practice image')}
<h3>Signs of progress</h3><ul><li>Subcostal and IVC even in difficult patients.</li><li>Five views in under 10 minutes.</li><li>Your LV grades agree with an expert most of the time.</li><li>You know when to say "non-diagnostic".</li></ul>`}

 aBn:'<b>Hypovolaemic shock।</b> Hyperdynamic LV + সরু চুপসানো IVC + শুকনো lung। <b>IV fluid</b> দিন, অল্প অল্প করে; প্রতিবার পরে lung-এ নতুন B-line আর VTI দেখুন। একই ছবি sepsis-এও আসতে পারে, তাই কারণ আলাদা করে খুঁজুন।',
 aEn:'<b>Hypovolaemic shock.</b> Hyperdynamic LV, small collapsing IVC, dry lungs. Give <b>IV fluid</b> in small boluses, reassessing lungs and VTI. Sepsis can look identical — find the cause.'},
{lvl:'easy',
 sBn:'৫০ বছরের রোগী, হঠাৎ শ্বাসকষ্ট, শুয়ে থাকতে পারছেন না। Lung-এ দুই দিকে ছড়ানো B-line। LV খুব দুর্বল, EPSS ১৮ mm। IVC মোটা, প্রায় নড়ে না।',
 sEn:'50-year-old, sudden dyspnoea, orthopnoea. Bilateral diffuse B-lines. Severely reduced LV, EPSS 18 mm. Plethoric fixed IVC.',
 qBn:'কারণ কী? Saline দেবেন?',qEn:'Cause? Give saline?',
 aBn:'<b>Cardiogenic pulmonary oedema</b> (acute heart failure)। <b>Fluid নয়</b> — ফুসফুস আগে থেকেই ভেজা। Diuretic, NIV, BP থাকলে vasodilator; BP কম হলে inotrope। কারণ খুঁজুন: ECG, troponin।',
 aEn:'<b>Cardiogenic pulmonary oedema.</b> <b>No fluid</b> — lungs are already wet. Diuretic, NIV, vasodilator if BP allows; inotrope if hypotensive. ECG and troponin for the cause.'},
{lvl:'mid',
 sBn:'৩৫ বছরের রোগী, অপারেশনের পর লম্বা সময় বিছানায়। হঠাৎ শ্বাসকষ্ট ও BP কম। A4C-তে RV, LV-র চেয়ে বড়; PSAX-এ septum D-shaped; LV ছোট। Lung-এ A-line।',
 sEn:'35-year-old, prolonged bed rest after surgery. Sudden dyspnoea and hypotension. RV larger than LV in A4C, D-shaped septum, small LV. A-lines.',
 qBn:'কী সন্দেহ করবেন? Echo একা দেখে কি রোগ নিশ্চিত বলা যায়?',qEn:'What do you suspect? Can echo alone confirm it?',
 aBn:'<b>Pulmonary embolism</b> — obstructive shock। <b>না</b>, echo শুধু RV-এর ওপর চাপের ইঙ্গিত দেয়; নিশ্চিত করতে CTPA লাগে। রোগী অস্থির হলে echo-র ছবি আর clinical অবস্থা মিলিয়ে senior-এর সাথে thrombolysis ভাবা হয়। Fluid সীমিত রাখুন, noradrenaline দিন।',
 aEn:'<b>Pulmonary embolism</b> — obstructive shock. <b>No</b>, echo only shows RV strain; CTPA confirms. If unstable, thrombolysis may be considered with a senior on echo plus clinical grounds. Limit fluid, use noradrenaline.'},
{lvl:'mid',
 sBn:'BP ৮০/৫০, ঘাড়ের শিরা ফোলা। Subcostal-এ হৃৎপিণ্ডের চারপাশে ২.৫ cm কালো পানি, systole-এ RA-র দেয়াল ভেতরে ঢুকছে, IVC মোটা ও স্থির। একজন জুনিয়র furosemide দিতে চাইছেন।',
 sEn:'BP 80/50, raised JVP. 2.5 cm circumferential effusion on subcostal, RA systolic collapse, plethoric IVC. A junior wants to give furosemide.',
 qBn:'রোগনির্ণয় কী? Furosemide দেওয়া কি ঠিক? প্রথম কাজ কী?',qEn:'Diagnosis? Is furosemide right? First action?',
 aBn:'<b>Cardiac tamponade।</b> <b>Furosemide দেবেন না</b> — tamponade-এ হৃৎপিণ্ড ভরার জন্য volume দরকার; diuretic দিলে BP আরও পড়বে। প্রথম কাজ জরুরি <b>pericardiocentesis</b>; অপেক্ষায় সাবধানে fluid bolus। Intubation দরকার হলে খুব সাবধানে, কারণ positive pressure-এ arrest হতে পারে।',
 aEn:'<b>Cardiac tamponade.</b> <b>No furosemide</b> — the heart is preload dependent. Urgent <b>pericardiocentesis</b>; careful fluid meanwhile. Intubate only with great caution.'},
{lvl:'hard',
 sBn:'Septic shock, noradrenaline চলছে, ventilator-এ (PEEP ১০)। LV hyperdynamic, IVC ২.৪ cm, প্রায় নড়ছে না। Lung-এ A-line।',
 sEn:'Septic shock on noradrenaline, ventilated (PEEP 10). Hyperdynamic LV, IVC 2.4 cm and nearly fixed. A-lines.',

 aBn:'<b>না।</b> Ventilator ও PEEP-এ IVC মোটা ও স্থির দেখাতে পারে অথচ রোগী fluid-এ সাড়া দেয়। সিদ্ধান্ত নিন <b>passive leg raise করে LVOT VTI আগে-পরে মেপে</b>; ১০–১২% বা বেশি বাড়লে fluid দিন। Hyperdynamic LV আর শুকনো lung fluid সহ্য করার পক্ষে।',
 aEn:'<b>No.</b> PEEP can make the IVC fat and fixed in fluid responders. Use <b>PLR with LVOT VTI</b>; a rise ≥ 10–12% supports fluid. Hyperdynamic LV and dry lungs suggest tolerance.'},
{lvl:'hard',
 sBn:'ARDS, high PEEP, plateau pressure ৩২। BP পড়ছে। RV বড়, septum D-shaped, LV ছোট। দুই lung-এ B-line।',
 sEn:'ARDS, high PEEP, plateau pressure 32. Falling BP. Dilated RV, D-shaped septum, small LV. Bilateral B-lines.',

 aBn:'<b>Acute cor pulmonale</b> — high plateau pressure, PEEP, hypoxia, hypercapnia ও lung-এর vessel সংকোচন RV-র afterload বাড়িয়েছে। PE-ও মাথায় রাখুন। <b>Fluid দেবেন না</b> — RV আরও ফুললে septum LV-কে চেপে দেবে, BP আরও পড়বে। Plateau ও PEEP কমানো, hypoxia/hypercapnia ঠিক করা, prone position, vasopressor।',
 aEn:'<b>Acute cor pulmonale</b> from high plateau pressure, PEEP, hypoxia, hypercapnia and pulmonary vasoconstriction; keep PE in mind. <b>No fluid.</b> Lower plateau/PEEP, correct gases, prone, vasopressor.'},
{lvl:'hard',
 sBn:'Cardiac surgery-র পরের দিন। BP পড়ছে, CVP বাড়ছে, chest drain হঠাৎ কম। Subcostal ছবি খারাপ; effusion স্পষ্ট দেখা যাচ্ছে না।',
 sEn:'Day 1 after cardiac surgery. Falling BP, rising CVP, chest drain output suddenly dropped. Poor subcostal window; no clear effusion.',
 qBn:'Tamponade বাদ দিতে পারেন? পরের পদক্ষেপ?',qEn:'Can you exclude tamponade? Next step?',
 aBn:'<b>না।</b> Surgery-র পর effusion <b>loculated</b> হয়ে শুধু পেছনে বা এক পাশে জমতে পারে, যা transthoracic-এ ধরা পড়ে না। জরুরি <b>formal echo, দরকারে TOE</b>, আর সাথে সাথে cardiac surgeon-কে জানান। CXR-এ mediastinum চওড়া কি না দেখুন।',
 aEn:'<b>No.</b> Post-operative effusions can be <b>loculated</b> and missed on TTE. Urgent <b>formal echo or TOE</b> and call the cardiac surgeon. Check CXR for a widened mediastinum.'},
{lvl:'mid',
 sBn:'Anterior MI-এর ৩ দিন পর হঠাৎ তীব্র শ্বাসকষ্ট ও shock। LV জোরালোই নড়ছে। A4C-তে colour দিলে systole-এ LA ভরে যাওয়া বড় jet। Lung-এ দুই দিকে B-line।',
 sEn:'Three days after anterior MI, sudden severe dyspnoea and shock. LV still vigorous. Large systolic colour jet filling the LA in A4C. Bilateral B-lines.',
 qBn:'কী সন্দেহ করবেন? POCUS-এ এর মাত্রা লিখবেন?',qEn:'What do you suspect? Grade it on POCUS?',
 aBn:'<b>হঠাৎ গুরুতর MR</b> — papillary muscle rupture সম্ভব। LV জোরালো দেখালেও forward flow কম। POCUS-এ মাত্রা লিখবেন না; লিখুন "বড় systolic MR jet দেখা গেছে"। জরুরি <b>formal echo</b>, cardiology ও cardiac surgery-কে জানান।',
 aEn:'<b>Acute severe MR</b> — possible papillary muscle rupture. A vigorous LV can hide low forward flow. Do not grade on POCUS; document a large systolic MR jet. Urgent <b>formal echo</b>, cardiology and cardiac surgery.'},
{lvl:'mid',
 sBn:'Cardiac arrest, ২০ মিনিট CPR। Pulse check-এর ১০ সেকেন্ডে subcostal-এ হৃৎপিণ্ডের দেয়ালে কোনো নড়াচড়া নেই। Effusion নেই।',
 sEn:'Cardiac arrest, 20 minutes of CPR. During the 10-second pulse check, no wall motion on subcostal. No effusion.',
 qBn:'এর অর্থ কী? Resuscitation বন্ধের সিদ্ধান্ত কে নেবে?',qEn:'What does it mean? Who decides to stop?',
 aBn:'<b>Cardiac standstill</b> — ভালো resuscitation-এর পরও থাকলে পূর্বাভাস খারাপ। কিন্তু থামার সিদ্ধান্ত <b>পুরো দল মিলে</b> পুরো ছবি দেখে নেবে: CPR-এর সময়, কারণ, EtCO2, আগের অবস্থা। শুধু echo দেখে নয়। আর স্ক্যানের জন্য pulse check কখনো ১০ সেকেন্ডের বেশি নয়।',
 aEn:'<b>Cardiac standstill</b> — poor prognosis after adequate resuscitation. Stopping is a <b>team decision</b> using the whole picture (duration, cause, EtCO2, background), never echo alone. Never extend pulse checks beyond 10 seconds.'}

 '25F, acute severe asthma, wheeze. Bilateral A-lines with sliding, no B-lines, no effusion.',
 'Profile? এটা কী বাদ দিতে সাহায্য করে?','Profile? What does it help exclude?',
 '<b>A-profile — asthma।</b> Pneumothorax (sliding আছে), pulmonary oedema ও pneumonia (B-line/consolidation নেই) বাদ পড়ে। হঠাৎ অবনতি হলে আবার sliding দেখুন, কারণ asthma-য় pneumothorax হতে পারে।',
 '<b>A-profile — asthma.</b> Excludes pneumothorax, oedema and pneumonia at that moment. Recheck sliding if sudden deterioration.'),
KC('easy','বড় pleural effusion-এ tap করার আগে আপনি ডান পাশে স্ক্যান করছেন। শ্বাস ছাড়ার সময় diaphragm ও লিভার ওপরে উঠে আসছে।',
 'Before tapping a large right effusion, you see the diaphragm and liver rise during expiration.',
 'সুই কোথায় দেবেন? কী সাবধানতা?','Where to insert? Precautions?',
 'যেখানে পানির পকেট সবচেয়ে গভীর, আর <b>শ্বাস ছাড়ার সময়ও</b> diaphragm-এর ওপরে অন্তত কয়েক cm পানি থাকে। পাঁজরের <b>ওপরের কিনারা</b> ঘেঁষে সুই দিন। রোগী যে ভঙ্গিতে স্ক্যান করেছেন, সেই ভঙ্গিতেই tap করুন।',
 'Choose the deepest pocket that stays several cm deep even in expiration; go over the upper rib border and tap in the same position you scanned.'),
KC('mid','৫ দিন ধরে pneumonia, antibiotic চলছে কিন্তু জ্বর কমছে না। বাঁ নিচে পানি জমেছে, ভেতরে পর্দার মতো ভাগ (septation) আর ভাসমান কণা।',
 'Pneumonia for 5 days on antibiotics, still febrile. Left basal effusion with septations and floating echoes.',
 'কী সন্দেহ? কী করবেন?','Suspicion? Action?',
 '<b>Complicated parapneumonic effusion বা empyema।</b> Septation ও কণা সাধারণ পানি নয়। Diagnostic tap (pH, glucose, LDH, Gram stain), আর বেশিরভাগ ক্ষেত্রে chest drain; septation বেশি হলে intrapleural fibrinolytic বা surgery।',
 '<b>Complicated parapneumonic effusion/empyema.</b> Diagnostic tap and usually a chest drain; heavy septation may need fibrinolytics or surgery.'),
KC('mid','মোটরসাইকেল দুর্ঘটনা, BP কম। ডান PLAPS-এ diaphragm-এর ওপরে পানি, কিন্তু পুরো কালো নয়; ভেতরে ঘোলাটে, দানাদার, নিচে ঘন স্তর।',
 'Motorbike trauma, hypotensive. Right PLAPS: fluid above the diaphragm, not black but hazy and granular with a layered dependent part.',
 'কী ভাবছেন? কী করবেন?','Diagnosis? Action?',
 '<b>Haemothorax।</b> রক্ত প্রায়ই দানাদার ও স্তরে স্তরে দেখায়। BP কম থাকলে রক্ত ও fluid, chest drain, আর বেশি রক্ত বের হলে surgery। eFAST-এ পেট ও pericardium-ও দেখুন।',
 '<b>Haemothorax</b> — blood often looks granular and layered. Resuscitate, chest drain, surgery if large output; complete the eFAST.'),
KC('mid','পেটের বড় অপারেশনের পর SpO₂ কম, জ্বর নেই। দুই দিকের নিচে-পেছনে টিস্যুর মতো ছবি, ভেতরের সাদা বিন্দু স্থির, নড়ছে না; lung pulse দেখা যাচ্ছে।',
 'After major abdominal surgery, low SpO₂, afebrile. Bilateral posterior-basal tissue pattern; air bronchograms static; lung pulse visible.',
 'Consolidation না atelectasis? কী করবেন?','Pneumonia or atelectasis? Action?',
 '<b>Atelectasis।</b> <b>Static</b> air bronchogram আর জ্বর না থাকা এর পক্ষে। Chest physiotherapy, বসিয়ে রাখা, incentive spirometry, প্রয়োজনে CPAP বা recruitment। Antibiotic লাগে না।',
 '<b>Atelectasis</b> — static air bronchograms, no fever. Physiotherapy, sitting up, incentive spirometry, CPAP/recruitment; no antibiotic needed.'),
KC('mid','Ventilator-এ থাকা রোগীর হঠাৎ SpO₂ পড়ল, ভেতরে অনেক কফ। বাঁ নিচের পুরো lobe লিভারের মতো, কোনো air bronchogram নেই, sliding নেই কিন্তু lung pulse আছে; হৃৎপিণ্ড বাঁ দিকে সরে এসেছে।',
 'Ventilated patient desaturates suddenly, copious secretions. Whole left lower lobe tissue-like, no air bronchograms, no sliding but lung pulse present, heart shifted left.',
 'কী হয়েছে? সমাধান কী?','What happened? Fix?',
 '<b>Mucus plug-এ lobar collapse (resorptive atelectasis)।</b> Air bronchogram নেই কারণ bronchus বন্ধ; lung pulse থাকায় pneumothorax নয়। Suction, physiotherapy, কাজ না হলে <b>bronchoscopy</b>।',
 '<b>Lobar collapse from a mucus plug.</b> Absent air bronchograms (blocked airway); lung pulse excludes pneumothorax. Suction, physio, then <b>bronchoscopy</b>.'),
KC('mid','Sepsis-এর রোগী, P/F ratio ১২০। দুই দিকে ছাড়া-ছাড়া B-line, কিছু জায়গা সম্পূর্ণ স্বাভাবিক, pleural line খসখসে ও মোটা, pleura-র নিচে ছোট ছোট consolidation। LV স্বাভাবিক।',
 'Septic patient, P/F 120. Patchy B-lines with spared areas, thick irregular pleural line, small subpleural consolidations. Normal LV.',
 'Cardiogenic oedema না ARDS? কেন?','Cardiogenic oedema or ARDS? Why?',
 '<b>ARDS।</b> ছাড়া-ছাড়া B-line, মাঝে স্বাভাবিক জায়গা (spared areas), খসখসে pleura ও subpleural consolidation ARDS-এর পক্ষে; cardiogenic-এ B-line সমান, pleura মসৃণ, LV দুর্বল। Lung-protective ventilation।',
 '<b>ARDS</b>: patchy B-lines, spared areas, irregular pleura, subpleural consolidations, normal LV. Cardiogenic oedema gives even B-lines, smooth pleura, poor LV.'),
KC('mid','Cardiogenic pulmonary oedema-য় diuretic শুরুর আগে ৮টি জোনে মোট ৩০টি B-line ছিল। ৬ ঘণ্টা পর একই জোনে ১২টি।',
 'Cardiogenic oedema: 30 B-lines across 8 zones before diuretics; 12 in the same zones after 6 hours.',
 'এর অর্থ কী? কীভাবে কাজে লাগাবেন?','Meaning? How to use it?',
 'চিকিৎসায় <b>সাড়া দিচ্ছে</b>, ফুসফুসের পানি কমছে। B-line কয়েক ঘণ্টায় বদলায়, তাই চিকিৎসা চালানো বা কমানোর সিদ্ধান্তে দারুণ। প্রতিবার একই জোন, একই probe আর একই depth-এ গুনুন।',
 '<b>Responding</b> — lung water is falling. B-lines change within hours; count the same zones with the same probe and settings each time.'),
KC('mid','Ventilator থেকে ছাড়ানোর পরীক্ষা (SBT) চলছে। শুরুতে সামনে A-line ছিল; ৩০ মিনিট পর রোগী ঘামছে, শ্বাস দ্রুত, সামনের জোনে নতুন B-line।',
 'During an SBT, anterior zones had A-lines; after 30 minutes the patient is sweaty and tachypnoeic with new anterior B-lines.',
 'SBT কেন ব্যর্থ হলো? কী করবেন?','Why did the SBT fail? Action?',
 '<b>Weaning-induced pulmonary oedema।</b> Positive pressure সরালে venous return ও LV afterload বাড়ে, দুর্বল হৃৎপিণ্ডে পানি জমে। Echo-তে LV দেখুন; diuretic, nitrate, তারপর আবার চেষ্টা, extubation-এর পর NIV ভাবুন।',
 '<b>Weaning-induced pulmonary oedema</b> — removal of positive pressure raises preload and afterload. Check the LV; diuretic, nitrate, retry, consider post-extubation NIV.'),
KC('mid','Cardiac surgery-র পর রোগী বারবার extubation-এ ব্যর্থ। ডান দিকের diaphragm M-mode-এ শান্ত শ্বাসে প্রায় নড়ছে না (৩ mm), বাঁ দিকে ১৫ mm।',
 'After cardiac surgery, repeated weaning failure. Right hemidiaphragm excursion 3 mm on M-mode during quiet breathing; left 15 mm.',
 'কী সমস্যা? কেন হতে পারে?','Problem? Likely cause?',
 '<b>ডান diaphragm-এর দুর্বলতা বা paralysis</b> (excursion ১০ mm-এর কম অস্বাভাবিক)। Surgery-র সময় ঠান্ডা বা চোটে phrenic nerve আঘাত পেতে পারে। Weaning ধীরে করুন, sniff test-এ paradoxical নড়াচড়া দেখুন, neurology/physio।',
 '<b>Right hemidiaphragm weakness/paralysis</b> (excursion &lt; 10 mm abnormal), likely phrenic injury. Slow weaning, check for paradoxical motion on sniff.'),
KC('hard','Extubation-এর আগে diaphragm-এর মোটা হওয়া মাপছেন। শ্বাস ছাড়ার সময় পুরুত্ব ২.০ mm, শ্বাস নেওয়ার সময় ২.৩ mm।',
 'Before extubation, diaphragm thickness 2.0 mm at end-expiration and 2.3 mm at end-inspiration.',
 'Thickening fraction কত? অর্থ কী?','Thickening fraction? Meaning?',
 'TF = (২.৩ − ২.০) ÷ ২.০ = <b>১৫%</b>। সাধারণত <b>৩০%-এর কম</b> হলে weaning ব্যর্থ হওয়ার ঝুঁকি বেশি। কারণ খুঁজুন (ICU-acquired weakness, sedation, electrolyte) আর একা এই সংখ্যার ওপর সিদ্ধান্ত নেবেন না।',
 'TF = (2.3 − 2.0) ÷ 2.0 = <b>15%</b>; &lt; 30% predicts weaning failure. Look for causes; never decide on this number alone.'),
KC('mid','ARDS রোগীর ১২টি জোনে lung ultrasound score করছেন: প্রতিটি জোন ০ (A-line), ১ (আলাদা B-line), ২ (মিলে যাওয়া B-line), ৩ (consolidation)। মোট স্কোর ২৮।',
 'ARDS patient, 12-zone lung ultrasound score: 0 A-lines, 1 separate B-lines, 2 coalescent B-lines, 3 consolidation. Total 28.',
 'স্কোরের অর্থ কী? কীভাবে কাজে লাগে?','Meaning and use?',
 'সর্বোচ্চ ৩৬; <b>২৮ মানে ফুসফুসের বড় অংশে বাতাস নেই</b> (severe loss of aeration)। একই রোগীতে বারবার করে PEEP, prone বা চিকিৎসার পর বাতাস ফিরছে কি না দেখা যায়। স্কোর বাড়লে অবনতি।',
 'Maximum 36; <b>28 means extensive loss of aeration</b>. Repeat to monitor PEEP, prone or treatment response.'),
KC('hard','Severe ARDS রোগীকে ১৬ ঘণ্টা prone রাখা হয়েছে। আগে পেছনের জোনে consolidation (স্কোর ৩) ছিল, এখন একই জায়গায় আলাদা B-line (স্কোর ১)।',
 'Severe ARDS after 16 hours prone. Posterior zones previously consolidated (score 3) now show separate B-lines (score 1).',
 'এর অর্থ কী?','Meaning?',
 '<b>পেছনের ফুসফুসে বাতাস ফিরছে (re-aeration)</b> — prone-এ সাড়া দিচ্ছে। Oxygenation-এর সাথে মিলিয়ে prone চালিয়ে যান। সামনে নতুন consolidation হলো কি না-ও দেখুন।',
 '<b>Posterior re-aeration</b> — responding to proning. Continue alongside oxygenation; also check anterior zones.'),
KC('hard','ARDS রোগীতে PEEP ৫ থেকে ১২ করার পর সামনের-পাশের জোনে B-line কমে কিছু জায়গায় A-line ফিরেছে; কিন্তু BP পড়ে গেছে, LVOT VTI কমেছে।',
 'In ARDS, raising PEEP from 5 to 12 converts some antero-lateral B-lines to A-lines, but BP and LVOT VTI fall.',
 'PEEP কি ভালো হলো?','Was the PEEP increase good?',
 'ফুসফুসে <b>recruitment হয়েছে</b>, কিন্তু venous return কমে বা RV-র ওপর চাপ বেড়ে <b>cardiac output কমেছে</b>। RV দেখুন; fluid responsive হলে সাবধানে fluid, নাহলে PEEP একটু কমিয়ে ভারসাম্য খুঁজুন। ফুসফুস আর হৃৎপিণ্ড একসাথে দেখতে হয়।',
 '<b>Recruitment occurred</b> but <b>cardiac output fell</b>. Check the RV; give fluid if responsive or titrate PEEP down. Lungs and heart must be assessed together.'),
KC('mid','ভাইরাল pneumonia (যেমন COVID), জ্বর, শ্বাসকষ্ট। দুই দিকে ছাড়া-ছাড়া B-line, বিশেষত পেছনে-নিচে; pleural line ভাঙা ভাঙা; pleura-র নিচে ছোট consolidation; মাঝে মাঝে স্বাভাবিক জায়গা।',
 'Viral pneumonia (e.g. COVID): bilateral patchy posterior-basal B-lines, fragmented pleura, small subpleural consolidations, spared areas.',
 'প্যাটার্ন কী বলছে? কীভাবে নজর রাখবেন?','What does the pattern suggest? How to monitor?',
 '<b>Viral interstitial pneumonia</b>-র ধরন। Lung ultrasound score দিয়ে প্রতিদিন দেখুন; স্কোর বাড়লে oxygen ও ventilation-এর প্রয়োজন বাড়ছে। Probe প্রতিবার জীবাণুমুক্ত করুন।',
 'Typical <b>viral interstitial pneumonia</b>. Track with the lung ultrasound score; rising scores predict escalation. Disinfect the probe.'),
KC('hard','Ventilator-এর রোগী, peak pressure হঠাৎ বেড়েছে, BP ৬০/৩০, SpO₂ ৭০%। বাঁ সামনে sliding নেই, lung pulse নেই, B-line নেই; lung point খুঁজতে খুঁজতে ২ মিনিট পার।',
 'Ventilated patient: sudden high peak pressure, BP 60/30, SpO₂ 70%. Left anterior: no sliding, no lung pulse, no B-lines; 2 minutes spent searching for a lung point.',
 'কী করা উচিত ছিল?','What should have been done?',
 '<b>Tension pneumothorax</b> ধরে নিয়ে <b>সাথে সাথে decompression</b> (needle বা finger thoracostomy), তারপর chest drain। অস্থির রোগীতে lung point খোঁজায় সময় নষ্ট করবেন না; বড় pneumothorax-এ lung point না-ও থাকতে পারে।',
 'Treat as <b>tension pneumothorax — decompress immediately</b>, then chest drain. Don\'t waste time hunting a lung point in an unstable patient; it may be absent in large pneumothorax.'),
KC('mid','বুকে ICD (chest drain) আছে এমন trauma রোগী। Probe রাখলেই স্ক্রিন এলোমেলো, ধূসর রেখায় ভরা; pleural line খুঁজে পাচ্ছেন না; চামড়া চাপলে কড়কড় শব্দ।',
 'Trauma patient with a chest drain. Screen full of messy grey lines, no pleural line visible, crepitus on pressure.',
 'কী সমস্যা? এখান থেকে কী সিদ্ধান্ত নেবেন?','Problem? What can you conclude?',
 '<b>Subcutaneous emphysema</b> — বাতাস probe আর pleura-র মাঝে, তাই ফুসফুস দেখা যাচ্ছে না। <b>এই জায়গা থেকে কোনো সিদ্ধান্ত নয়</b>; অন্য জায়গা চেষ্টা করুন, না হলে CXR বা CT।',
 '<b>Subcutaneous emphysema</b> blocks the view. <b>No conclusion from this area</b>; try elsewhere or use CXR/CT.'),
KC('hard','বয়স্ক COPD রোগী, হঠাৎ শ্বাসকষ্ট বেড়েছে। ডান সামনে sliding নেই, A-line, কিন্তু অনেক খুঁজেও lung point নেই; বাঁ দিকেও sliding খুব কম।',
 'Elderly COPD patient with sudden worse dyspnoea. Right anterior: no sliding, A-lines, no lung point found; left also has minimal sliding.',
 'Pneumothorax ধরে drain দেবেন?','Insert a drain for pneumothorax?',
 '<b>সাবধান।</b> বড় bulla বা hyperinflated ফুসফুসেও sliding কম বা অনুপস্থিত থাকে, তাই lung point ছাড়া নিশ্চিত নয়। রোগী স্থিতিশীল হলে <b>CT করে তারপর drain</b>, কারণ bulla-য় drain দিলে বড় ক্ষতি হতে পারে।',
 '<b>Caution.</b> Bullae and hyperinflation can abolish sliding; without a lung point it isn\'t confirmed. If stable, <b>CT before any drain</b> to avoid draining a bulla.'),
KC('mid','পুরনো TB-র ইতিহাস। ডান সামনে sliding নেই, কিন্তু হৃৎস্পন্দনের তালে pleural line কাঁপছে (lung pulse), pleural line মোটা ও এবড়োখেবড়ো।',
 'Old TB. Right anterior: no sliding but lung pulse present, thick irregular pleura.',
 'Pneumothorax কি?','Pneumothorax?',
 '<b>না।</b> Lung pulse মানে দুই pleura লেগে আছে। পুরনো TB-তে <b>pleural adhesion</b> বা মোটা হয়ে যাওয়া pleura-র জন্য sliding নেই।',
 '<b>No.</b> Lung pulse means the pleura are apposed; sliding is lost from <b>pleural adhesions/thickening</b>.'),
KC('hard','বুকে আঘাতের পর রোগী বসে আছেন। ডান পাশে নিচে কালো পানি, তার ওপরে একটা আনুভূমিক উজ্জ্বল রেখা শ্বাসের সাথে ওপর-নিচ করছে, রেখার ওপরে A-line আর কোনো sliding নেই।',
 'After chest trauma, seated patient. Right side: anechoic fluid below a horizontal bright line that moves with breathing; above it A-lines without sliding.',
 'এটা কী?','What is this?',
 '<b>Hydropneumothorax (বা haemopneumothorax)।</b> বাতাস ও পানির সীমানা একটা চলমান আনুভূমিক রেখা তৈরি করে। Chest drain লাগবে; রক্ত হলে পরিমাণ মাপুন।',
 '<b>Hydro/haemopneumothorax</b> — the air–fluid interface forms a moving horizontal line. Needs a chest drain.'),
KC('easy','Pleural tap শেষ। আপনি একই জায়গা আর সামনের জোন আবার স্ক্যান করলেন: sliding আছে, seashore sign।',
 'After thoracentesis you rescan the site and anterior zones: sliding present, seashore sign.',
 'Pneumothorax হয়েছে কি? CXR লাগবে?','Pneumothorax? Need CXR?',
 '<b>দেখা জায়গাগুলোতে pneumothorax নেই</b>; sliding থাকলে pneumothorax বাদ দেওয়া যায় খুব নির্ভরযোগ্যভাবে। উপসর্গ না থাকলে রুটিন CXR প্রায়ই লাগে না (স্থানীয় নিয়ম মেনে)।',
 '<b>No pneumothorax where scanned</b> — sliding reliably excludes it. Routine CXR often unnecessary if asymptomatic (follow local policy).'),
KC('mid','বহু বছরের শুকনো কাশি, আঙুলে clubbing, শ্বাসকষ্ট ধীরে বাড়ছে। দুই দিকের নিচে B-line, কিন্তু pleural line মোটা, ভাঙা, এবড়োখেবড়ো; LV স্বাভাবিক, IVC সরু।',
 'Years of dry cough, clubbing, slowly worsening dyspnoea. Basal B-lines with thick fragmented irregular pleura; normal LV, small IVC.',
 'পানি জমা নাকি অন্য কিছু? Diuretic দেবেন?','Fluid or something else? Diuretic?',
 '<b>Interstitial lung disease (fibrosis)।</b> B-line আছে কিন্তু পানি নয়; খসখসে pleura, স্বাভাবিক LV আর সরু IVC এর পক্ষে। <b>Diuretic-এর লাভ নেই</b>; HRCT ও chest physician।',
 '<b>Interstitial lung disease</b> — B-lines without fluid overload (irregular pleura, normal LV, small IVC). <b>Diuretics won\'t help</b>; HRCT.'),
KC('hard','হঠাৎ বুকে ধারালো ব্যথা ও অল্প রক্তকাশি। বাঁ নিচে pleura-র ঠিক নিচে ছোট ত্রিভুজ আকৃতির consolidation, air bronchogram নেই, পাশে অল্প পানি। বাঁ পায়ের popliteal vein চাপলে চুপসায় না।',
 'Sudden pleuritic pain and mild haemoptysis. Small wedge-shaped subpleural consolidation without air bronchograms, small adjacent effusion. Left popliteal vein non-compressible.',
 'কী সন্দেহ?','Suspicion?',
 '<b>PE-র সাথে pulmonary infarction।</b> Air bronchogram ছাড়া ত্রিভুজ subpleural consolidation আর DVT একসাথে PE-র জোরালো ইঙ্গিত। CTPA, anticoagulation।',
 '<b>Pulmonary infarction from PE</b> — wedge-shaped subpleural consolidation without air bronchograms plus DVT. CTPA, anticoagulate.'),
KC('mid','মদ্যপ রোগী, বমির পর জ্বর ও দুর্গন্ধযুক্ত কফ। ডান নিচে consolidation, তার ভেতরে গোল কালো জায়গা, চারপাশে মোটা দেয়াল।',
 'Alcoholic patient with fever and foul sputum after vomiting. Right basal consolidation containing a round anechoic area with a thick wall.',
 'কী ভাবছেন?','What do you think?',
 '<b>Lung abscess</b> (aspiration-এর পর)। Consolidation-এর ভেতরে তরল বা পুঁজভরা গহ্বর। দীর্ঘ antibiotic, CT; ফুসফুসের ভেতরের abscess-এ সাধারণত drain দেওয়া হয় না।',
 '<b>Lung abscess</b> after aspiration — a fluid-filled cavity inside consolidation. Prolonged antibiotics and CT.'),
KC('mid','চিত হয়ে শুয়ে থাকা ventilator রোগী, aspiration-এর সন্দেহ। সামনের সব জোনে A-line; আপনি স্ক্যান শেষ ভাবছেন।',
 'Supine ventilated patient with suspected aspiration. All anterior zones show A-lines; you think the scan is complete.',
 'ভুল কোথায়?','What is wrong?',
 'চিত রোগীর aspiration ও consolidation প্রথমে জমে <b>পেছনে-নিচে</b>। <b>PLAPS ও পেছনের জোন</b> না দেখলে pneumonia মিস হবে। রোগীকে একটু কাত করে পেছন দেখুন।',
 'In supine patients aspiration settles <b>posteriorly</b>. Without <b>PLAPS and posterior zones</b> you will miss the pneumonia.'),
KC('hard','নতুন রক্ত দেওয়ার ২ ঘণ্টার মধ্যে হঠাৎ শ্বাসকষ্ট ও hypoxia। দুই দিকে ছড়ানো B-line। LV স্বাভাবিক, IVC সরু, চুপসে যায়।',
 'Within 2 hours of transfusion, sudden dyspnoea and hypoxia. Bilateral B-lines, normal LV, small collapsing IVC.',
 'TACO না TRALI? কেন?','TACO or TRALI? Why?',
 '<b>TRALI-র দিকে বেশি</b> — ফুসফুস ভেজা কিন্তু হৃৎপিণ্ড স্বাভাবিক আর volume বেশি নয়। TACO হলে সাধারণত IVC মোটা, LV দুর্বল বা চাপ বেশি। TRALI-তে diuretic নয়; সহায়ক চিকিৎসা, blood bank-কে জানান।',
 '<b>Favours TRALI</b> — wet lungs with normal LV and small IVC. TACO usually shows a plethoric IVC/high filling. No diuretics for TRALI; report to the blood bank.'),
KC('hard','ARDS রোগী, আগের দিন ডান সামনে B-line ছিল। আজ হঠাৎ SpO₂ কম; একই জায়গায় শুধু A-line, sliding নেই।',
 'ARDS patient had right anterior B-lines yesterday; today sudden desaturation with only A-lines and no sliding there.',
 'কী সন্দেহ?','Suspicion?',
 '<b>Barotrauma-জনিত pneumothorax।</b> B-line pleura থেকে উঠে, তাই B-line থাকলে সেখানে pneumothorax থাকে না; হঠাৎ B-line উধাও হয়ে A-line + sliding নেই হলে বাতাস ঢুকেছে। Lung point খুঁজুন, অস্থির হলে decompress।',
 '<b>Barotrauma pneumothorax.</b> B-lines exclude pneumothorax locally; their sudden disappearance with absent sliding means air has entered.'),
KC('mid','গর্ভাবস্থার ৩৪ সপ্তাহ, pre-eclampsia, BP ১৭০/১১০, হঠাৎ শ্বাসকষ্ট। দুই দিকে B-line; LV function স্বাভাবিক।',
 '34 weeks pregnant, pre-eclampsia, BP 170/110, sudden dyspnoea. Bilateral B-lines; normal LV.',
 'কী হয়েছে? কী করবেন?','Diagnosis? Action?',
 '<b>Pre-eclampsia-জনিত pulmonary oedema</b> (চাপ বেশি ও capillary leak)। Fluid সীমিত করুন, BP কমান, magnesium, oxygen বা NIV, প্রয়োজনে diuretic; প্রসবের পরিকল্পনা obstetrician-এর সাথে। B-line দিয়ে fluid সিদ্ধান্তে নজর রাখুন।',
 '<b>Pre-eclampsia pulmonary oedema.</b> Restrict fluid, control BP, magnesium, oxygen/NIV, diuretic if needed; plan delivery with obstetrics.'),
KC('mid','পুকুরে ডুবে যাওয়া কিশোর, উদ্ধার হয়েছে। শ্বাসকষ্ট, দুই দিকে ছড়ানো B-line ও কিছু consolidation।',
 'Teenager rescued from drowning: dyspnoea, bilateral B-lines with some consolidations.',
 'কারণ কী?','Cause?',
 '<b>Drowning-জনিত non-cardiogenic oedema ও aspiration।</b> Surfactant নষ্ট হয়ে অ্যালভিওলাইতে পানি। Oxygen, PEEP বা NIV; antibiotic সবসময় লাগে না, জ্বর বা নোংরা পানি হলে ভাবুন।',
 '<b>Drowning-related non-cardiogenic oedema/aspiration.</b> Oxygen, PEEP/NIV; antibiotics only if indicated.'),
KC('easy','পেট ফোলা, লিভার সিরোসিস। ডান PLAPS-এ কালো পানি দেখছেন; নিশ্চিত নন এটা diaphragm-এর ওপরে না নিচে।',
 'Cirrhotic with distension. Right PLAPS shows black fluid; unsure if it is above or below the diaphragm.',
 'Pleural effusion না ascites কীভাবে বুঝবেন?','Effusion vs ascites — how to tell?',
 'আগে <b>diaphragm খুঁজুন</b> (উজ্জ্বল বাঁকা রেখা)। পানি তার <b>ওপরে, ফুসফুসের পাশে</b> হলে pleural effusion; <b>নিচে, লিভারের চারপাশে</b> হলে ascites। সিরোসিসে দুটো একসাথেও থাকে (hepatic hydrothorax)।',
 'Find the <b>diaphragm</b>: fluid above it beside lung = effusion; below it around the liver = ascites. Both can coexist (hepatic hydrothorax).'),
KC('hard','বাঁ নিচে ধূসর জায়গা, নিশ্চিত নন consolidation নাকি ঘোলাটে effusion। ভেতরের কণা শ্বাসের সাথে ঘূর্ণির মতো ঘুরছে; কোনো রেখার মতো air bronchogram নেই।',
 'Left basal grey area — consolidation or echogenic effusion? Particles swirl with breathing; no linear air bronchograms.',
 'কোনটা? কেন?','Which? Why?',
 '<b>ঘোলাটে (echogenic) effusion।</b> কণার ঘূর্ণি (plankton sign) পানির পক্ষে; consolidation-এ ডালপালার মতো air bronchogram থাকে আর টিস্যু স্থির। ভেতরে colour Doppler দিলে পানিতে ঘূর্ণি-রং আসতে পারে। Tap করে প্রকৃতি দেখুন।',
 '<b>Echogenic effusion</b> — swirling particles (plankton sign) favour fluid; consolidation has branching air bronchograms. Sample it.'),
KC('hard','জরুরি intubation-এর পর capnography নেই। দুই দিকে ventilation দিলেও কোনো দিকে sliding নেই; গলায় probe রাখলে trachea-র পাশে দ্বিতীয় একটা উজ্জ্বল বাঁকা রেখা ও ছায়া।',
 'After emergency intubation without capnography: no sliding on either side with ventilation; neck scan shows a second bright curved line and shadow beside the trachea.',
 'কী হয়েছে? কী করবেন?','What happened? Action?',
 '<b>Oesophageal intubation।</b> গলায় "double trachea" চিহ্ন আর দুই দিকে sliding না থাকা এর পক্ষে। <b>সাথে সাথে tube বের করে</b> bag-mask দিয়ে oxygen, তারপর আবার intubation; capnography দিয়ে নিশ্চিত করুন।',
 '<b>Oesophageal intubation</b> — "double trachea" sign and bilateral absent sliding. <b>Remove the tube</b>, oxygenate, re-intubate, confirm with capnography.'),
KC('mid','Trauma রোগী, BP কম। eFAST-এ ডান pleural জায়গায় পানি, দুই দিকে sliding আছে, পেটে Morison\'s pouch-এ পানি নেই, pericardium-এ পানি নেই।',
 'Hypotensive trauma patient. eFAST: right pleural fluid, bilateral sliding, no free fluid in Morison\'s pouch, no pericardial fluid.',
 'রক্তক্ষরণের উৎস কোথায় সম্ভাব্য? পরের কাজ?','Likely bleeding source? Next step?',
 '<b>ডান haemothorax</b> সম্ভাব্য উৎস; pneumothorax ও tamponade নেই। Chest drain, রক্ত, বের হওয়া রক্তের পরিমাণ মাপুন; বেশি হলে thoracotomy। নেগেটিভ FAST মানে পেটে রক্তক্ষরণ পুরোপুরি বাদ নয়।',
 '<b>Right haemothorax</b> is the likely source. Chest drain, blood, measure output. A negative abdominal FAST doesn\'t fully exclude intra-abdominal bleeding.'),
KC('easy','Ventilator রোগী, ডান দিকে sliding নেই কিন্তু lung pulse আছে, বাঁ দিকে sliding আছে। CXR-এ tube-এর মাথা carina-র নিচে।',
 'Ventilated patient: right sliding absent with lung pulse; left sliding present. CXR shows the tube tip below the carina.',
 'কী হয়েছে? এটা কি সাধারণ ঘটনা থেকে আলাদা?','What happened? How is it unusual?',
 'Tube <b>বাঁ main bronchus-এ</b> ঢুকেছে, তাই ডান ফুসফুসে বাতাস যাচ্ছে না। সাধারণত tube ডান দিকে যায়, তাই উল্টো হলেও একই নিয়ম: যে পাশে sliding নেই অথচ lung pulse আছে, সেই পাশ ventilate হচ্ছে না। Tube পিছিয়ে আনুন।',
 'Tube in the <b>left main bronchus</b>; the right lung isn\'t ventilated. Same rule either side: no sliding + lung pulse = not ventilated. Withdraw the tube.'),
KC('mid','Septic shock রোগীকে এ পর্যন্ত ৪ লিটার fluid দেওয়া হয়েছে। BP এখনো কম। সামনের জোনে আগে A-line ছিল, এখন দুই দিকে ৩–৪টি করে B-line।',
 'Septic shock after 4 L of fluid, still hypotensive. Anterior A-lines have become 3–4 B-lines per zone bilaterally.',
 'আরও fluid দেবেন?','More fluid?',
 '<b>না।</b> নতুন B-line মানে ফুসফুস আর fluid সহ্য করছে না। <b>Noradrenaline</b> শুরু বা বাড়ান; echo-তে LV দেখুন (septic cardiomyopathy?), দরকারে inotrope।',
 '<b>No.</b> New B-lines mean fluid intolerance. Start/increase <b>noradrenaline</b>, check the LV for septic cardiomyopathy.'),
KC('hard','৭০ বছরের রোগী, মাসখানেক ধরে ওজন কমছে, ডান বুকে বড় effusion। ভেতরে পানি কালো, কিন্তু diaphragm-এর ওপর কয়েকটি গোল টিস্যুর গুটি; pleura অসমভাবে মোটা (১ cm-এর বেশি)।',
 '70-year-old with weight loss, large right effusion. Black fluid but several nodules on the diaphragm; irregular pleural thickening &gt; 1 cm.',
 'কী সন্দেহ?','Suspicion?',
 '<b>Malignant pleural effusion।</b> Pleura বা diaphragm-এ গুটি আর ১ cm-এর বেশি অসম মোটা pleura ক্যানসারের পক্ষে। Tap করে cytology, CT, chest physician; বারবার জমলে pleurodesis বা indwelling catheter।',
 '<b>Malignant pleural effusion</b> — pleural/diaphragmatic nodules and irregular thickening &gt; 1 cm. Cytology, CT, specialist referral.'),
KC('easy','Junior জিজ্ঞেস করছেন: "B-line আর comet tail (Z-line) একই কি?" আপনি এক জায়গায় দেখছেন ছোট উজ্জ্বল রেখা pleura থেকে নেমে কয়েক cm-এ মিলিয়ে গেছে, A-line মুছে দেয়নি, sliding-এর সাথে নড়ছে না।',
 'A junior asks if B-lines and comet tails (Z-lines) are the same. You see short bright lines from the pleura fading within a few cm, not erasing A-lines, not moving with sliding.',
 'এটা কী? অর্থ আছে কি?','What is it? Significance?',
 'এটা <b>Z-line</b>, B-line নয়। B-line স্ক্রিনের নিচ পর্যন্ত যায়, A-line মুছে দেয় আর sliding-এর সাথে নড়ে। Z-line-এর কোনো রোগগত অর্থ নেই।',
 'This is a <b>Z-line</b>, not a B-line. B-lines reach the bottom, erase A-lines and move with sliding. Z-lines are meaningless.'),
KC('hard','ডান pneumonia আর বড় effusion-এর রোগীর chest drain দেওয়া হয়েছে। ১ লিটার বের হওয়ার পর রোগী কাশছেন, বুকে টান, SpO₂ কমছে; একই পাশে নতুন ছড়ানো B-line।',
 'After draining 1 L from a large right effusion, the patient coughs, has chest tightness and desaturates; new diffuse B-lines on that side.',
 'কী হয়েছে? কীভাবে এড়ানো যেত?','What happened? Prevention?',
 '<b>Re-expansion pulmonary oedema।</b> অনেক দিন চুপসে থাকা ফুসফুস হঠাৎ ফুললে হয়। Drain থামান, oxygen বা NIV। এড়াতে একবারে ১–১.৫ লিটারের বেশি বের করবেন না, আর কাশি বা বুকে টান হলে থামুন।',

KC('hard','পুরোপুরি sedated, ventilator-এ (tidal volume ৮ mL/kg, sinus rhythm)। IVC শ্বাস ঢোকানোর সময় ২.০ cm, শেষে ১.৬ cm।',
 'Fully sedated, ventilated (Vt 8 mL/kg, sinus rhythm). IVC 2.0 cm at inspiration and 1.6 cm at expiration.',
 'Distensibility index কত? অর্থ কী?','Distensibility index? Meaning?',
 'DI = (২.০ − ১.৬) ÷ ১.৬ = <b>২৫%</b>; ১৮%-এর বেশি হলে fluid responsive হওয়ার সম্ভাবনা। শর্তগুলো (পুরো passive, ৮ mL/kg, sinus) মিলেছে বলে এখানে এটা ব্যবহার করা যায়।',
 'DI = (2.0 − 1.6) ÷ 1.6 = <b>25%</b>; &gt; 18% suggests responsiveness. Valid here because all conditions are met.'),
KC('mid','শকের রোগী, ২ লিটার fluid পেয়েছেন। PLR-এর আগে VTI ১৬ cm, পরে ১৬.৮ cm।',
 'Shocked patient after 2 L fluid. VTI 16 cm before PLR and 16.8 cm after.',
 'আরও fluid দেবেন?','More fluid?',
 'বৃদ্ধি মাত্র <b>৫%</b> — fluid responsive নয়। আরও fluid দিলে লাভ নেই, ক্ষতির ঝুঁকি। <b>Vasopressor</b> শুরু বা বাড়ান।',
 'Only a <b>5%</b> rise — not responsive. Start or increase a <b>vasopressor</b>.'),
KC('mid','Cardiogenic shock, LV খুব দুর্বল, VTI ৯ cm। Dobutamine শুরুর ৩০ মিনিট পর VTI ১৪ cm, lactate কমছে।',
 'Cardiogenic shock with a poor LV, VTI 9 cm. Thirty minutes after dobutamine, VTI 14 cm and lactate falling.',
 'এর অর্থ কী?','Meaning?',
 'Inotrope-এ <b>সাড়া দিচ্ছে</b> — stroke volume প্রায় ৫০% বেড়েছে। VTI বারবার মেপে dose ঠিক করুন; tachycardia বা arrhythmia-র দিকে নজর রাখুন।',
 '<b>Responding</b> to inotrope — stroke volume up about 50%. Titrate using serial VTI; watch for tachyarrhythmia.'),
KC('hard','পেটের অপারেশনের পর পেট টানটান, urine কম। IVC ২.৩ cm, প্রায় নড়ে না। Bladder pressure ২৪ mmHg। LV hyperdynamic।',
 'After abdominal surgery: tense abdomen, oliguria. IVC 2.3 cm and fixed; bladder pressure 24 mmHg; hyperdynamic LV.',
 'IVC মোটা মানে কি পানি বেশি?','Does the fat IVC mean fluid overload?',
 '<b>না, intra-abdominal hypertension IVC-কে ভুল দেখাচ্ছে।</b> পেটের চাপ IVC ও RA-র চাপ বাড়ায়। Hyperdynamic LV volume কম থাকার ইঙ্গিত দেয়। পেটের চাপ কমানোর ব্যবস্থা (decompression, sedation, drainage) আর PLR/VTI দিয়ে fluid সিদ্ধান্ত।',
 '<b>No — intra-abdominal hypertension distorts the IVC.</b> Address abdominal pressure and use VTI-based assessment.'),
KC('mid','পুরনো rheumatic রোগী। IVC ২.৬ cm, নড়ে না; A4C-তে বিশাল TR jet RA ভরে দিচ্ছে; hepatic vein-এ উল্টো প্রবাহ।',
 'Known rheumatic disease. IVC 2.6 cm, fixed; huge TR jet filling the RA; reversed hepatic vein flow.',
 'IVC মোটা থাকার কারণ কী?','Why is the IVC plethoric?',
 '<b>Severe TR</b> — রক্ত বারবার RA ও IVC-তে ফিরে আসে, তাই IVC মোটা থাকে। এখানে IVC দিয়ে volume বোঝা যায় না; অন্য মাপ ব্যবহার করুন।',
 '<b>Severe TR</b> keeps the IVC plethoric; IVC cannot judge volume here.'),
KC('hard','বড় effusion, tamponade; pericardiocentesis-এর প্রস্তুতি। Subcostal-এ পানির স্তর মাত্র ০.৮ cm আর মাঝে লিভার; apical জায়গায় ২.৫ cm।',
 'Large effusion with tamponade; preparing pericardiocentesis. Subcostal pocket only 0.8 cm with liver in between; apical pocket 2.5 cm.',
 'কোন পথে সুই দেবেন?','Which approach?',
 '<b>Apical (বা যেখানে পকেট সবচেয়ে বড় ও কাছে)।</b> Echo দেখে সবচেয়ে গভীর পানি আর পথে কোনো অঙ্গ নেই এমন জায়গা বেছে নিন। Apical পথে lingula ও LAD-এর কাছ দিয়ে না গিয়ে পাঁজরের ওপরের কিনারা ঘেঁষে যান।',
 '<b>Apical</b> — choose the deepest pocket with no organ in the path. Echo guidance beats the blind subxiphoid route.'),
KC('hard','Pacemaker lead বসানোর এক ঘণ্টা পর রোগীর BP পড়ছে, ঘাম, অস্থিরতা। আগে কোনো effusion ছিল না; এখন ১.৫ cm, RV diastolic collapse।',
 'One hour after pacemaker lead insertion: falling BP, sweating, agitation. Previously no effusion; now 1.5 cm with RV diastolic collapse.',
 'কী হয়েছে? কতটা জরুরি?','What happened? Urgency?',
 '<b>Lead-এ হৃৎপিণ্ড ছিদ্র হয়ে haemopericardium ও tamponade।</b> অল্প পানিও দ্রুত জমায় বিপজ্জনক। জরুরি pericardiocentesis, cardiology ও cardiac surgery-কে জানান।',
 '<b>Cardiac perforation with haemopericardium and tamponade.</b> Emergency pericardiocentesis and specialist input.'),
KC('mid','Cardiac arrest, monitor-এ PEA। Pulse check-এর সময় subcostal-এ হৃৎপিণ্ড নিয়মিত চাপছে, valve খুলছে-বন্ধ হচ্ছে, কিন্তু pulse পাওয়া যাচ্ছে না।',
 'PEA arrest. During the pulse check, the heart contracts regularly with valve motion but no palpable pulse.',
 'এর নাম কী? চিকিৎসায় কী বদলায়?','What is this? How does management change?',
 '<b>Pseudo-PEA</b> — খুব কম cardiac output। এই রোগীদের ফেরার সম্ভাবনা বেশি। কারণ খুঁজুন ও ঠিক করুন (hypovolaemia, tamponade, PE, acidosis, hyperkalaemia), vasopressor; অনেক জায়গায় arterial line দিয়ে চাপ দেখা হয়।',
 '<b>Pseudo-PEA</b> — very low output with better prognosis. Treat causes, vasopressors, consider arterial line.'),
KC('mid','Cardiac arrest, monitor-এ asystole। Subcostal-এ দেখা গেল ventricle-এর দেয়াল দ্রুত, এলোমেলোভাবে কাঁপছে।',
 'Arrest with asystole on the monitor; subcostal shows rapid chaotic quivering of the ventricular walls.',
 'কী করবেন?','Action?',
 '<b>Fine VF</b>, monitor-এ asystole মনে হচ্ছে। <b>Defibrillate</b> করুন (shockable rhythm হিসেবে)। Monitor-এর lead ও gain-ও দেখুন।',
 '<b>Fine VF</b> masquerading as asystole — <b>defibrillate</b>.'),
KC('hard','অপারেশনের পর বিছানায় থাকা রোগীর হঠাৎ cardiac arrest। Pulse check-এ subcostal-এ RV বিশাল, LV প্রায় দেখা যায় না, কোনো effusion নেই।',
 'Post-operative bed-bound patient arrests. Subcostal pulse check: huge RV, tiny LV, no effusion.',
 'কী ভাবছেন? কী করবেন?','Impression? Action?',
 '<b>Massive PE সম্ভাব্য।</b> Arrest-এ thrombolysis বিবেচনা করুন (দিলে CPR অন্তত ৬০–৯০ মিনিট চালাতে হতে পারে)। তবে arrest নিজেও RV বড় করতে পারে, তাই clinical ছবি মিলিয়ে দলের সিদ্ধান্ত।',
 '<b>Likely massive PE</b> — consider thrombolysis (and prolonged CPR). Arrest itself can dilate the RV; decide as a team.'),
KC('mid','সড়ক দুর্ঘটনা, পেটে আঘাত, arrest। Subcostal-এ হৃৎপিণ্ড ছোট, ফাঁকা, জোরে চাপছে; IVC চ্যাপ্টা; Morison\'s pouch-এ পানি।',
 'Road traffic trauma with abdominal injury, arrest. Small empty vigorously contracting heart, flat IVC, fluid in Morison\'s pouch.',
 'কারণ কী? কী করবেন?','Cause? Action?',
 '<b>Hypovolaemic (haemorrhagic) arrest।</b> দ্রুত রক্ত ও fluid, massive transfusion, পেটে রক্তক্ষরণ বন্ধে surgery। Compression-এর চেয়ে volume ফেরানো এখানে বেশি জরুরি।',
 '<b>Haemorrhagic arrest.</b> Rapid blood, massive transfusion, surgical haemorrhage control.'),
KC('easy','একজন trainee arrest-এ subcostal view খুঁজতে খুঁজতে ২৫ সেকেন্ড compression বন্ধ রেখেছেন।',
 'A trainee kept compressions paused for 25 seconds while searching for a subcostal view.',
 'ভুল কোথায়? কীভাবে এড়াবেন?','What went wrong? How to avoid it?',
 'Pulse check <b>১০ সেকেন্ডের বেশি নয়</b>; প্রতিটি থামা brain perfusion কমায়। Compression চলার সময়ই probe বসিয়ে প্রস্তুত থাকুন, clip record করে পরে দেখুন, একজন জোরে গুনুক। ১০ সেকেন্ডে না পেলে compression আবার শুরু।',
 'Never exceed <b>10 seconds</b>. Prepare during compressions, record a clip, have someone count, resume compressions on time.'),
KC('mid','২২ বছরের যুবক, এক সপ্তাহ আগে জ্বর-সর্দি, এখন বুকে ব্যথা, শ্বাসকষ্ট, BP কম। LV সার্বিকভাবে খুব দুর্বল, দেয়াল একটু মোটা দেখাচ্ছে, অল্প effusion।',
 '22-year-old with a viral illness last week, now chest pain, dyspnoea and hypotension. Globally severely reduced LV, slightly thick walls, small effusion.',
 'কী সন্দেহ?','Suspicion?',
 '<b>Acute myocarditis</b> (fulminant হতে পারে)। Inotrope, প্রয়োজনে mechanical support-এর জন্য দ্রুত cardiology; troponin, ECG, MRI। দ্রুত অবনতি হতে পারে, তাই বারবার echo।',
 '<b>Acute (possibly fulminant) myocarditis.</b> Inotropes, early cardiology and mechanical support planning; serial echo.'),
KC('mid','প্রসবের ৩ সপ্তাহ পর মা শ্বাসকষ্ট নিয়ে এসেছেন, শুয়ে থাকতে পারছেন না। LV বড়, খুব দুর্বল; দুই lung-এ B-line; আগে কোনো হৃদরোগ ছিল না।',
 'Three weeks postpartum with orthopnoea. Dilated severely impaired LV, bilateral B-lines, no prior heart disease.',
 'কী ভাবছেন?','Impression?',
 '<b>Peripartum cardiomyopathy।</b> Heart failure-এর চিকিৎসা (diuretic, প্রয়োজনে inotrope), LV thrombus খুঁজুন, cardiology; বুকের দুধ খাওয়ানো চলাকালীন ওষুধ বাছাইয়ে সাবধান।',
 '<b>Peripartum cardiomyopathy.</b> Heart failure therapy, look for LV thrombus, cardiology input; choose drugs compatible with breastfeeding.'),
KC('easy','Antibiotic ইনজেকশনের পরপরই চুলকানি, ঠোঁট ফোলা, BP ৬৫/৩০। LV ছোট, hyperdynamic; IVC খুব সরু, চুপসে যায়।',
 'Immediately after an antibiotic injection: urticaria, lip swelling, BP 65/30. Small hyperdynamic LV, tiny collapsing IVC.',
 'কারণ? চিকিৎসা?','Cause? Treatment?',
 '<b>Anaphylactic shock</b> — রক্তনালী প্রসারিত ও capillary leak, তাই হৃৎপিণ্ড ফাঁকা। <b>IM adrenaline</b> সবার আগে, সাথে দ্রুত বড় পরিমাণ fluid; প্রয়োজনে adrenaline infusion।',
 '<b>Anaphylaxis</b> — vasodilation and leak empty the heart. <b>IM adrenaline</b> first, rapid large-volume fluid.'),
KC('mid','Dengue জ্বরের পঞ্চম দিন, জ্বর কমেছে কিন্তু পেট ব্যথা, BP কম, hematocrit বাড়ছে। LV hyperdynamic, IVC সরু; দুই দিকে pleural effusion; পিত্তথলির দেয়াল মোটা; পেটে পানি।',
 'Dengue day 5, defervescence with abdominal pain, hypotension, rising haematocrit. Hyperdynamic LV, small IVC, bilateral pleural effusions, thickened gallbladder wall, ascites.',
 'কোন phase? Fluid দেবেন?','Which phase? Fluid?',
 '<b>Critical (plasma leakage) phase, dengue shock।</b> Plasma বাইরে বের হচ্ছে, তাই ভেতরে volume কম। Guideline অনুযায়ী <b>মেপে মেপে crystalloid</b>, hematocrit ও echo দিয়ে বারবার দেখুন; leakage থামলে fluid দ্রুত কমাতে হবে।',
 '<b>Critical leakage phase — dengue shock.</b> Titrated crystalloid per guidelines with serial haematocrit and echo; taper once leakage stops.'),
KC('hard','সেই dengue রোগী, এখন অষ্টম দিন। BP ভালো, urine বেশি, কিন্তু নতুন শ্বাসকষ্ট। দুই দিকে নতুন B-line, IVC মোটা ও স্থির; fluid এখনো ১৫০ mL/hr চলছে।',
 'The same dengue patient on day 8: good BP, high urine output, new dyspnoea. New bilateral B-lines, plethoric IVC; fluid still at 150 mL/h.',
 'কী ঘটছে? কী করবেন?','What is happening? Action?',
 '<b>Recovery (reabsorption) phase-এ fluid overload।</b> বের হওয়া plasma শরীরে ফিরে আসছে। <b>Fluid বন্ধ করুন</b>, প্রয়োজনে diuretic, oxygen। Dengue-তে মৃত্যুর একটা বড় কারণ এই পর্যায়ে অতিরিক্ত fluid।',
 '<b>Fluid overload in the reabsorption phase.</b> <b>Stop fluids</b>, consider diuretic. Excess fluid at this stage is a major cause of dengue deaths.'),
KC('mid','Propranolol অনেক বেশি খেয়ে আসা রোগী, নাড়ি ৪০, BP ৭০/৪০। LV মাঝারি থেকে খুব দুর্বল, VTI ৯ cm; IVC মোটা।',
 'Propranolol overdose: HR 40, BP 70/40. Moderately to severely reduced LV, VTI 9 cm, plethoric IVC.',
 'শকের ধরন? চিকিৎসা?','Shock type? Treatment?',
 '<b>Cardiogenic shock (beta-blocker toxicity)।</b> Fluid-এর লাভ কম। Atropine, glucagon, high-dose insulin (euglycaemic) থেরাপি, inotrope বা pacing; poison centre-এর পরামর্শ। VTI দিয়ে সাড়া মাপুন।',
 '<b>Cardiogenic shock from beta-blocker toxicity.</b> Atropine, glucagon, high-dose insulin, inotropes/pacing; monitor with VTI.'),
KC('easy','Junior বলছেন, "A4C-তে EF দারুণ, LV ছোট।" আপনি দেখলেন apex গোলাটে, ভোঁতা; LV-র দৈর্ঘ্য প্রস্থের প্রায় সমান।',
 'A junior says the A4C shows a small LV with great EF. The apex is round and blunt; LV length about equal to width.',
 'ভুল কোথায়?','What is wrong?',
 '<b>Foreshortening।</b> আসল apex ধরা হয়নি, তাই LV ছোট আর EF বেশি দেখাচ্ছে। Probe আরও পাশে ও নিচে সরিয়ে apex-এর ওপর বসান; সঠিক A4C-তে LV লম্বায় প্রস্থের প্রায় দ্বিগুণ।',
 '<b>Foreshortening</b> — move lateral and inferior to the true apex; a true LV is about twice as long as wide.'),
KC('easy','LV-র ভেতরে ধোঁয়ার মতো ঘূর্ণি আর ঝাপসা সাদা জিনিস। Junior বলছেন "LV thrombus"। পুরো স্ক্রিন একটু বেশি উজ্জ্বল।',
 'Smoky swirling haze inside the LV; a junior calls it thrombus. The whole screen looks too bright.',
 'আগে কী করবেন?','What first?',
 '<b>Gain কমান।</b> বেশি gain রক্তকে ধূসর ও ধোঁয়াটে দেখায়। Gain ঠিক করার পরও যা থাকে, অন্তত দুটি view-তে দেখুন; সত্যিকারের thrombus সন্দেহ হলে formal echo।',
 '<b>Reduce the gain</b>; excess gain fakes smoke and clot. Recheck in two views, formal echo if doubt persists.'),
KC('easy','Trainee subcostal-এ একটা নল মাপছেন, ব্যাস ২.২ cm, শ্বাসে প্রায় বদলায় না, কিন্তু প্রতিটি হৃৎস্পন্দনে লাফাচ্ছে; নলটা RA-তে ঢুকতে দেখা যাচ্ছে না।',
 'A trainee measures a 2.2 cm vessel in subcostal view that barely changes with breathing but pulsates with each beat and does not enter the RA.',

<script type="module">
/* ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, deleteDoc,
  collection, onSnapshot, writeBatch, getDocs, getDocsFromServer, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== ১) Firebase config (Firebase Console → Project settings → Your apps) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyB0deQ9HU2L4fieJpdRHWqD50gA5y7gDdE",
  authDomain: "pocus-usg.firebaseapp.com",
  projectId: "pocus-usg",
  storageBucket: "pocus-usg.firebasestorage.app",
  messagingSenderId: "686171277189",
  appId: "1:686171277189:web:c824643a8a42e030f626ec"
};

/* ===== ২) Admin ইমেইল — যত খুশি ডিভাইসে খোলা যাবে, কার্ড এডিট ও ইউজার অনুমোদন করা যাবে ===== */
const ADMIN_EMAIL = "mamun15717@gmail.com";

/* ------------------------------------------------------------
   এর নিচে কিছু বদলানোর দরকার নেই।
   ------------------------------------------------------------ */
let auth=null, db=null, ready=false, mySession=null, unsubs=[];
try{
  if(firebaseConfig.apiKey!=="PASTE_HERE"){
    const app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    setPersistence(auth,browserLocalPersistence).catch(()=>{});
    try{ db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
    catch(e){ db=initializeFirestore(app,{}); }
    ready=true;
  }
}catch(e){ ready=false; console.warn('Firebase init failed',e); }

const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const clean=o=>JSON.parse(JSON.stringify(o));

window.POCUS={
  ready:()=>ready,
  isAdminEmail:e=>(e||'').toLowerCase()===ADMIN_EMAIL.toLowerCase(),
  login:(e,p)=>signInWithEmailAndPassword(auth,e.trim(),p),
  logout:()=>{ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; return signOut(auth); },
  onAuth:cb=>onAuthStateChanged(auth,cb),
  register:async(name,email,pass)=>{
    const cred=await createUserWithEmailAndPassword(auth,email.trim(),pass);
    await setDoc(doc(db,'users',cred.user.uid),{name:name.trim(),email:cred.user.email,status:'pending',created:serverTimestamp()});
    return cred.user;
  },
  resetPassword:email=>sendPasswordResetEmail(auth,email.trim()),

  /* user approval: users/{uid} = {name,email,status:'pending'|'approved'|'blocked'} */
  ensureUserDoc:async user=>{
    const ref=doc(db,'users',user.uid);const s=await getDoc(ref);
    if(s.exists())return s.data();
    const d={name:'',email:user.email,status:'pending',created:serverTimestamp()};await setDoc(ref,d);return d;
  },
  watchMyUser:(uid,cb)=>{ unsubs.push(onSnapshot(doc(db,'users',uid),s=>cb(s.exists()?s.data():null),()=>{})); },
  watchUsers:cb=>{ unsubs.push(onSnapshot(collection(db,'users'),snap=>cb(snap.docs.map(d=>({...d.data(),uid:d.id}))),()=>{})); },
  setUserStatus:(uid,status)=>setDoc(doc(db,'users',uid),{status,changed:serverTimestamp()},{merge:true}),
  deleteUserDoc:uid=>deleteDoc(doc(db,'users',uid)),

  /* cards: one document per card */
  watchCards:(cb,onErr)=>{
    unsubs.push(onSnapshot(collection(db,'cards'),snap=>{
      cb(snap.docs.map(d=>{const {updated,...rest}=d.data();return {...rest,id:d.id};}));
    },err=>onErr&&onErr(err)));
  },
  serverCardCount:async()=>{ const s=await getDocsFromServer(collection(db,'cards')); return s.size; },
  putCard:c=>setDoc(doc(db,'cards',c.id),{...clean(c),updated:serverTimestamp()}),
  delCard:id=>deleteDoc(doc(db,'cards',id)),
  putCardsBatch:async(cards)=>{
    for(let i=0;i<cards.length;i+=200){
      const b=writeBatch(db);
      cards.slice(i,i+200).forEach(c=>b.set(doc(db,'cards',c.id),{...clean(c),updated:serverTimestamp()}));
      await b.commit();
    }
  },

  /* shared settings: category lists */
  watchMeta:cb=>{ unsubs.push(onSnapshot(doc(db,'meta','config'),s=>cb(s.exists()?s.data():null),()=>{})); },
  putMeta:m=>setDoc(doc(db,'meta','config'),clean(m),{merge:true}),

  /* images: one document per compressed image (keeps each doc under 1 MB) */
  putImage:(id,data)=>setDoc(doc(db,'images',id),{data,at:serverTimestamp()}),
  getImage:async id=>{ const s=await getDoc(doc(db,'images',id)); return s.exists()?s.data().data:null; },
  delImage:id=>deleteDoc(doc(db,'images',id)),
  listImageIds:async()=>{ const s=await getDocs(collection(db,'images')); return s.docs.map(d=>d.id); },

  /* old version (single document) — used once for migration */
  loadLegacy:async()=>{ try{ const s=await getDoc(doc(db,'appdata','state')); return s.exists()?s.data().state:null; }catch(e){ return null; } },

  /* single active session for non-admin users */
  claimSession:async uid=>{ mySession=rid(); await setDoc(doc(db,'sessions',uid),{active:mySession,at:serverTimestamp(),device:(navigator.userAgent||'').slice(0,120)},{merge:true}); },
  watchSession:(uid,onKicked)=>{
    unsubs.push(onSnapshot(doc(db,'sessions',uid),s=>{
      if(s.exists()&&s.data().active&&s.data().active!==mySession) onKicked();
    },()=>{}));
  }
};
window.dispatchEvent(new Event('pocus-ready'));
</script>
