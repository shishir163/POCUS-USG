{id:'echo-02',cat:'Basics',color:'#818cf8',emoji:'🎛️',seed:true,
titleBn:'Machine, probe ও চারটি নড়াচড়া',titleEn:'Machine, probe & the four movements',
bodyBn:`<p>ভালো ছবির অর্ধেক কাজ মেশিন ঠিকভাবে সেট করা আর probe সঠিকভাবে ধরা। এই অংশ হাতে বসে গেলে বাকি সব view অনেক সহজ হয়।</p>
<h3>ধাপ ১ — মেশিন প্রস্তুত করুন</h3>
<ul>
<li><b>Phased-array (cardiac) probe</b> বেছে নিন। মাথা ছোট বলে পাঁজরের ফাঁকে সহজে বসে।</li>
<li>Preset দিন <b>Cardiac</b>। Abdominal বা Lung preset-এ ছবির দিক আর রং আলাদা হয়।</li>
<li>শুরুর depth রাখুন ১৬–১৮ cm। হৃৎপিণ্ড খুঁজে পাওয়ার পর কমিয়ে দেবেন।</li>
<li>রোগীর ECG lead আর ড্রেসিং যতটা সম্ভব সরিয়ে নিন। Gel পর্যাপ্ত দিন।</li>
</ul>
<h3>ধাপ ২ — যে বোতামগুলো চোখ বন্ধ করে চাপতে পারতে হবে</h3>
<table class="mini">
<tr><td><b>Depth</b></td><td>কত গভীর পর্যন্ত দেখবেন। হৃৎপিণ্ড যেন স্ক্রিনের প্রায় তিন-চতুর্থাংশ জুড়ে থাকে। PLAX-এ descending aorta দেখা যায় এমন depth রাখুন।</td></tr>
<tr><td><b>Gain</b></td><td>ছবির উজ্জ্বলতা। রক্ত দেখতে কুচকুচে কালো হবে। Gain বেশি হলে সব ধূসর, তখন ভুল করে effusion বা জমাট রক্ত মনে হয়।</td></tr>
<tr><td><b>TGC</b></td><td>ওপর-নিচ আলাদা আলাদা উজ্জ্বলতা। সাধারণত মাঝখানে রাখুন।</td></tr>
<tr><td><b>Freeze / Cine</b></td><td>ছবি থামিয়ে শেষ কয়েকটি beat পেছনে চালিয়ে দেখা। মাপার আগে এটাই লাগে।</td></tr>
<tr><td><b>Save clip</b></td><td>২–৩ beat-এর ছোট ভিডিও সংরক্ষণ। স্থির ছবির চেয়ে clip বেশি কাজের।</td></tr>
<tr><td><b>M-mode</b></td><td>এক রেখার নড়াচড়া সময়ের সাথে। TAPSE, MAPSE, EPSS, IVC মাপতে লাগে।</td></tr>
<tr><td><b>Colour / PW Doppler</b></td><td>রক্তের প্রবাহ দেখা ও মাপা। Valve screening আর VTI-তে লাগে।</td></tr>
</table>
${SLOT('knob-panel','আপনার মেশিনের control panel — বোতামগুলো চিহ্নিত করে')}
<h3>ধাপ ৩ — probe marker চেনা (সবচেয়ে জরুরি অভ্যাস)</h3>
<p>প্রতিটি probe-এর এক পাশে একটা <b>marker</b> থাকে (খাঁজ, দাগ বা আলো)। স্ক্রিনের এক কোণে একটা চিহ্ন থাকে, marker-এর দিকের ছবি সেই পাশে আসে। Cardiac preset-এ সাধারণত চিহ্নটা থাকে <b>স্ক্রিনের ওপরে ডানে</b>।</p>
<div class="tip"><b>প্রতিবারের পরীক্ষা:</b> probe ধরার পর marker-এর পাশে আঙুল দিয়ে gel একটু নাড়ুন। স্ক্রিনের কোন পাশ নড়ল দেখে নিশ্চিত হন। দশ সেকেন্ডের এই পরীক্ষায় RV-কে LV ভাবার মতো বড় ভুল এড়ানো যায়।</div>
${SLOT('marker-test','Probe marker ও স্ক্রিনের চিহ্ন')}
<h3>ধাপ ৪ — চারটি নড়াচড়া</h3>
<p>আপনার পুরো দক্ষতা আসলে এই চারটি নড়াচড়ার মধ্যে।</p>
<table class="mini">
<tr><td><b>Slide</b></td><td>probe চামড়ার ওপর দিয়ে অন্য জায়গায় সরানো। জায়গা ভুল হলে এটা ঠিক করে, যেমন এক পাঁজর ওপরে বা নিচে।</td></tr>
<tr><td><b>Tilt / Fan</b></td><td>probe এক জায়গায় রেখে মাথা কাত করা, যেন beam হৃৎপিণ্ডের ভেতর দিয়ে ঝেড়ে যায়। PSAX-এর তিনটি level এভাবেই পাওয়া যায়।</td></tr>
<tr><td><b>Rotate</b></td><td>probe জায়গায় রেখে ঘড়ির কাঁটার মতো ঘোরানো। কাটার তল বদলায়, যেমন PLAX থেকে PSAX।</td></tr>
<tr><td><b>Rock (heel–toe)</b></td><td>probe একটু হেলিয়ে কাঠামোটা স্ক্রিনের মাঝখানে আনা।</td></tr>
</table>
<div class="box"><b>নিয়ম:</b> একবারে একটি নড়াচড়া করুন, তারপর স্ক্রিন দেখুন। একসাথে সব নাড়লে বুঝবেন না কোনটায় ছবি ভালো হলো।</div>
<h3>ধাপ ৫ — probe ধরার কৌশল</h3>
<ul>
<li>কলম ধরার মতো করে probe ধরুন, খুব শক্ত করে নয়।</li>
<li>হাতের কিনারা রোগীর বুকে ঠেকিয়ে রাখুন (<b>anchoring</b>)। এতে probe কাঁপে না, ছোট ছোট নড়াচড়া নিখুঁত হয়।</li>
<li>চাপ হালকা রাখুন। বেশি চাপে ছবি ভালো হয় না, রোগী কষ্ট পায়। শুধু subcostal-এ একটু বেশি চাপ লাগে।</li>
</ul>
${SLOT('probe-grip','Probe ধরার সঠিক ভঙ্গি (anchoring)')}
<h3>ধাপ ৬ — রোগীর অবস্থান</h3>
<ul>
<li>Parasternal ও apical view-এর জন্য রোগীকে <b>বাঁ কাত (left lateral decubitus)</b> করলে হৃৎপিণ্ড বুকের দেয়ালের কাছে আসে।</li>
<li>Subcostal-এর জন্য চিত করে, <b>হাঁটু ভাঁজ</b> করে দিন।</li>
<li>Ventilator-এর রোগীকে কাত করা কঠিন হলে সরাসরি subcostal দিয়ে শুরু করুন।</li>
</ul>
<div class="warn"><b>সাধারণ ভুল:</b> gain বেশি রাখা; marker না দেখে স্ক্যান; depth এত বেশি যে হৃৎপিণ্ড ছোট্ট দেখায়; একসাথে কয়েকটি নড়াচড়া।</div>
<h3>নিজেকে যাচাই</h3>
<ul><li>স্ক্রিনের দিকে না তাকিয়ে depth, gain, freeze, save চাপতে পারছি কি?</li><li>Marker কোন দিকে, আগে থেকে বলতে পারছি কি?</li><li>Slide, tilt, rotate, rock আলাদা করে করতে পারছি কি?</li></ul>`,
bodyEn:`<p>Half of a good image is setting up the machine and holding the probe correctly.</p>
<h3>Step 1 — Prepare the machine</h3>
<ul><li>Choose the <b>phased-array (cardiac) probe</b>; its small footprint fits between ribs.</li><li>Preset: <b>Cardiac</b>.</li><li>Start depth 16–18 cm, reduce once the heart is found.</li><li>Move ECG leads and dressings; use enough gel.</li></ul>
<h3>Step 2 — Controls to use without looking</h3>
<table class="mini">
<tr><td><b>Depth</b></td><td>Heart should fill about three quarters of the screen; in PLAX keep the descending aorta in view.</td></tr>
<tr><td><b>Gain</b></td><td>Blood should be black. Too much gain makes everything grey and mimics effusion or clot.</td></tr>
<tr><td><b>TGC</b></td><td>Near/far brightness; usually keep centred.</td></tr>
<tr><td><b>Freeze / Cine</b></td><td>Freeze and scroll back through the last beats.</td></tr>
<tr><td><b>Save clip</b></td><td>Save 2–3 beat loops; clips beat still images.</td></tr>
<tr><td><b>M-mode</b></td><td>Motion of one line over time: TAPSE, MAPSE, EPSS, IVC.</td></tr>
<tr><td><b>Colour / PW Doppler</b></td><td>Flow: valve screening and VTI.</td></tr>
</table>
${SLOT('knob-panel','Your machine control panel, buttons labelled')}
<h3>Step 3 — Know the probe marker</h3>
<p>Each probe has a <b>marker</b>; it corresponds to the orientation dot on screen. In cardiac preset the dot is usually <b>top right</b>.</p>
<div class="tip"><b>Every time:</b> rub the gel at the marker side and check which side of the screen moves.</div>
${SLOT('marker-test','Probe marker and screen dot')}
<h3>Step 4 — The four movements</h3>
<table class="mini">
<tr><td><b>Slide</b></td><td>Move to a new spot, e.g. one rib space up or down.</td></tr>
<tr><td><b>Tilt / Fan</b></td><td>Angle the beam through the heart without moving the spot; gives the PSAX levels.</td></tr>
<tr><td><b>Rotate</b></td><td>Turn in place; changes the plane, e.g. PLAX to PSAX.</td></tr>
<tr><td><b>Rock (heel–toe)</b></td><td>Lean the probe to centre the structure.</td></tr>
</table>
<div class="box"><b>Rule:</b> one movement at a time, then look.</div>
<h3>Step 5 — Holding the probe</h3>
<ul><li>Pencil grip, not too tight.</li><li>Rest the edge of your hand on the chest (<b>anchoring</b>) for fine control.</li><li>Light pressure, except subcostal.</li></ul>
${SLOT('probe-grip','Correct probe grip (anchoring)')}
<h3>Step 6 — Patient position</h3>
<ul><li>Parasternal and apical: <b>left lateral decubitus</b>.</li><li>Subcostal: supine, <b>knees bent</b>.</li><li>Ventilated and hard to turn: start subcostal.</li></ul>
<div class="warn"><b>Common errors:</b> high gain; ignoring the marker; excessive depth; several movements at once.</div>`},

{id:'echo-03',cat:'Views',color:'#3b82d4',emoji:'1️⃣',seed:true,
titleBn:'PLAX — Parasternal Long Axis',titleEn:'PLAX — Parasternal Long Axis',
bodyBn:`<p>PLAX আপনার মূল view। এটা ভালোভাবে শিখলে PSAX এখান থেকে শুধু ঘুরিয়েই পাওয়া যায়। ICU-তে LV function আর pericardial effusion দেখার প্রথম জায়গা এটাই।</p>
<h3>ধাপ ১ — রোগী ও জায়গা</h3>
<ul>
<li>রোগী চিত, সম্ভব হলে একটু বাঁ কাত।</li>
<li>Probe বসান <b>বুকের হাড়ের ঠিক বাঁ পাশে, ৩য় বা ৪র্থ intercostal space-এ</b>।</li>
<li>Probe marker থাকবে রোগীর <b>ডান কাঁধের দিকে</b>, ঘড়ির ১০–১১টার কোণে।</li>
</ul>
${SLOT('plax-probe','PLAX — বুকের ওপর probe-এর অবস্থান ও marker-এর দিক')}
<h3>ধাপ ২ — হৃৎপিণ্ড খুঁজে নিন</h3>
<ul>
<li>Depth ১৬–১৮ cm রেখে শুরু করুন।</li>
<li>কিছু না দেখলে এক পাঁজর ওপরে বা নিচে <b>slide</b> করুন। লিভার বা পাকস্থলী দেখলে আপনি বেশি নিচে আছেন।</li>
<li>ফুসফুসের বাতাস ছবি ঢেকে দিলে রোগীকে আরও বাঁ কাত করুন বা শ্বাস ছেড়ে ধরে রাখতে বলুন।</li>
</ul>
<h3>ধাপ ৩ — ছবিটা সোজা করুন (optimisation)</h3>
<ul>
<li>একটু <b>rotate</b> করে LV-কে লম্বা চুরুটের মতো করুন। মোটা ডিমের মতো দেখালে আপনি তেরছা কাটছেন।</li>
<li><b>Mitral valve আর aortic valve একই ছবিতে</b> খুলছে-বন্ধ হচ্ছে, এটাই সঠিক long axis-এর প্রমাণ।</li>
<li>Septum প্রায় আনুভূমিক থাকবে। হেলে থাকলে rock বা tilt করুন।</li>
<li>Descending aorta দেখা না যাওয়া পর্যন্ত depth কমাবেন না, কারণ effusion চেনার চাবি এটাই।</li>
</ul>
<h3>ধাপ ৪ — স্ক্রিনে কী দেখবেন</h3>
${SVG_PLAX}
<div class="figcap">PLAX-এর নকশা (schematic): ওপরে RV, মাঝে LV, ডানে aorta ও LA, পেছনে DA</div>
<table class="mini">
<tr><td>সবচেয়ে ওপরে</td><td>RV-র দেয়াল ও RV (RVOT)</td></tr>
<tr><td>তার নিচে</td><td>Interventricular septum (IVS)</td></tr>
<tr><td>মাঝখানে</td><td>LV cavity, ভেতরে mitral valve-এর পাতা</td></tr>
<tr><td>ডানে</td><td>Aortic root, aortic valve, তার নিচে LA</td></tr>
<tr><td>নিচে</td><td>LV posterior wall, তার পেছনে উজ্জ্বল pericardium</td></tr>
<tr><td>LA-র পেছনে</td><td>Descending aorta, গোল নলের মতো</td></tr>
</table>
<p>মনে রাখুন, PLAX-এ কখনো আসল apex দেখা যায় না। Apex থাকে স্ক্রিনের বাঁ দিকে, বাইরে।</p>
${SLOT('plax-normal','স্বাভাবিক PLAX (আপনার মেশিনের ছবি)')}
<h3>ধাপ ৫ — PLAX থেকে কী বোঝা যায়</h3>
<ul>
<li><b>LV function</b>: দেয়াল কতটা ভেতরে আসছে আর মোটা হচ্ছে।</li>
<li><b>EPSS</b>: mitral valve-এর সামনের পাতা septum-এর কত কাছে যায় (বিস্তারিত LV function কার্ডে)।</li>
<li><b>Pericardial effusion</b> ও <b>pleural effusion</b> আলাদা করা।</li>
<li>Aortic root চওড়া কি না (dissection-এর সন্দেহ), LA বড় কি না।</li>
<li>MV ও AoV-তে colour দিয়ে মোটা দাগের regurgitation।</li>
</ul>
<div class="box"><b>জীবন বাঁচানো কৌশল:</b> পানি descending aorta-র <b>সামনে</b> (aorta আর হৃৎপিণ্ডের মাঝে) থাকলে <b>pericardial effusion</b>। পানি aorta-র <b>পেছনে</b> থাকলে <b>pleural effusion</b>।</div>
${SLOT('plax-effusion','PLAX-এ pericardial বনাম pleural effusion')}
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>তেরছা, খাটো LV দেখে EF ভুল বোঝা।</li><li>Probe বেশি ভেতরের দিকে বসালে শুধু RVOT আসে।</li><li>Gain বেশি হলে LV-র ভেতর ধোঁয়াটে দেখায়, জমাট রক্ত মনে হয়।</li><li>সামনের epicardial fat pad-কে effusion ভাবা।</li></ul></div>
<h3>নিজেকে যাচাই</h3>
<ul><li>MV ও AoV একই ছবিতে দেখা যাচ্ছে কি?</li><li>Septum আর posterior wall দুটোই পরিষ্কার কি?</li><li>Descending aorta খুঁজে পেয়েছি কি?</li></ul>`,
bodyEn:`<p>PLAX is your anchor view; PSAX is just a rotation from here. First place to check LV function and pericardial effusion.</p>
<h3>Step 1 — Position</h3>
<ul><li>Supine, slightly left lateral if possible.</li><li>Probe <b>just left of the sternum, 3rd or 4th intercostal space</b>.</li><li>Marker toward the patient's <b>right shoulder</b> (10–11 o'clock).</li></ul>
${SLOT('plax-probe','PLAX — probe position and marker direction')}
<h3>Step 2 — Find the heart</h3>
<ul><li>Start at 16–18 cm depth.</li><li>Nothing seen: <b>slide</b> one space up or down. Liver/stomach means too low.</li><li>Lung in the way: more left lateral, or ask for breath out and hold.</li></ul>
<h3>Step 3 — Optimise</h3>
<ul><li><b>Rotate</b> slightly until the LV looks like a long cigar, not a fat oval.</li><li><b>MV and AoV moving in the same plane</b> confirms a true long axis.</li><li>Septum nearly horizontal.</li><li>Keep the descending aorta in view before reducing depth.</li></ul>
<h3>Step 4 — What you see</h3>
${SVG_PLAX}
<div class="figcap">PLAX schematic: RV on top, LV in the middle, aorta and LA on the right, DA behind</div>
<table class="mini">
<tr><td>Top</td><td>RV wall and RVOT</td></tr><tr><td>Below</td><td>Interventricular septum</td></tr><tr><td>Middle</td><td>LV cavity with MV leaflets</td></tr><tr><td>Right</td><td>Aortic root and valve, LA beneath</td></tr><tr><td>Bottom</td><td>LV posterior wall, bright pericardium</td></tr><tr><td>Behind LA</td><td>Descending aorta (circle)</td></tr>
</table>
<p>The true apex is never seen in PLAX; it is off-screen to the left.</p>
${SLOT('plax-normal','Normal PLAX (your own image)')}
<h3>Step 5 — What PLAX tells you</h3>
<ul><li><b>LV function</b>, <b>EPSS</b>.</li><li><b>Pericardial vs pleural effusion</b>.</li><li>Dilated aortic root, LA size.</li><li>Gross MR/AR with colour.</li></ul>
<div class="box"><b>Key trick:</b> fluid <b>anterior</b> to the descending aorta = <b>pericardial</b>; fluid <b>posterior</b> to it = <b>pleural</b>.</div>
${SLOT('plax-effusion','PLAX: pericardial vs pleural effusion')}
<div class="warn"><b>Pitfalls:</b> off-axis short LV misleads EF; too medial gives only RVOT; high gain mimics smoke/clot; anterior fat pad mistaken for effusion.</div>`},

{id:'echo-04',cat:'Views',color:'#22d3ee',emoji:'2️⃣',seed:true,
titleBn:'PSAX — Parasternal Short Axis',titleEn:'PSAX — Parasternal Short Axis',
bodyBn:`<p>PSAX-এ হৃৎপিণ্ডকে আড়াআড়ি কেটে গোল চাকতির মতো দেখা যায়। LV চারদিক থেকে কেমন চাপছে আর RV-র ওপর চাপ বেড়েছে কি না, সেটা বোঝার সেরা view।</p>
<h3>ধাপ ১ — PLAX থেকে ঘোরান</h3>
<ul>
<li>একটা ভালো PLAX ধরে রাখুন।</li>
<li>Probe একই জায়গায় রেখে <b>ঘড়ির কাঁটার দিকে প্রায় ৯০° rotate</b> করুন।</li>
<li>Marker এবার রোগীর <b>বাঁ কাঁধের দিকে</b> (ঘড়ির ২টার কাছাকাছি)।</li>
</ul>
<div class="tip"><b>মনে রাখার সূত্র:</b> PLAX-এ ডান কাঁধ, ঘোরালে PSAX-এ বাঁ কাঁধ। প্রথমে ডান, ঘোরালে বাঁ।</div>
${SLOT('psax-rotate','PLAX থেকে PSAX — probe ঘোরানো')}
<h3>ধাপ ২ — LV-কে গোল করুন</h3>
<ul>
<li>LV যেন নিখুঁত গোল হয়। ডিমের মতো লম্বাটে হলে probe তেরছা আছে; সামান্য rotate বা rock করুন।</li>
<li>তেরছা কাটায় মিথ্যা D-shape দেখা দেয়, তাই এই ধাপ বাদ দেবেন না।</li>
</ul>
<h3>ধাপ ৩ — তিনটি level (tilt করে ওপর-নিচ)</h3>
<table class="mini">
<tr><td><b>Aortic valve level</b></td><td>Probe-এর মাথা রোগীর ডান কাঁধের দিকে কাত। মাঝখানে তিন পাপড়ির "Mercedes" চিহ্ন। চারপাশে RA, TV, RVOT, pulmonary artery।</td></tr>
<tr><td><b>Mitral valve level</b></td><td>মাঝামাঝি। Mitral valve মাছের মুখের মতো খোলে-বন্ধ হয়।</td></tr>
<tr><td><b>Papillary muscle level</b></td><td>Probe-এর মাথা রোগীর কোমর বা apex-এর দিকে কাত। গোল ডোনাটের মতো LV, ভেতরে দুটি papillary muscle।</td></tr>
</table>
${SVG_PSAX}
<div class="figcap">Papillary level-এর নকশা: গোল LV, ওপরে বাঁয়ে অর্ধচন্দ্রের মতো RV</div>
${SLOT('psax-pap','স্বাভাবিক PSAX — papillary level')}
${SLOT('psax-av','PSAX — aortic valve level (Mercedes sign)')}
<h3>ধাপ ৪ — Papillary level কেন সবচেয়ে কাজের</h3>
<ul>
<li>LV-র সব দেয়াল একসাথে দেখা যায়, তাই <b>eyeball LV function</b> এখানে সবচেয়ে নির্ভরযোগ্য।</li>
<li>কোনো একটা অংশ মোটা হচ্ছে না বা নড়ছে না দেখলে <b>regional wall motion abnormality</b>-র সন্দেহ (ischaemia)।</li>
<li><b>Septum-এর আকার</b> থেকে RV-র অবস্থা বোঝা যায়।</li>
</ul>
<h3>ধাপ ৫ — D-shaped septum পড়া</h3>
<p>স্বাভাবিকভাবে LV সবসময় গোল থাকে, কারণ LV-র চাপ RV-র চেয়ে বেশি। RV-র চাপ বা volume বেড়ে গেলে septum LV-র দিকে চেপে চ্যাপ্টা হয়, LV ইংরেজি D অক্ষরের মতো দেখায়।</p>
${SVG_DSEPT('স্বাভাবিক — গোল LV','D-shape — RV overload')}
<table class="mini">
<tr><td><b>Systole-এ চ্যাপ্টা</b></td><td>RV <b>pressure overload</b> — যেমন PE, pulmonary hypertension, ARDS-এ acute cor pulmonale</td></tr>
<tr><td><b>Diastole-এ চ্যাপ্টা</b></td><td>RV <b>volume overload</b> — যেমন বড় ASD, severe TR</td></tr>
</table>
${SLOT('psax-dsept','D-shaped septum (আপনার রোগীর ছবি)')}
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>এক level দেখে থেমে যাওয়া; তিনটিই ঝেড়ে দেখুন।</li><li>তেরছা কাটায় মিথ্যা D-shape।</li><li>D-shape-কে EF কম ভাবা। এটা আসলে <b>ডান হৃৎপিণ্ডের</b> সমস্যার চিহ্ন।</li></ul></div>
<h3>নিজেকে যাচাই</h3>
<ul><li>Marker কোন কাঁধের দিকে, বলতে পারছি কি?</li><li>Papillary level-এ LV গোল পেয়েছি কি?</li><li>Aortic valve level-এ Mercedes চিহ্ন দেখেছি কি?</li></ul>`,
bodyEn:`<p>PSAX cuts the heart crosswise. Best view for circumferential LV function and RV pressure on the septum.</p>
<h3>Step 1 — Rotate from PLAX</h3>
<ul><li>Hold a good PLAX.</li><li>Keep the spot, <b>rotate about 90° clockwise</b>.</li><li>Marker now toward the <b>left shoulder</b> (about 2 o'clock).</li></ul>
<div class="tip"><b>Memory aid:</b> PLAX right shoulder, rotate, PSAX left shoulder.</div>
${SLOT('psax-rotate','From PLAX to PSAX — rotating the probe')}
<h3>Step 2 — Make the LV round</h3><p>An oval LV means an oblique cut; rotate or rock until round. Oblique cuts create a false D-shape.</p>
<h3>Step 3 — Three levels (tilt)</h3>
<table class="mini">
<tr><td><b>Aortic valve</b></td><td>Tilt toward the right shoulder. "Mercedes" sign; RA, TV, RVOT, PA around it.</td></tr>
<tr><td><b>Mitral valve</b></td><td>Middle. "Fish-mouth" MV.</td></tr>
<tr><td><b>Papillary muscle</b></td><td>Tilt toward the apex. Round LV with two papillary muscles.</td></tr>
</table>
${SVG_PSAX}
<div class="figcap">Papillary level schematic: round LV, crescent RV</div>
${SLOT('psax-pap','Normal PSAX — papillary level')}
${SLOT('psax-av','PSAX — aortic valve level (Mercedes sign)')}
<h3>Step 4 — Why papillary level matters</h3><ul><li>Most reliable <b>eyeball LV function</b>.</li><li>A segment not thickening suggests <b>regional wall motion abnormality</b>.</li><li>Septal shape shows RV status.</li></ul>
<h3>Step 5 — Reading the D-shaped septum</h3>
${SVG_DSEPT('Normal — round LV','D-shape — RV overload')}
<table class="mini"><tr><td><b>Flat in systole</b></td><td>RV <b>pressure overload</b> (PE, pulmonary hypertension, ARDS cor pulmonale)</td></tr><tr><td><b>Flat in diastole</b></td><td>RV <b>volume overload</b> (large ASD, severe TR)</td></tr></table>
${SLOT('psax-dsept','D-shaped septum (your patient)')}
<div class="warn"><b>Pitfalls:</b> stopping at one level; oblique cut faking a D-shape; reading D-shape as low EF — it is a <b>right heart</b> sign.</div>`},

{id:'echo-05',cat:'Views',color:'#e5799a',emoji:'3️⃣',seed:true,
titleBn:'A4C — Apical 4-Chamber',titleEn:'A4C — Apical 4-Chamber',
bodyBn:`<p>A4C ধরা সবচেয়ে কঠিন, কিন্তু একবার পেলে চারটি chamber একসাথে দেখা যায়। RV:LV তুলনা, TAPSE, MAPSE আর valve screening এখান থেকেই।</p>
<h3>ধাপ ১ — রোগীকে বাঁ কাত করুন</h3>
<p><b>Left lateral decubitus</b> এই view-এর অর্ধেক সাফল্য। বাঁ হাত মাথার নিচে দিলে পাঁজরের ফাঁক চওড়া হয়।</p>
<h3>ধাপ ২ — Apex খুঁজুন</h3>
<ul>
<li>হাত দিয়ে <b>apex beat</b> অনুভব করুন। সাধারণত বাঁ স্তনবৃন্তের নিচে ও একটু বাইরে।</li>
<li>সেখানে probe বসান, marker রোগীর <b>বাঁ দিকে (ঘড়ির ৩টা)</b>।</li>
<li>Probe প্রায় বুকের ওপর শুইয়ে beam তাক করুন <b>ওপরের দিকে, রোগীর ডান কাঁধ বা ডান scapula-র দিকে</b>।</li>
</ul>
${SLOT('a4c-probe','A4C — probe-এর অবস্থান, কোণ ও marker')}
<h3>ধাপ ৩ — স্ক্রিনে কী দেখবেন</h3>
${SVG_A4C}
<div class="figcap">A4C-এর নকশা: apex ওপরে, স্ক্রিনের ডানে LV, বাঁয়ে RV, নিচে দুটি atrium</div>
<ul>
<li>Apex থাকবে স্ক্রিনের একদম ওপরে মাঝখানে।</li>
<li>Septum ওপর থেকে সোজা নিচে নামবে।</li>
<li>স্ক্রিনের <b>ডানে LV ও mitral valve</b>, <b>বাঁয়ে RV ও tricuspid valve</b>, নিচে LA ও RA।</li>
</ul>
${SLOT('a4c-normal','স্বাভাবিক A4C (আপনার মেশিনের ছবি)')}
<h3>ধাপ ৪ — ছবি নিখুঁত করুন</h3>
<ul>
<li>চারটি chamber একসাথে না এলে সামান্য <b>rotate</b> করুন।</li>
<li>মাঝখানে aortic valve আর LVOT চলে এলে সেটা <b>apical 5-chamber</b>; probe-এর মাথা একটু নিচের দিকে কাত করলে আবার 4-chamber।</li>
<li>Septum হেলে থাকলে probe-কে আরও apex-এর ওপর slide করুন।</li>
</ul>
<h3>ধাপ ৫ — সবচেয়ে বড় ভুল: foreshortening</h3>
<p>Probe যদি আসল apex-এর ওপর না বসে, ওপর-নিচ কাটাটা খাটো হয়ে যায়। Apex গোলাটে, ভোঁতা দেখায়।</p>
<ul>
<li>ফলে LV ছোট মনে হয়, EF বেশি মনে হয়, RV:LV অনুপাত ভুল আসে।</li>
<li><b>ঠিক করার উপায়:</b> probe আরও <b>বাইরের দিকে (lateral) ও নিচে</b> slide করে আসল apex-এর ওপর বসান, তারপর beam সামান্য ওপরের দিকে তাক করুন।</li>
<li>চেনার উপায়: সঠিক A4C-তে LV লম্বাটে, চূড়া সরু, LV-র দৈর্ঘ্য প্রস্থের প্রায় দ্বিগুণ।</li>
</ul>
${SLOT('a4c-foreshort','Foreshortened বনাম সঠিক A4C')}
<h3>ধাপ ৬ — A4C থেকে কী বোঝা যায়</h3>
<table class="mini">
<tr><td><b>RV:LV</b></td><td>RV, LV-র দুই-তৃতীয়াংশের চেয়ে ছোট হওয়ার কথা। সমান বা বড় হলে অস্বাভাবিক।</td></tr>
<tr><td><b>TAPSE</b></td><td>Tricuspid annulus-এর নড়াচড়া, RV function।</td></tr>
<tr><td><b>MAPSE</b></td><td>Mitral annulus-এর নড়াচড়া, LV-র লম্বালম্বি function।</td></tr>
<tr><td><b>Valves</b></td><td>MR ও TR-এর colour screening।</td></tr>
<tr><td><b>Effusion</b></td><td>হৃৎপিণ্ডের পাশে বা RA-র চারপাশে পানি, RA collapse।</td></tr>
</table>
<div class="warn"><b>সাধারণ ভুল:</b> foreshortening; মোটা রোগী বা ventilator-এ apex না পেয়ে সময় নষ্ট করা (তখন subcostal-এ চলে যান); 5-chamber-কে 4-chamber ভেবে RV মাপা।</div>
<h3>নিজেকে যাচাই</h3>
<ul><li>Apex সরু ও ওপরে আছে কি?</li><li>চারটি chamber আর দুটি AV valve দেখা যাচ্ছে কি?</li><li>RV আর LV-র আকার এক নজরে তুলনা করতে পারছি কি?</li></ul>`,
bodyEn:`<p>Hardest view to get, richest once obtained: all four chambers, RV:LV, TAPSE, MAPSE and valve screening.</p>
<h3>Step 1 — Left lateral decubitus</h3><p>Half the success. Left arm under the head widens the rib spaces.</p>
<h3>Step 2 — Find the apex</h3>
<ul><li>Palpate the <b>apex beat</b>, usually below and lateral to the left nipple.</li><li>Marker to the patient's <b>left (3 o'clock)</b>.</li><li>Probe nearly flat, beam aimed <b>up toward the right shoulder/scapula</b>.</li></ul>
${SLOT('a4c-probe','A4C — probe position, angle and marker')}
<h3>Step 3 — What you see</h3>
${SVG_A4C}
<div class="figcap">A4C schematic: apex on top, LV on screen right, RV left, atria below</div>
${SLOT('a4c-normal','Normal A4C (your own image)')}
<h3>Step 4 — Optimise</h3><ul><li>Rotate slightly to open all four chambers.</li><li>If the aortic valve appears, you are in <b>apical 5-chamber</b>; tilt down.</li><li>Tilted septum: slide onto the true apex.</li></ul>
<h3>Step 5 — Foreshortening</h3>
<p>Probe not on the true apex shortens the cut; apex looks round and blunt. LV looks small, EF falsely high, RV:LV wrong. <b>Fix:</b> slide <b>lateral and inferior</b> onto the true apex and aim the beam slightly up. A true A4C LV is about twice as long as it is wide.</p>
${SLOT('a4c-foreshort','Foreshortened vs correct A4C')}
<h3>Step 6 — What A4C tells you</h3>
<table class="mini"><tr><td><b>RV:LV</b></td><td>RV smaller than two thirds of LV; equal or larger is abnormal.</td></tr><tr><td><b>TAPSE</b></td><td>RV function.</td></tr><tr><td><b>MAPSE</b></td><td>LV longitudinal function.</td></tr><tr><td><b>Valves</b></td><td>MR, TR with colour.</td></tr><tr><td><b>Effusion</b></td><td>Fluid around the heart, RA collapse.</td></tr></table>
<div class="warn"><b>Pitfalls:</b> foreshortening; wasting time in obese or ventilated patients (go subcostal); measuring RV in a 5-chamber view.</div>`},

/* ---------------------------------------------------- 06 */
{id:'echo-06',cat:'Views',color:'#2f9e78',emoji:'4️⃣',seed:true,
titleBn:'Subcostal 4-Chamber',titleEn:'Subcostal 4-Chamber',
bodyBn:`<p>ICU-র আসল ভরসা। Ventilator-এর রোগী, মোটা রোগী, বুকে ড্রেসিং বা চলমান CPR — যখন parasternal ও apical view আসে না, তখন পেটের দিক থেকে এই view প্রায়ই পাওয়া যায়।</p>
<h3>ধাপ ১ — রোগী প্রস্তুত</h3>
<ul>
<li>রোগী চিত, <b>হাঁটু ভাঁজ</b> করে দিন। পেট নরম হলে probe সহজে ঢোকে।</li>
<li>Depth বাড়িয়ে ২০–২৪ cm করুন, কারণ মাঝে লিভার থাকে।</li>
</ul>
<h3>ধাপ ২ — Probe বসান</h3>
<ul>
<li>Probe বসান <b>xiphisternum-এর ঠিক নিচে</b>, প্রায় পেটের ওপর শুইয়ে।</li>
<li>Marker রোগীর <b>বাঁ দিকে (ঘড়ির ৩টা)</b>।</li>
<li>Probe-কে ওপর থেকে আলতো করে চেপে ধরুন, beam তাক করুন <b>রোগীর বাঁ কাঁধের দিকে</b>।</li>
<li>রোগী পারলে লম্বা শ্বাস নিয়ে ধরে রাখতে বলুন; diaphragm নামলে হৃৎপিণ্ড probe-এর কাছে আসে।</li>
</ul>
${SLOT('sc4c-probe','Subcostal — probe-এর অবস্থান ও হাতের ভঙ্গি')}
<h3>ধাপ ৩ — স্ক্রিনে কী দেখবেন</h3>
${SVG_SC4C}
<div class="figcap">Subcostal 4C-এর নকশা: ওপরে লিভার জানালা, তার নিচে RV, আরও গভীরে LV</div>
<ul>
<li>সবচেয়ে ওপরে <b>লিভার</b>, এটাই আপনার "জানালা"।</li>
<li>লিভারের ঠিক নিচে উজ্জ্বল pericardium, তারপর <b>RV free wall</b>।</li>
<li>আরও গভীরে LV; পাশে RA ও LA।</li>
</ul>
${SLOT('sc4c-normal','স্বাভাবিক subcostal 4C (আপনার মেশিনের ছবি)')}
<h3>ধাপ ৪ — ছবি না এলে</h3>
<table class="mini">
<tr><td>পেটের gas</td><td>probe একটু বেশি চাপুন, বা রোগীর ডান দিকে সরে লিভারের বেশি অংশ জানালা হিসেবে নিন।</td></tr>
<tr><td>হৃৎপিণ্ড অনেক দূরে</td><td>depth বাড়ান, probe আরও শুইয়ে দিন।</td></tr>
<tr><td>ছবি তেরছা</td><td>সামান্য rotate করে চারটি chamber খুলুন।</td></tr>
<tr><td>পেটে ক্ষত বা ড্রেসিং</td><td>অন্য view চেষ্টা করুন।</td></tr>
</table>
<h3>ধাপ ৫ — এই view-এর কাজ</h3>
<ul>
<li><b>Pericardial effusion ও tamponade</b> দেখার সেরা প্রথম view।</li>
<li>RV-র আকার, LV-র মোটা দাগের function।</li>
<li><b>Cardiac arrest-এ</b> pulse check-এর ১০ সেকেন্ডে এটাই ব্যবহার করুন, কারণ CPR-এর হাত বুকের ওপর থাকে।</li>
<li>এখান থেকে ঘুরিয়েই IVC view পাওয়া যায়।</li>
</ul>
<div class="warn"><b>সাধারণ ভুল:</b> ascites বা pleural fluid-কে pericardial effusion ভাবা (লিভারের সাথে সম্পর্ক দেখুন); তেরছা ছবিতে RV বড় মনে হওয়া; CPR-এর সময় ১০ সেকেন্ডের বেশি নেওয়া।</div>
<h3>নিজেকে যাচাই</h3>
<ul><li>লিভারের জানালা দিয়ে চারটি chamber পেয়েছি কি?</li><li>Parasternal না এলে এই view দিয়ে কাজ চালাতে পারছি কি?</li></ul>`,
bodyEn:`<p>The ICU workhorse. When parasternal and apical windows fail (ventilated, obese, dressings, CPR) this view usually works.</p>
<h3>Step 1 — Prepare</h3><ul><li>Supine, <b>knees bent</b>.</li><li>Depth 20–24 cm (the liver is in between).</li></ul>
<h3>Step 2 — Place the probe</h3>
<ul><li><b>Just below the xiphisternum</b>, nearly flat on the abdomen.</li><li>Marker to the patient's <b>left (3 o'clock)</b>.</li><li>Press gently, aim toward the <b>left shoulder</b>.</li><li>Deep inspiration hold brings the heart closer.</li></ul>
${SLOT('sc4c-probe','Subcostal — probe position and hand')}
<h3>Step 3 — What you see</h3>
${SVG_SC4C}
<div class="figcap">Subcostal 4C schematic: liver window on top, RV beneath, LV deeper</div>
${SLOT('sc4c-normal','Normal subcostal 4C (your own image)')}
<h3>Step 4 — Troubleshooting</h3>
<table class="mini"><tr><td>Bowel gas</td><td>Press more, or move to the patient's right to use more liver.</td></tr><tr><td>Heart far away</td><td>Increase depth, flatten the probe.</td></tr><tr><td>Oblique</td><td>Rotate slightly.</td></tr></table>
<h3>Step 5 — Uses</h3><ul><li>Best first look for <b>effusion and tamponade</b>.</li><li>RV size, gross LV function.</li><li><b>Cardiac arrest</b> pulse checks (≤10 s).</li><li>Rotate from here to the IVC.</li></ul>
<div class="warn"><b>Pitfalls:</b> ascites or pleural fluid mistaken for pericardial effusion; oblique cut exaggerating RV; taking longer than 10 s in CPR.</div>`},

{id:'echo-07',cat:'Views',color:'#d08a3c',emoji:'5️⃣',seed:true,
titleBn:'IVC view — তোলা ও মাপা',titleEn:'IVC view — acquire & measure',
bodyBn:`<p>IVC দেখে ডান atrium-এর চাপ ও শরীরের পানির অবস্থার একটা ধারণা পাওয়া যায়। এই কার্ডে শুধু ঠিকভাবে তোলা ও মাপা; অর্থ বোঝানো আছে "IVC ও fluid" কার্ডে।</p>
<h3>ধাপ ১ — Subcostal থেকে শুরু</h3>
<ul>
<li>Subcostal 4C-তে RA স্ক্রিনে রাখুন।</li>
<li>Probe জায়গায় রেখে <b>rotate</b> করে marker নিন <b>রোগীর মাথার দিকে (ঘড়ির ১২টা)</b>।</li>
<li>Probe-এর মাথা সামান্য রোগীর ডান দিকে fan করুন, যতক্ষণ না একটা লম্বা কালো নল RA-তে ঢুকতে দেখেন।</li>
</ul>
${SLOT('ivc-probe','IVC — probe-এর অবস্থান (marker মাথার দিকে)')}
<h3>ধাপ ২ — নিশ্চিত হোন এটা IVC, aorta নয়</h3>
<table class="mini">
<tr><td></td><td><b>IVC</b> / <b>Aorta</b></td></tr>
<tr><td>কোথায় ঢোকে</td><td>IVC সরাসরি <b>RA-তে ঢোকে</b> / aorta RA-তে ঢোকে না</td></tr>
<tr><td>দেয়াল</td><td>IVC-র দেয়াল পাতলা / aorta-র দেয়াল মোটা, উজ্জ্বল</td></tr>
<tr><td>নড়াচড়া</td><td>IVC শ্বাসের সাথে আকার বদলায় / aorta হৃৎস্পন্দনের সাথে লাফায়</td></tr>
<tr><td>শাখা</td><td>IVC-তে <b>hepatic vein</b> এসে মেশে / aorta থেকে celiac, SMA বের হয়</td></tr>
<tr><td>অবস্থান</td><td>IVC রোগীর ডান দিকে, লিভারের ভেতরে / aorta মাঝ বরাবর বা একটু বাঁয়ে</td></tr>
</table>
<div class="box"><b>নিয়ম:</b> সবসময় নলটা <b>RA পর্যন্ত অনুসরণ করুন</b>। RA-তে ঢুকতে না দেখলে মাপবেন না।</div>
<h3>ধাপ ৩ — কোথায় মাপবেন</h3>
${SVG_IVC('এখানে মাপুন (RA থেকে ১–২ cm)')}
<div class="figcap">IVC-র নকশা; স্ক্রিনের দিক preset অনুযায়ী উল্টো হতে পারে</div>
<ul>
<li>RA-তে ঢোকার মুখ থেকে <b>১–২ cm দূরে</b>, অথবা hepatic vein মেশার ঠিক পরে।</li>
<li>নলের লম্বা অক্ষের সাথে <b>লম্বভাবে</b> মাপুন, তেরছা নয়।</li>
<li>সবচেয়ে চওড়া (শ্বাস ছাড়ার সময়) আর সবচেয়ে সরু (শ্বাস নেওয়ার সময়) দুটোই মাপুন।</li>
</ul>
<h3>ধাপ ৪ — M-mode দিয়ে মাপা</h3>
<ul>
<li>M-mode cursor ঠিক মাপার জায়গা দিয়ে, IVC-র সাথে আড়াআড়ি বসান।</li>
<li>কয়েকটি শ্বাসের রেখা দেখা যাবে; সর্বোচ্চ ও সর্বনিম্ন ব্যাস মাপুন।</li>
<li><b>Collapsibility</b> = (সর্বোচ্চ − সর্বনিম্ন) ÷ সর্বোচ্চ × ১০০%</li>
<li>রোগী নিজে শ্বাস নিলে একবার নাক দিয়ে জোরে টানতে বলুন (<b>sniff test</b>)।</li>
</ul>
${SLOT('ivc-mmode','IVC-র M-mode ছবি')}
<h3>ধাপ ৫ — Subcostal না এলে</h3>
<p>রোগীর ডান পাশে, mid-axillary line-এ লিভারের ভেতর দিয়ে (<b>trans-hepatic view</b>) probe রেখে marker মাথার দিকে দিন। লিভারের নিচে IVC লম্বালম্বি দেখা যায়।</p>
${SLOT('ivc-lateral','ডান পাশ থেকে trans-hepatic IVC')}
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>Aorta-কে IVC ভেবে মাপা।</li><li>তেরছা কাটায় নলের কিনারা মাপা, তাতে ব্যাস কম আসে (<b>cylinder effect</b>)।</li><li>শ্বাসের সাথে IVC সরে গিয়ে অন্য জায়গা মাপা।</li><li>Ventilator-এর রোগীতে spontaneous breathing-এর নিয়ম দিয়ে পড়া।</li></ul></div>
<h3>নিজেকে যাচাই</h3>
<ul><li>IVC-কে RA পর্যন্ত অনুসরণ করেছি কি?</li><li>RA থেকে ১–২ cm দূরে, লম্বভাবে মেপেছি কি?</li></ul>`,
bodyEn:`<p>This card covers getting and measuring the IVC; interpretation is in "IVC & fluid".</p>
<h3>Step 1 — From subcostal</h3><ul><li>Keep the RA on screen.</li><li><b>Rotate</b> the marker toward the <b>head (12 o'clock)</b>.</li><li>Fan slightly to the patient's right until a long black tube enters the RA.</li></ul>
${SLOT('ivc-probe','IVC — probe position (marker to head)')}
<h3>Step 2 — Confirm IVC, not aorta</h3>
<table class="mini"><tr><td>Entry</td><td>IVC <b>enters the RA</b>; aorta does not</td></tr><tr><td>Wall</td><td>IVC thin; aorta thick and bright</td></tr><tr><td>Motion</td><td>IVC varies with breathing; aorta pulsates</td></tr><tr><td>Branches</td><td><b>Hepatic veins</b> join the IVC; coeliac/SMA leave the aorta</td></tr></table>
<div class="box"><b>Rule:</b> always trace the vessel into the RA before measuring.</div>
<h3>Step 3 — Where to measure</h3>
${SVG_IVC('measure here (1–2 cm from RA)')}
<div class="figcap">IVC schematic; screen side depends on preset</div>
<ul><li><b>1–2 cm from the RA junction</b>, or just distal to the hepatic vein.</li><li><b>Perpendicular</b> to the long axis.</li><li>Maximum and minimum diameter.</li></ul>
<h3>Step 4 — M-mode</h3><ul><li>Cursor across the IVC at the measuring point.</li><li><b>Collapsibility</b> = (max − min) ÷ max × 100%.</li><li>Spontaneously breathing: <b>sniff test</b>.</li></ul>
${SLOT('ivc-mmode','IVC M-mode')}
<h3>Step 5 — If subcostal fails</h3><p>Right mid-axillary <b>trans-hepatic view</b>, marker to head.</p>
${SLOT('ivc-lateral','Trans-hepatic IVC from the right side')}
<div class="warn"><b>Pitfalls:</b> measuring the aorta; off-axis cut underestimating diameter (<b>cylinder effect</b>); IVC moving out of plane with breathing; applying spontaneous-breathing rules to ventilated patients.</div>`},

{id:'echo-08',cat:'Assessment',color:'#ef4444',emoji:'💧',seed:true,
titleBn:'Pericardial effusion ও tamponade',titleEn:'Pericardial effusion & tamponade',
bodyBn:`<p>POCUS Echo-র সবচেয়ে জীবন বাঁচানো দক্ষতা। মনে রাখুন, <b>tamponade একটা clinical diagnosis</b>; echo সেটাকে সমর্থন করে, একা নিশ্চিত করে না।</p>
<h3>ধাপ ১ — পানি খুঁজুন</h3>
<ul>
<li>প্রথমে <b>subcostal 4C</b>, তারপর <b>PLAX</b>; দরকারে A4C ও PSAX।</li>
<li>হৃৎপিণ্ডের চারপাশে <b>কুচকুচে কালো (anechoic) ফিতা</b> খুঁজুন।</li>
<li>অন্তত দুটি view-তে নিশ্চিত হোন।</li>
</ul>
${SLOT('eff-sc4c','Subcostal view-তে pericardial effusion')}
<h3>ধাপ ২ — Effusion বনাম অন্য কিছু</h3>
<table class="mini">
<tr><td><b>Pericardial effusion</b></td><td>সম্পূর্ণ কালো, হৃৎপিণ্ডের চারদিক ঘিরে (circumferential), diastole-এও থাকে। PLAX-এ descending aorta-র সামনে।</td></tr>
<tr><td><b>Epicardial fat pad</b></td><td>একটু ধূসর, দানাদার; শুধু সামনের দিকে; হৃৎপিণ্ডের দেয়ালের সাথে একসাথে নড়ে।</td></tr>
<tr><td><b>Pleural effusion</b></td><td>PLAX-এ descending aorta-র পেছনে; ভেতরে চুপসানো ফুসফুস।</td></tr>
<tr><td><b>Ascites</b></td><td>Subcostal-এ লিভারের চারপাশে, diaphragm-এর নিচে।</td></tr>
</table>
${SLOT('eff-plax','PLAX-এ effusion — descending aorta-র সামনে')}
<h3>ধাপ ৩ — কতটা পানি (diastole-এ মাপুন)</h3>
<table class="mini">
<tr><td>ছোট</td><td>১ cm-এর কম</td></tr>
<tr><td>মাঝারি</td><td>১–২ cm</td></tr>
<tr><td>বড়</td><td>২ cm-এর বেশি; হৃৎপিণ্ড পানির মধ্যে দুলতে পারে (swinging heart)</td></tr>
</table>
<div class="box"><b>পরিমাণের চেয়ে গতি বড়:</b> অল্প পানিও হঠাৎ জমলে tamponade হতে পারে (trauma, cardiac surgery-র পর, ventricular rupture)। আবার অনেক দিনের বড় effusion-এ রক্তচাপ ঠিক থাকতে পারে।</div>
<h3>ধাপ ৪ — Tamponade-এর চিহ্ন</h3>
<table class="mini">
<tr><td><b>RA systolic collapse</b></td><td>RA-র দেয়াল systole-এ ভেতরে ঢোকে। সবচেয়ে আগে দেখা দেয়, sensitive। A4C বা subcostal-এ দেখুন। Systole-র এক-তৃতীয়াংশের বেশি সময় ধরে থাকলে বেশি অর্থবহ।</td></tr>
<tr><td><b>RV diastolic collapse</b></td><td>RV free wall diastole-এ ভেতরে ঢোকে। বেশি specific। PLAX বা subcostal-এ দেখুন; M-mode দিয়ে নিশ্চিত করা যায়।</td></tr>
<tr><td><b>Plethoric IVC</b></td><td>IVC মোটা (২.১ cm-এর বেশি), শ্বাসে ৫০%-এর কম চুপসায়। খুব sensitive; IVC সরু থাকলে tamponade প্রায় অসম্ভব।</td></tr>
<tr><td><b>Swinging heart</b></td><td>বড় effusion-এ পুরো হৃৎপিণ্ড দোলে।</td></tr>
</table>
${SLOT('tamp-ra','RA systolic collapse')}
${SLOT('tamp-rv','RV diastolic collapse (M-mode সহ)')}
${SLOT('tamp-ivc','Plethoric IVC')}
<h3>ধাপ ৫ — রোগীর অবস্থার সাথে মেলান</h3>
<p>রক্তচাপ কম, নাড়ি দ্রুত, JVP উঁচু, pulsus paradoxus, শব্দ চাপা। এর সাথে ওপরের echo চিহ্ন মিললে tamponade ধরে নিয়ে কাজ শুরু করুন।</p>
<h3>ধাপ ৬ — কী করবেন</h3>
<ul>
<li>জরুরি <b>pericardiocentesis</b>; সম্ভব হলে echo-guided, যেখানে পানির পকেট সবচেয়ে গভীর আর হৃৎপিণ্ড থেকে নিরাপদ দূরত্বে।</li>
<li>অপেক্ষার সময় সাবধানে <b>fluid bolus</b> দিয়ে preload ধরে রাখুন।</li>
<li><b>Diuretic দেবেন না।</b> Tamponade-এ হৃৎপিণ্ড ভরার জন্য volume-এর ওপর নির্ভরশীল; diuretic দিলে BP আরও পড়বে।</li>
<li><b>Intubation ও positive pressure ventilation</b> venous return কমিয়ে হঠাৎ cardiac arrest ঘটাতে পারে; পারলে drainage-এর পরে intubate করুন, না পারলে খুব সাবধানে।</li>
<li>Cardiac surgery-র পর হলে সাথে সাথে cardiac surgeon-কে জানান।</li>
</ul>
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>Fat pad-কে effusion ভাবা।</li><li>একটি চিহ্ন দেখে tamponade বলা, বা রোগীর অবস্থা না দেখে।</li><li>Cardiac surgery-র পর <b>loculated effusion</b> শুধু পেছনে বা এক পাশে জমতে পারে; transthoracic ছবিতে না দেখা গেলেও tamponade বাদ দেবেন না, formal echo বা TOE করান।</li><li>Ventilator-এ IVC মোটা থাকা স্বাভাবিক হতে পারে, তাই IVC একা ভরসা নয়।</li></ul></div>
<h3>নিজেকে যাচাই</h3>
<ul><li>পানি চারদিক ঘিরে আছে, নাকি শুধু fat pad?</li><li>RA ও RV collapse দেখেছি কি? IVC কেমন?</li><li>BP, নাড়ি, JVP-এর সাথে মিলিয়েছি কি?</li></ul>`,
bodyEn:`<p>The most life-saving POCUS skill. <b>Tamponade is a clinical diagnosis</b>; echo supports it.</p>
<h3>Step 1 — Find the fluid</h3><ul><li><b>Subcostal 4C</b> first, then <b>PLAX</b>; A4C and PSAX as needed.</li><li>Black (anechoic) stripe around the heart, confirmed in two views.</li></ul>
${SLOT('eff-sc4c','Pericardial effusion in subcostal view')}
<h3>Step 2 — Effusion vs mimics</h3>
<table class="mini"><tr><td><b>Pericardial effusion</b></td><td>Black, circumferential, present in diastole; anterior to the descending aorta in PLAX.</td></tr><tr><td><b>Epicardial fat pad</b></td><td>Grey, granular, anterior only, moves with the wall.</td></tr><tr><td><b>Pleural effusion</b></td><td>Posterior to the descending aorta.</td></tr><tr><td><b>Ascites</b></td><td>Around the liver, below the diaphragm.</td></tr></table>
${SLOT('eff-plax','PLAX: effusion anterior to the descending aorta')}
<h3>Step 3 — Size (end-diastole)</h3><table class="mini"><tr><td>Small</td><td>&lt; 1 cm</td></tr><tr><td>Moderate</td><td>1–2 cm</td></tr><tr><td>Large</td><td>&gt; 2 cm, swinging heart</td></tr></table>
<div class="box"><b>Speed beats size:</b> a small rapid effusion can tamponade; a large chronic one may not.</div>
<h3>Step 4 — Tamponade signs</h3>
<table class="mini"><tr><td><b>RA systolic collapse</b></td><td>Earliest, sensitive; more meaningful if longer than one third of systole.</td></tr><tr><td><b>RV diastolic collapse</b></td><td>More specific; confirm with M-mode.</td></tr><tr><td><b>Plethoric IVC</b></td><td>&gt; 2.1 cm, &lt; 50% collapse; a small IVC makes tamponade very unlikely.</td></tr><tr><td><b>Swinging heart</b></td><td>Large effusion.</td></tr></table>
${SLOT('tamp-ra','RA systolic collapse')}
${SLOT('tamp-rv','RV diastolic collapse (with M-mode)')}
${SLOT('tamp-ivc','Plethoric IVC')}
<h3>Step 5 — Clinical picture</h3><p>Hypotension, tachycardia, raised JVP, pulsus paradoxus, muffled sounds.</p>
<h3>Step 6 — Action</h3>
<ul><li>Urgent <b>pericardiocentesis</b>, echo-guided at the deepest safe pocket.</li><li>Careful <b>fluid bolus</b> to support preload.</li><li><b>No diuretics.</b></li><li><b>Intubation and positive pressure</b> can precipitate arrest; drain first if possible.</li><li>Post cardiac surgery: call the surgeon.</li></ul>
<div class="warn"><b>Pitfalls:</b> fat pad as effusion; one sign alone; <b>loculated</b> post-surgical effusion missed on TTE (get formal echo/TOE); plethoric IVC can be normal on a ventilator.</div>`},

/* ---------------------------------------------------- 09 */
{id:'echo-09',cat:'Assessment',color:'#a855f7',emoji:'💪',seed:true,
titleBn:'LV systolic function',titleEn:'LV systolic function',
bodyBn:`<p>ICU-তে LV function-এর জন্য সংখ্যার চেয়ে মোটা দাগের গ্রেড বেশি নিরাপদ ও কাজের: hyperdynamic, স্বাভাবিক, মাঝারি কমে যাওয়া, নাকি খুব কমে যাওয়া। অভিজ্ঞ চোখের eyeball EF মাপা EF-এর কাছাকাছি আসে।</p>
<h3>ধাপ ১ — কোন view</h3>
<p>অন্তত দুটি view দেখুন: <b>PLAX, PSAX (papillary level), A4C</b>। একটা view দেখে LV function বলবেন না।</p>
<h3>ধাপ ২ — Eyeball: দুটি জিনিস দেখুন</h3>
<ul>
<li><b>Endocardial excursion</b> — দেয়ালের ভেতরের রেখা systole-এ কতটা ভেতরে আসে।</li>
<li><b>Wall thickening</b> — দেয়াল systole-এ কতটা মোটা হয়। শুধু নড়লেই হবে না, মোটা হতে হবে; মরা অংশ অন্যের টানে নড়তে পারে কিন্তু মোটা হয় না।</li>
</ul>
<table class="mini">
<tr><td><b>Hyperdynamic</b></td><td>Systole-এ দেয়াল প্রায় মিলে যায়, LV cavity প্রায় মুছে যায় ("kissing papillary muscles")। মোটামুটি EF ৭০%-এর বেশি।</td></tr>
<tr><td><b>স্বাভাবিক</b></td><td>জোরালো, সমান নড়াচড়া। EF ৫০–৭০%।</td></tr>
<tr><td><b>মাঝারি কমে যাওয়া</b></td><td>স্পষ্টভাবে ঢিলে। EF মোটামুটি ৩০–৫০%।</td></tr>
<tr><td><b>খুব কমে যাওয়া</b></td><td>প্রায় নড়ছে না, LV প্রায়ই বড়। EF ৩০%-এর কম।</td></tr>
</table>
${SLOT('lv-hyper','Hyperdynamic LV (PSAX)')}
${SLOT('lv-normal','স্বাভাবিক LV')}
${SLOT('lv-poor','খুব কমে যাওয়া LV function')}
<h3>ধাপ ৩ — EPSS (PLAX, M-mode)</h3>
<ul>
<li>PLAX-এ M-mode cursor mitral valve-এর সামনের পাতার ডগা দিয়ে বসান।</li>
<li>Diastole-এর শুরুতে পাতা septum-এর সবচেয়ে কাছে যে দূরত্বে আসে, সেটাই <b>EPSS</b>।</li>
<li><b>৭ mm বা কম</b> স্বাভাবিক। <b>৭ mm-এর বেশি</b> হলে EF কমার ইঙ্গিত; যত বেশি, তত খারাপ।</li>
<li>Mitral stenosis, severe AR বা asymmetric septal hypertrophy থাকলে EPSS ভরসাযোগ্য নয়।</li>
</ul>
${SLOT('lv-epss','EPSS — M-mode ছবি')}
<h3>ধাপ ৪ — MAPSE (A4C, M-mode)</h3>
<ul>
<li>A4C-তে M-mode cursor lateral mitral annulus দিয়ে বসান, যতটা সম্ভব নড়াচড়ার সাথে সমান্তরাল।</li>
<li>Systole-এ annulus কতটা apex-এর দিকে নামে, সেটা মাপুন।</li>
<li><b>১০ mm-এর বেশি</b> স্বাভাবিক; <b>৮ mm-এর কম</b> LV দুর্বলতার ইঙ্গিত।</li>
</ul>
${SLOT('lv-mapse','MAPSE — M-mode ছবি')}
<h3>ধাপ ৫ — Regional wall motion (শুধু ইঙ্গিত)</h3>
<p>PSAX-এর তিনটি level ঝেড়ে দেখুন কোনো অংশ মোটা হচ্ছে না বা নড়ছে না কি না। বুকে ব্যথার রোগীতে এটা ischaemia-র সন্দেহ জাগায়, কিন্তু নিশ্চিত করে না; ECG ও troponin আগে।</p>
<h3>ধাপ ৬ — ফলাফলের অর্থ</h3>
<table class="mini">
<tr><td>Hyperdynamic</td><td>Hypovolaemia, sepsis-এ কম afterload, রক্তক্ষরণ, অতিরিক্ত inotrope। সাধারণত IVC ও VTI দেখে fluid ভাবা হয়।</td></tr>
<tr><td>খুব কমে যাওয়া</td><td>Cardiogenic shock, septic cardiomyopathy, myocarditis, MI। Fluid-এ সাবধান; inotrope ভাবুন।</td></tr>
</table>
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>Foreshortened A4C দেখে EF বেশি ভাবা।</li><li>একটি view দেখে সিদ্ধান্ত।</li><li>খুব দ্রুত নাড়ি বা AF-এ eyeball কঠিন; কয়েকটি beat দেখুন।</li><li>Inotrope চলাকালীন LV ভালো দেখালে আসল অবস্থা লুকিয়ে থাকতে পারে।</li><li>রিপোর্টে নির্দিষ্ট EF সংখ্যা লেখা; শুধু গ্রেড লিখুন।</li></ul></div>
<h3>নিজেকে যাচাই</h3>
<ul><li>অন্তত দুটি view দেখে গ্রেড দিয়েছি কি?</li><li>EPSS বা MAPSE দিয়ে চোখের ধারণা মিলিয়েছি কি?</li></ul>`,
bodyEn:`<p>In the ICU a qualitative grade is safer than a number: hyperdynamic, normal, moderately reduced or severely reduced.</p>
<h3>Step 1 — Views</h3><p>At least two: <b>PLAX, PSAX papillary, A4C</b>.</p>
<h3>Step 2 — Eyeball</h3>
<ul><li><b>Endocardial excursion</b> — inward motion.</li><li><b>Wall thickening</b> — dead segments may move passively but do not thicken.</li></ul>
<table class="mini"><tr><td><b>Hyperdynamic</b></td><td>Cavity almost obliterated, "kissing papillary muscles". EF &gt; 70%.</td></tr><tr><td><b>Normal</b></td><td>Vigorous, symmetric. 50–70%.</td></tr><tr><td><b>Moderately reduced</b></td><td>Visibly sluggish. 30–50%.</td></tr><tr><td><b>Severely reduced</b></td><td>Barely moving, often dilated. &lt; 30%.</td></tr></table>
${SLOT('lv-hyper','Hyperdynamic LV (PSAX)')}
${SLOT('lv-normal','Normal LV')}
${SLOT('lv-poor','Severely reduced LV function')}
<h3>Step 3 — EPSS (PLAX, M-mode)</h3><ul><li>Cursor through the anterior MV leaflet tip.</li><li>Smallest leaflet–septum distance in early diastole.</li><li><b>≤ 7 mm</b> normal; <b>&gt; 7 mm</b> suggests reduced EF.</li><li>Unreliable in MS, severe AR, asymmetric septal hypertrophy.</li></ul>
${SLOT('lv-epss','EPSS — M-mode')}
<h3>Step 4 — MAPSE (A4C, M-mode)</h3><ul><li>Cursor through the lateral mitral annulus, aligned with motion.</li><li><b>&gt; 10 mm</b> normal; <b>&lt; 8 mm</b> impaired.</li></ul>
${SLOT('lv-mapse','MAPSE — M-mode')}
<h3>Step 5 — Regional wall motion</h3><p>Sweep all PSAX levels. A non-thickening segment raises suspicion of ischaemia only; ECG and troponin lead.</p>
<h3>Step 6 — Meaning</h3><table class="mini"><tr><td>Hyperdynamic</td><td>Hypovolaemia, low afterload in sepsis, bleeding, excess inotrope.</td></tr><tr><td>Severely reduced</td><td>Cardiogenic shock, septic cardiomyopathy, myocarditis, MI; cautious fluids, consider inotrope.</td></tr></table>
<div class="warn"><b>Pitfalls:</b> foreshortened A4C; single view; tachycardia/AF; inotropes masking dysfunction; writing a precise EF number.</div>`},

/* ---------------------------------------------------- 10 */
{id:'echo-10',cat:'Assessment',color:'#38bdf8',emoji:'🫁',seed:true,
titleBn:'RV — আকার ও function',titleEn:'RV — size & function',
bodyBn:`<p>ICU-তে shock বা hypoxia-র অনেক কারণ ডান হৃৎপিণ্ডে: PE, ARDS-এ acute cor pulmonale, RV infarct। RV বড় হলে fluid দেওয়ার আগে থামতে হয়।</p>
<h3>ধাপ ১ — RV:LV আকার (A4C)</h3>
<ul>
<li>সঠিক (foreshortened নয়) A4C-তে, diastole-এর শেষে, দুই ventricle-এর গোড়ার দিকের প্রস্থ তুলনা করুন।</li>
<li>স্বাভাবিক RV, LV-র <b>দুই-তৃতীয়াংশের চেয়ে ছোট</b> (অনুপাত ০.৬-এর কম)।</li>
<li>০.৬–১: মাঝারি বড়। <b>১ বা বেশি</b>: খুব বড়।</li>
<li>বড় RV-তে apex-টা প্রায়ই RV-র দখলে চলে যায় (স্বাভাবিকভাবে apex LV-র)।</li>
</ul>
${SLOT('rv-big','A4C — বড় RV (RV ≥ LV)')}
<h3>ধাপ ২ — Septum-এর আকার (PSAX)</h3>
<p>Papillary level-এ LV D-shaped হলে RV-তে চাপ বা volume বেশি। Systole-এ চ্যাপ্টা হলে pressure overload, diastole-এ হলে volume overload (বিস্তারিত PSAX কার্ডে)।</p>
<h3>ধাপ ৩ — TAPSE (A4C, M-mode)</h3>
<ul>
<li>A4C-তে M-mode cursor <b>lateral tricuspid annulus</b> দিয়ে বসান, RV-র লম্বা অক্ষের সাথে যতটা সম্ভব সমান্তরাল।</li>
<li>Systole-এ annulus কতটা apex-এর দিকে নামে, মাপুন।</li>
<li><b>১৭ mm বা বেশি</b> স্বাভাবিক। <b>১৭ mm-এর কম</b> RV dysfunction।</li>
<li>TAPSE শুধু RV-র লম্বালম্বি function দেখায়; RV-র আকারের সাথে মিলিয়ে পড়ুন।</li>
</ul>
${SLOT('rv-tapse','TAPSE — M-mode ছবি')}
<h3>ধাপ ৪ — হঠাৎ না পুরনো?</h3>
<table class="mini">
<tr><td><b>Acute</b> (যেমন বড় PE)</td><td>RV free wall পাতলা (৫ mm-এর কম), RV বড়; pulmonary pressure খুব বেশি উঠতে পারে না।</td></tr>
<tr><td><b>Chronic</b> (যেমন COPD, পুরনো pulmonary hypertension)</td><td>RV free wall মোটা (৫ mm-এর বেশি), RA খুব বড়।</td></tr>
</table>
<p>PE-তে কখনো RV free wall-এর মাঝখানটা নড়ে না কিন্তু apex নড়ে (<b>McConnell's sign</b>)। এটা ইঙ্গিত, নিশ্চিত প্রমাণ নয়।</p>
<h3>ধাপ ৫ — ICU-তে কারণগুলো</h3>
<table class="mini">
<tr><td>Pulmonary embolism</td><td>RV বড় + D-septum + lung-এ A-line + ছোট, অল্প-ভরা LV। নিশ্চিত করতে CTPA; অস্থির রোগীতে echo ও clinical ছবি মিলিয়ে thrombolysis ভাবা হয় (senior-এর সাথে)।</td></tr>
<tr><td>ARDS, high PEEP</td><td><b>Acute cor pulmonale</b>; high plateau pressure, hypoxia, hypercapnia RV-র ওপর চাপ বাড়ায়।</td></tr>
<tr><td>RV infarct</td><td>Inferior MI-এর সাথে; RV বড় ও দুর্বল, lung শুকনো।</td></tr>
<tr><td>Chronic lung disease</td><td>মোটা RV wall, বড় RA।</td></tr>
</table>
<h3>ধাপ ৬ — চিকিৎসায় এর অর্থ</h3>
<ul>
<li><b>বড় RV-তে fluid দেবেন না</b> বা খুব সাবধানে। RV আরও ফুললে septum LV-র দিকে ঠেলে দেয়, LV ভরে না, BP আরও পড়ে।</li>
<li>BP ধরে রাখুন <b>vasopressor</b> দিয়ে (noradrenaline)।</li>
<li>Ventilator-এ: plateau pressure ও PEEP কমানোর চেষ্টা, hypoxia ও hypercapnia ঠিক করা, ARDS-এ <b>prone position</b> ভাবা।</li>
<li>কারণের চিকিৎসা: PE হলে anticoagulation বা thrombolysis।</li>
</ul>
<div class="warn"><b>সাধারণ ভুল:</b> foreshortened বা তেরছা A4C-তে RV বড় মনে হওয়া; শুধু TAPSE দেখে সিদ্ধান্ত; বড় RV-তে "BP কম তাই fluid" দেওয়া।</div>`,
bodyEn:`<p>Many causes of ICU shock and hypoxia sit in the right heart: PE, ARDS cor pulmonale, RV infarct. A big RV means stop before giving fluid.</p>
<h3>Step 1 — RV:LV (A4C)</h3><ul><li>True A4C, end-diastole, basal widths.</li><li>Normal RV &lt; two thirds of LV (ratio &lt; 0.6); 0.6–1 moderate; <b>≥ 1</b> severe.</li><li>A dilated RV often takes over the apex.</li></ul>
${SLOT('rv-big','A4C — dilated RV (RV ≥ LV)')}
<h3>Step 2 — Septal shape (PSAX)</h3><p>D-shape: systolic flattening = pressure overload; diastolic = volume overload.</p>
<h3>Step 3 — TAPSE (A4C, M-mode)</h3><ul><li>Cursor through the <b>lateral tricuspid annulus</b>, aligned with RV long axis.</li><li><b>≥ 17 mm</b> normal; <b>&lt; 17 mm</b> RV dysfunction.</li><li>Longitudinal only; read with RV size.</li></ul>
${SLOT('rv-tapse','TAPSE — M-mode')}
<h3>Step 4 — Acute or chronic?</h3><table class="mini"><tr><td><b>Acute</b> (massive PE)</td><td>Thin RV free wall (&lt; 5 mm), dilated RV.</td></tr><tr><td><b>Chronic</b></td><td>Thick free wall (&gt; 5 mm), large RA.</td></tr></table><p><b>McConnell's sign</b> (mid free wall akinesis, apex spared) suggests PE but is not proof.</p>
<h3>Step 5 — ICU causes</h3><table class="mini"><tr><td>PE</td><td>Big RV, D-septum, A-line lungs, small underfilled LV. CTPA confirms; if unstable consider thrombolysis with a senior.</td></tr><tr><td>ARDS / high PEEP</td><td><b>Acute cor pulmonale</b>.</td></tr><tr><td>RV infarct</td><td>With inferior MI; big weak RV, dry lungs.</td></tr><tr><td>Chronic lung disease</td><td>Thick RV wall, big RA.</td></tr></table>
<h3>Step 6 — Management meaning</h3><ul><li><b>Avoid or limit fluid</b> in a dilated RV.</li><li>Support BP with <b>vasopressor</b>.</li><li>Ventilator: lower plateau pressure and PEEP, fix hypoxia/hypercapnia, consider <b>prone</b>.</li><li>Treat the cause.</li></ul>
<div class="warn"><b>Pitfalls:</b> foreshortened/oblique A4C exaggerating RV; TAPSE alone; "low BP so give fluid" with a big RV.</div>`},

/* ---------------------------------------------------- 11 */
{id:'echo-11',cat:'Assessment',color:'#14b8a6',emoji:'💦',seed:true,
titleBn:'IVC ও fluid — কখন দেবেন',titleEn:'IVC & fluid decisions',
bodyBn:`<p>শুরুতেই মনে রাখুন: <b>IVC দেখে শিরার চাপের ধারণা পাওয়া যায়; IVC একা বলে না যে রোগীকে fluid দিতে হবে।</b></p>
<h3>ধাপ ১ — তিনটি আলাদা প্রশ্ন</h3>
<table class="mini">
<tr><td><b>Fluid দরকার?</b></td><td>রোগীর perfusion কম কি না (lactate, urine, capillary refill)। এটা clinical প্রশ্ন।</td></tr>
<tr><td><b>Fluid-এ সাড়া দেবে?</b> (fluid responsive)</td><td>Fluid দিলে stroke volume বাড়বে কি না। সবচেয়ে ভালো উত্তর: PLR + LVOT VTI।</td></tr>
<tr><td><b>Fluid সহ্য করবে?</b> (fluid tolerant)</td><td>Fluid দিলে ক্ষতি হবে কি না: lung-এ B-line, মোটা IVC, বড় RV।</td></tr>
</table>
<h3>ধাপ ২ — নিজে শ্বাস নেওয়া রোগীর IVC পড়া</h3>
<table class="mini">
<tr><td>২.১ cm-এর কম, ৫০%-এর বেশি চুপসায়</td><td>RA চাপ কম (প্রায় ৩ mmHg)</td></tr>
<tr><td>২.১ cm-এর কম, ৫০%-এর কম চুপসায়</td><td>মাঝামাঝি (প্রায় ৮ mmHg)</td></tr>
<tr><td>২.১ cm-এর বেশি, ৫০%-এর বেশি চুপসায়</td><td>মাঝামাঝি (প্রায় ৮ mmHg)</td></tr>
<tr><td>২.১ cm-এর বেশি, ৫০%-এর কম চুপসায়</td><td>RA চাপ বেশি (প্রায় ১৫ mmHg)</td></tr>
<tr><td>খুব সরু, পুরো চুপসে যায়</td><td>পানি কম হতে পারে; fluid সহ্য করার সম্ভাবনা বেশি</td></tr>
<tr><td>মোটা, প্রায় নড়ে না (plethoric)</td><td>Fluid দেওয়ার আগে থামুন; কারণ খুঁজুন: tamponade, RV failure, PE, fluid overload</td></tr>
</table>
${SLOT('ivc-small','সরু, চুপসে যাওয়া IVC')}
${SLOT('ivc-plethoric','মোটা, স্থির IVC (plethora)')}
<h3>ধাপ ৩ — Ventilator-এর রোগী (সবচেয়ে বড় সীমাবদ্ধতা)</h3>
<ul>
<li>Positive pressure-এ শ্বাসের নিয়ম উল্টে যায়: শ্বাস ঢোকানোর সময় IVC <b>ফোলে</b>।</li>
<li>PEEP আর positive pressure-এর কারণে IVC মোটা ও স্থির দেখাতে পারে, অথচ রোগী fluid-এ সাড়া দেয়।</li>
<li><b>Distensibility index</b> (১৮%-এর বেশি হলে fluid responsive হতে পারে) শুধু তখনই ভরসাযোগ্য যখন রোগী পুরোপুরি passive, tidal volume ৮ mL/kg বা বেশি, sinus rhythm। ICU-তে এমন খুব কমই পাওয়া যায়।</li>
<li>তাই ventilator-এ IVC-র চেয়ে <b>PLR + VTI</b> অনেক বেশি নির্ভরযোগ্য।</li>
</ul>
<h3>ধাপ ৪ — IVC-কে ভুল পথে নেয় যা</h3>
<p>পেটের ভেতরে চাপ বেশি (intra-abdominal hypertension), high PEEP, RV failure, severe TR, tamponade, জোরে শ্বাসের চেষ্টা।</p>
<h3>ধাপ ৫ — সবচেয়ে ভালো পরীক্ষা: PLR + VTI</h3>
<ol>
<li>রোগী ৪৫° আধশোয়া অবস্থায় <b>LVOT VTI</b> মাপুন।</li>
<li>বিছানা ঘুরিয়ে মাথা সমান করে পা ৪৫° ওপরে তুলুন (<b>passive leg raise</b>)। প্রায় ৩০০ mL রক্ত বুকে ফেরে।</li>
<li>৬০–৯০ সেকেন্ডের মধ্যে আবার VTI মাপুন।</li>
<li>VTI <b>১০–১২% বা বেশি বাড়লে</b> fluid responsive।</li>
</ol>
<p>বিস্তারিত পদ্ধতি "LVOT VTI" কার্ডে।</p>
<h3>ধাপ ৬ — পুরো ছবি মিলিয়ে সিদ্ধান্ত</h3>
<table class="mini">
<tr><td>LV hyperdynamic + IVC সরু + lung-এ A-line</td><td>Fluid যুক্তিসঙ্গত; অল্প অল্প দিন, প্রতিবার পরে lung ও VTI দেখুন</td></tr>
<tr><td>IVC সরু কিন্তু lung-এ অনেক B-line</td><td>সাবধান; fluid দিলে lung আরও ভিজবে; VTI দেখে সিদ্ধান্ত</td></tr>
<tr><td>IVC মোটা + RV বড়</td><td>Fluid নয়; PE বা RV failure ভাবুন, vasopressor</td></tr>
<tr><td>Fluid দিতে দিতে নতুন B-line</td><td>থামুন; রোগী আর fluid সহ্য করছে না</td></tr>
</table>
<div class="tip"><b>মনে রাখার বাক্য:</b> Lung বলে "সহ্য করবে কি?", echo বলে "দরকার ও লাভ হবে কি?"</div>
<div class="warn"><b>সাধারণ ভুল:</b> IVC চুপসে যাওয়াকে "fluid দাও" ধরে নেওয়া; ventilator-এ মোটা IVC দেখে fluid বন্ধ রাখা; aorta মাপা; একবার দেখে আর না দেখা।</div>`,
bodyEn:`<p><b>The IVC estimates venous pressure; it does not by itself say the patient needs fluid.</b></p>
<h3>Step 1 — Three separate questions</h3><table class="mini"><tr><td><b>Need fluid?</b></td><td>Hypoperfusion — clinical.</td></tr><tr><td><b>Fluid responsive?</b></td><td>Will stroke volume rise — best answered by PLR + LVOT VTI.</td></tr><tr><td><b>Fluid tolerant?</b></td><td>Harm signs: B-lines, plethoric IVC, big RV.</td></tr></table>
<h3>Step 2 — Spontaneously breathing</h3>
<table class="mini"><tr><td>&lt; 2.1 cm, &gt; 50% collapse</td><td>Low RAP (~3)</td></tr><tr><td>&lt; 2.1 cm, &lt; 50%</td><td>Intermediate (~8)</td></tr><tr><td>&gt; 2.1 cm, &gt; 50%</td><td>Intermediate (~8)</td></tr><tr><td>&gt; 2.1 cm, &lt; 50%</td><td>High RAP (~15)</td></tr><tr><td>Tiny, fully collapsing</td><td>Possible hypovolaemia; likely fluid tolerant</td></tr><tr><td>Plethoric, fixed</td><td>Stop and find the cause: tamponade, RV failure, PE, overload</td></tr></table>
${SLOT('ivc-small','Small collapsing IVC')}
${SLOT('ivc-plethoric','Plethoric fixed IVC')}
<h3>Step 3 — Ventilated patients</h3><ul><li>Pattern reverses: IVC distends on inspiration.</li><li>PEEP can make the IVC fat and fixed even in fluid responders.</li><li><b>Distensibility index</b> &gt; 18% only valid if fully passive, Vt ≥ 8 mL/kg, sinus rhythm.</li><li>Prefer <b>PLR + VTI</b>.</li></ul>
<h3>Step 4 — Confounders</h3><p>Intra-abdominal hypertension, high PEEP, RV failure, severe TR, tamponade, vigorous breathing effort.</p>
<h3>Step 5 — Best test: PLR + VTI</h3><ol><li>Measure <b>LVOT VTI</b> semi-recumbent at 45°.</li><li>Lower the trunk and raise the legs 45° (<b>passive leg raise</b>).</li><li>Re-measure at 60–90 s.</li><li>Rise <b>≥ 10–12%</b> = fluid responsive.</li></ol>
<h3>Step 6 — Combine</h3><table class="mini"><tr><td>Hyperdynamic LV + small IVC + A-lines</td><td>Fluid reasonable; small boluses, reassess</td></tr><tr><td>Small IVC but many B-lines</td><td>Caution; decide on VTI</td></tr><tr><td>Plethoric IVC + big RV</td><td>No fluid; think PE/RV failure, vasopressor</td></tr><tr><td>New B-lines during fluids</td><td>Stop</td></tr></table>
<div class="tip">Lung asks "will it tolerate?", echo asks "is it needed and will it help?"</div>
<div class="warn"><b>Pitfalls:</b> collapsing IVC = "give fluid"; withholding fluid for a fat IVC on a ventilator; measuring the aorta; single measurement only.</div>`},

{id:'echo-12',cat:'Assessment',color:'#f59e0b',emoji:'🚪',seed:true,
titleBn:'Valve screening — colour Doppler',titleEn:'Valve screening — colour Doppler',
bodyBn:`<p>এখানে আপনার কাজ শুধু <b>ধরা</b>: কোথাও স্পষ্ট বড় গোলমাল আছে কি না। কতটা গুরুতর তা মাপা formal echo-র কাজ।</p>
<h3>ধাপ ১ — Colour Doppler-এর মূল কথা</h3>
<ul>
<li>Colour চালু করলে একটা বাক্স আসে; বাক্সটা ছোট করে valve-এর ওপর বসান। বাক্স ছোট হলে ছবি দ্রুত চলে।</li>
<li><b>লাল</b>: রক্ত probe-এর দিকে আসছে। <b>নীল</b>: probe থেকে দূরে যাচ্ছে।</li>
<li><b>নানা রঙের মিশ্রণ (mosaic)</b>: রক্ত ঘূর্ণি তুলছে, অর্থাৎ জোরে বা সরু পথে যাচ্ছে।</li>
<li>Colour scale (Nyquist) মোটামুটি ৫০–৭০ cm/s রাখুন; খুব কম রাখলে স্বাভাবিক প্রবাহও বড় jet দেখায়।</li>
</ul>
${SLOT('valve-colour','Colour box ঠিকভাবে বসানো')}
<h3>ধাপ ২ — Regurgitation (উল্টো দিকে রক্ত ফেরা)</h3>
<p>নিয়ম একটাই: valve যখন বন্ধ থাকার কথা, তখন তার পেছনের chamber-এ রঙের ঝাপটা দেখলে valve ঠিকমতো আটকাচ্ছে না।</p>
<table class="mini">
<tr><td><b>MR</b></td><td>PLAX বা A4C; <b>systole</b>-এ <b>LA</b>-তে jet</td></tr>
<tr><td><b>AR</b></td><td>PLAX বা apical 5-chamber; <b>diastole</b>-এ <b>LVOT</b>-এ jet</td></tr>
<tr><td><b>TR</b></td><td>A4C বা PSAX; <b>systole</b>-এ <b>RA</b>-তে jet</td></tr>
</table>
${SLOT('valve-mr','MR — A4C-তে colour jet')}
${SLOT('valve-ar','AR — PLAX-এ colour jet')}
<h3>ধাপ ৩ — Stenosis (valve সরু হওয়া) — 2D ছবিই বেশি বলে</h3>
<table class="mini">
<tr><td><b>Aortic stenosis</b></td><td>পাতা মোটা, চুনজমা (উজ্জ্বল), ঠিকমতো খোলে না; LV-র দেয়াল মোটা। Colour-এ mosaic।</td></tr>
<tr><td><b>Mitral stenosis</b></td><td>PLAX-এ সামনের পাতা হকি-স্টিকের মতো বাঁকা, খোলা সীমিত; PSAX-এ মাছের মুখের ফাঁক ছোট; LA বড়।</td></tr>
</table>
${SLOT('valve-as','Aortic stenosis — মোটা, চুনজমা valve')}
<h3>ধাপ ৪ — কখন জরুরি</h3>
<ul>
<li><b>হঠাৎ গুরুতর MR</b>: MI-এর পর papillary muscle ছিঁড়ে যাওয়া। হঠাৎ pulmonary oedema, shock; LV জোরালো দেখাতে পারে।</li>
<li><b>হঠাৎ গুরুতর AR</b>: aortic dissection বা endocarditis। Aortic root চওড়া বা ভেতরে পর্দা দেখলে dissection ভাবুন।</li>
<li><b>Severe AS ও shock</b>: fluid ও vasodilator-এ খুব সাবধান; BP হঠাৎ পড়তে পারে।</li>
<li>Valve-এ দোলায়মান কিছু (vegetation) দেখলে endocarditis; জরুরি formal echo/TOE।</li>
</ul>
<div class="box">এগুলো পেলে দেরি না করে <b>formal echo করান এবং cardiologist-কে জানান।</b></div>
<h3>ধাপ ৫ — রিপোর্টে কী লিখবেন</h3>
<p>শুধু "আছে / নেই" আর রক্ত কোন দিকে ফিরছে। যেমন: "PLAX-এ diastolic AR jet দেখা গেছে; মাত্রা নির্ণয়ের জন্য formal echo প্রয়োজন।"</p>
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>Jet-এর আকার দেখে মাত্রা বলা। Gain, Nyquist আর কোণ বদলালে jet ছোট-বড় দেখায়।</li><li>Valve বন্ধের সময় স্বাভাবিক সামান্য উল্টো প্রবাহকে রোগ ভাবা।</li><li>POCUS-এ valve-এর গ্রেড লেখা।</li><li>বড় LA, বড় LV বা মোটা দেয়াল দেখেও পুরনো valve রোগের কথা না ভাবা।</li></ul></div>`,
bodyEn:`<p>Your job is to <b>flag</b> a gross valve problem, not to grade it.</p>
<h3>Step 1 — Colour basics</h3><ul><li>Small colour box over the valve.</li><li><b>Red</b> toward probe, <b>blue</b> away.</li><li><b>Mosaic</b> = turbulent flow.</li><li>Nyquist about 50–70 cm/s; too low exaggerates jets.</li></ul>
${SLOT('valve-colour','Placing the colour box')}
<h3>Step 2 — Regurgitation</h3><table class="mini"><tr><td><b>MR</b></td><td>PLAX/A4C; <b>systolic</b> jet into the <b>LA</b></td></tr><tr><td><b>AR</b></td><td>PLAX/apical 5-chamber; <b>diastolic</b> jet into the <b>LVOT</b></td></tr><tr><td><b>TR</b></td><td>A4C/PSAX; <b>systolic</b> jet into the <b>RA</b></td></tr></table>
${SLOT('valve-mr','MR — A4C colour jet')}
${SLOT('valve-ar','AR — PLAX colour jet')}
<h3>Step 3 — Stenosis (2D first)</h3><table class="mini"><tr><td><b>AS</b></td><td>Thick, calcified, restricted leaflets; LVH; mosaic flow.</td></tr><tr><td><b>MS</b></td><td>Hockey-stick anterior leaflet; small fish-mouth in PSAX; big LA.</td></tr></table>
${SLOT('valve-as','Aortic stenosis — thick calcified valve')}
<h3>Step 4 — Urgent situations</h3><ul><li><b>Acute severe MR</b> after MI (papillary rupture): sudden oedema and shock.</li><li><b>Acute severe AR</b>: dissection or endocarditis; dilated root or flap.</li><li><b>Severe AS with shock</b>: very careful with fluid and vasodilators.</li><li>Oscillating mass: endocarditis — urgent formal echo/TOE.</li></ul>
<div class="box">Get a <b>formal echo and call cardiology</b>.</div>
<h3>Step 5 — Reporting</h3><p>Present/absent and direction only; no grade.</p>
<div class="warn"><b>Pitfalls:</b> grading by jet size; calling physiological closing flow disease; writing grades; ignoring big LA/LV or LVH as clues to chronic valve disease.</div>`},

/* ---------------------------------------------------- 13 */
{id:'echo-13',cat:'Advanced',color:'#6366f1',emoji:'📈',seed:true,
titleBn:'LVOT VTI ও cardiac output',titleEn:'LVOT VTI & cardiac output',
bodyBn:`<p>পাঁচটি view হাতে বসার পর এটা শিখুন। VTI হলো ICU echo-র একমাত্র মাপ যা fluid আর inotrope-এর সিদ্ধান্তে সরাসরি কাজে লাগে।</p>
<h3>VTI কী</h3>
<p>প্রতি হৃৎস্পন্দনে LVOT দিয়ে রক্তের একটা কলাম কত দূর এগোয়, তার মাপ (cm)। VTI বাড়লে stroke volume বাড়ে। একই রোগীতে আগে-পরে তুলনা করতে এটা অসাধারণ।</p>
<h3>ধাপ ১ — Apical 5-chamber নিন</h3>
<ul>
<li>A4C থেকে probe-এর মাথা সামান্য ওপরের দিকে (anterior) কাত করুন।</li>
<li>মাঝখানে aortic valve ও LVOT চলে আসবে।</li>
<li>LVOT আর beam যতটা সম্ভব <b>একই রেখায়</b> রাখুন; কোণ ২০°-এর বেশি হলে VTI কম আসে।</li>
</ul>
${SLOT('vti-a5c','Apical 5-chamber')}
<h3>ধাপ ২ — Pulsed-wave Doppler বসান</h3>
<ul>
<li><b>PW Doppler</b> চালু করুন।</li>
<li>Sample volume রাখুন <b>LVOT-এর ভেতরে, aortic valve-এর প্রায় ৫ mm নিচে</b>।</li>
<li>Valve-এর ওপরে রাখলে ভুল (বেশি) মাপ আসে; খুব নিচে রাখলে কম।</li>
<li>পরিষ্কার একটা তরঙ্গ পাবেন, ভেতরটা ফাঁকা আর কিনারা ধারালো। Valve বন্ধের একটা ছোট দাগ (click) দেখা গেলে জায়গা ঠিক।</li>
</ul>
${SLOT('vti-trace','LVOT PW Doppler তরঙ্গ ও trace')}
<h3>ধাপ ৩ — Trace করুন</h3>
<ul>
<li>Freeze করে তরঙ্গের বাইরের ঘন রেখা বরাবর trace করুন; মেশিন VTI দেবে।</li>
<li>Sinus rhythm-এ ৩টি beat-এর গড়, <b>AF-এ ৫টির গড়</b>।</li>
</ul>
<h3>ধাপ ৪ — LVOT diameter (একবারই)</h3>
<ul>
<li>PLAX, zoom করে, mid-systole-এ aortic valve-এর পাতার গোড়ায় ভেতর থেকে ভেতর মাপুন।</li>
<li>বেশিরভাগ বড় মানুষের ১.৮–২.২ cm।</li>
</ul>
<h3>ধাপ ৫ — হিসাব</h3>
<div class="box"><b>SV</b> = VTI × ০.৭৮৫ × D² (D = LVOT diameter, cm)<br><b>CO</b> = SV × heart rate</div>
<table class="mini">
<tr><td>স্বাভাবিক VTI</td><td>প্রায় ১৮–২২ cm</td></tr>
<tr><td>VTI ১৮-এর কম</td><td>Low output-এর সন্দেহ</td></tr>
<tr><td>VTI ১০-এর কম</td><td>খুব কম output; খারাপ পূর্বাভাস</td></tr>
<tr><td>স্বাভাবিক CO</td><td>প্রায় ৪–৮ L/min</td></tr>
</table>
<h3>ধাপ ৬ — আসল ব্যবহার: fluid responsiveness</h3>
<ol>
<li>রোগী ৪৫° আধশোয়া অবস্থায় VTI মাপুন।</li>
<li>Passive leg raise করুন (মাথা সমান, পা ৪৫° ওপরে)।</li>
<li>৬০–৯০ সেকেন্ডে আবার মাপুন, probe-এর জায়গা ও কোণ একই রেখে।</li>
<li><b>১০–১২% বা বেশি বাড়লে</b> fluid দিন। না বাড়লে fluid-এ লাভ নেই; vasopressor বা inotrope ভাবুন।</li>
</ol>
<p>Leg raise সম্ভব না হলে ১০০–২৫০ mL-এর ছোট fluid challenge দিয়ে একই নিয়মে দেখা যায়।</p>
<h3>ধাপ ৭ — অন্য ব্যবহার</h3>
<ul><li>Inotrope শুরুর পর VTI বাড়ল কি না।</li><li>Ventilator-এ PEEP বাড়ানোর পর output কমল কি না।</li></ul>
<div class="warn"><b>সতর্কতা:</b>
<ul><li>Diameter-এর ভুল বর্গ হয়ে যায়; তাই absolute CO-র চেয়ে <b>VTI-র আগে-পরে পরিবর্তন</b> বেশি ভরসাযোগ্য।</li><li>Beam আর রক্তের পথ সোজা না থাকলে মাপ কম আসে।</li><li>Aortic stenosis বা LVOT obstruction থাকলে নির্ভরযোগ্য নয়।</li><li>খারাপ window-এ জোর করবেন না; বাদ দিন।</li></ul></div>`,
bodyEn:`<p>Learn after the five views are solid. VTI is the one measurement that directly guides fluid and inotrope decisions.</p>
<h3>What VTI is</h3><p>The distance (cm) a column of blood travels through the LVOT per beat; tracks stroke volume. Excellent for before/after comparison.</p>
<h3>Step 1 — Apical 5-chamber</h3><ul><li>From A4C tilt anteriorly until the aortic valve and LVOT appear.</li><li>Keep LVOT and beam aligned (&lt; 20°).</li></ul>
${SLOT('vti-a5c','Apical 5-chamber')}
<h3>Step 2 — PW Doppler</h3><ul><li>Sample volume <b>in the LVOT about 5 mm below the aortic valve</b>.</li><li>Above the valve overestimates; too deep underestimates.</li><li>Clean hollow envelope, valve closure click.</li></ul>
${SLOT('vti-trace','LVOT PW Doppler envelope and trace')}
<h3>Step 3 — Trace</h3><ul><li>Trace the outer dense edge.</li><li>Average 3 beats (5 in AF).</li></ul>
<h3>Step 4 — LVOT diameter (once)</h3><ul><li>Zoomed PLAX, mid-systole, inner edge to inner edge at the hinge points; usually 1.8–2.2 cm.</li></ul>
<h3>Step 5 — Calculation</h3>
<div class="box"><b>SV</b> = VTI × 0.785 × D²<br><b>CO</b> = SV × HR</div>
<table class="mini"><tr><td>Normal VTI</td><td>18–22 cm</td></tr><tr><td>&lt; 18 cm</td><td>Low output suspected</td></tr><tr><td>&lt; 10 cm</td><td>Very low output</td></tr><tr><td>Normal CO</td><td>4–8 L/min</td></tr></table>
<h3>Step 6 — Fluid responsiveness</h3><ol><li>VTI at 45° semi-recumbent.</li><li>Passive leg raise.</li><li>Re-measure at 60–90 s, same position and angle.</li><li><b>≥ 10–12% rise</b>: give fluid; otherwise think vasopressor/inotrope.</li></ol><p>No PLR: 100–250 mL mini fluid challenge.</p>
<h3>Step 7 — Other uses</h3><ul><li>Response to inotropes.</li><li>Effect of PEEP changes.</li></ul>
<div class="warn"><b>Cautions:</b> diameter error is squared — trust the <b>change in VTI</b>; misalignment underestimates; unreliable with AS or LVOT obstruction; skip in poor windows.</div>`},

/* ---------------------------------------------------- 14 */
{id:'echo-14',cat:'Protocol',color:'#ef4444',emoji:'🚨',seed:true,
titleBn:'Shock — RUSH ধাঁচে ধাপে ধাপে',titleEn:'Shock — RUSH-style approach',
bodyBn:`<p>BP কম, রোগী নিস্তেজ। তিনটি প্রশ্ন ক্রমে করুন: <b>Pump</b> ঠিক আছে কি, <b>Tank</b>-এ পানি আছে কি, <b>Pipes</b>-এ বাধা আছে কি।</p>
<div class="linkbtn" data-tool="echo">🩺 Shock tool দিয়ে ধাপে ধাপে চলুন</div>
<h3>ধাপ ১ — Pump (হৃৎপিণ্ড)</h3>
<ul>
<li><b>Subcostal বা PLAX</b>: effusion আছে কি? Tamponade-এর চিহ্ন আছে কি?</li>
<li><b>PLAX, PSAX</b>: LV hyperdynamic, স্বাভাবিক, নাকি খুব দুর্বল?</li>
<li><b>A4C, PSAX</b>: RV বড় কি? D-septum আছে কি?</li>
</ul>
<h3>ধাপ ২ — Tank (পানির অবস্থা)</h3>
<ul>
<li><b>IVC</b>: সরু ও চুপসে যাওয়া, নাকি মোটা ও স্থির?</li>
<li><b>Lung</b>: A-line (শুকনো) নাকি B-line (ভেজা)? Pleural effusion?</li>
<li><b>পেট</b>: Morison's pouch-এ পানি (রক্তক্ষরণ)? (FAST)</li>
</ul>
<h3>ধাপ ৩ — Pipes (রক্তনালী)</h3>
<ul>
<li>পেটের aorta চওড়া (৩ cm-এর বেশি)? Aortic root-এ dissection-এর পর্দা?</li>
<li>পায়ের শিরা চাপলে চুপসায় না (DVT)? থাকলে PE-র সম্ভাবনা বাড়ে।</li>
</ul>
<p>Pipes অংশ এই দুই দিনের পাঠের বাইরে; পরে আলাদা করে শিখবেন।</p>
<h3>ধাপ ৪ — ছবি মিলিয়ে ধরন বের করুন</h3>
<table class="mini">
<tr><td><b>Cardiogenic</b></td><td>LV খুব দুর্বল, প্রায়ই বড়; lung-এ দুই দিকে B-line; IVC মোটা।<br>করণীয়: fluid নয়; inotrope (যেমন dobutamine), কারণ খুঁজুন (MI, myocarditis), cardiology।</td></tr>
<tr><td><b>Obstructive — tamponade</b></td><td>Effusion + RA/RV collapse + মোটা IVC।<br>করণীয়: pericardiocentesis, সাবধানে fluid, diuretic নয়।</td></tr>
<tr><td><b>Obstructive — PE</b></td><td>RV বড় + D-septum + ছোট LV + lung শুকনো; DVT থাকতে পারে।<br>করণীয়: fluid সীমিত, vasopressor, anticoagulation/thrombolysis।</td></tr>
<tr><td><b>Hypovolaemic</b></td><td>LV hyperdynamic, ছোট; IVC সরু, চুপসে যায়; lung শুকনো; FAST-এ রক্ত থাকতে পারে।<br>করণীয়: fluid বা রক্ত, উৎস বন্ধ করা।</td></tr>
<tr><td><b>Distributive (sepsis)</b></td><td>শুরুতে LV hyperdynamic, IVC সরু থেকে স্বাভাবিক; পরে septic cardiomyopathy-তে LV দুর্বল হতে পারে।<br>করণীয়: fluid responsive হলে fluid, তারপর noradrenaline।</td></tr>
</table>
${SLOT('shock-flow','আপনার ইউনিটের shock flowchart বা উদাহরণ ছবি')}
<h3>ধাপ ৫ — একবার নয়, বারবার</h3>
<p>Fluid, vasopressor বা ventilator বদলানোর পর আবার দেখুন। শকের রোগী মিনিটে মিনিটে বদলায়; প্রথম ছবি দিয়ে সারা দিন চালাবেন না।</p>
<div class="warn"><b>সতর্কতা:</b> একাধিক ধরন একসাথে থাকতে পারে, যেমন sepsis আর septic cardiomyopathy। Hyperdynamic LV আর সরু IVC hypovolaemia ও distributive দুটোতেই দেখা যায়; কারণ আলাদা করে খুঁজুন। POCUS একা সিদ্ধান্ত নেয় না।</div>`,
bodyEn:`<p>Hypotensive patient: ask in order — <b>Pump</b>, <b>Tank</b>, <b>Pipes</b>.</p>
<div class="linkbtn" data-tool="echo">🩺 Walk through with the Shock tool</div>
<h3>Step 1 — Pump</h3><ul><li><b>Subcostal/PLAX</b>: effusion, tamponade signs?</li><li><b>PLAX/PSAX</b>: LV hyperdynamic, normal, poor?</li><li><b>A4C/PSAX</b>: big RV, D-septum?</li></ul>
<h3>Step 2 — Tank</h3><ul><li><b>IVC</b>: small/collapsing or plethoric?</li><li><b>Lung</b>: A-lines or B-lines, effusion?</li><li><b>Abdomen</b>: free fluid (FAST)?</li></ul>
<h3>Step 3 — Pipes</h3><ul><li>Abdominal aorta &gt; 3 cm, aortic root flap?</li><li>Non-compressible leg vein (DVT)?</li></ul><p>Pipes are beyond the 2-day scope.</p>
<h3>Step 4 — Shock type</h3>
<table class="mini"><tr><td><b>Cardiogenic</b></td><td>Poor LV, bilateral B-lines, plethoric IVC. No fluid; inotrope; find the cause.</td></tr><tr><td><b>Tamponade</b></td><td>Effusion, RA/RV collapse, plethoric IVC. Pericardiocentesis; careful fluid; no diuretic.</td></tr><tr><td><b>PE</b></td><td>Big RV, D-septum, small LV, dry lungs. Limit fluid, vasopressor, anticoagulation/thrombolysis.</td></tr><tr><td><b>Hypovolaemic</b></td><td>Small hyperdynamic LV, small IVC, dry lungs, ± FAST fluid. Fluid/blood, control source.</td></tr><tr><td><b>Distributive</b></td><td>Hyperdynamic LV early, small–normal IVC; later septic cardiomyopathy. Fluid if responsive, then noradrenaline.</td></tr></table>
${SLOT('shock-flow','Your unit’s shock flowchart or example image')}
<h3>Step 5 — Repeat</h3><p>Rescan after every major intervention.</p>
<div class="warn"><b>Caution:</b> types overlap; hyperdynamic LV with small IVC fits both hypovolaemia and sepsis. POCUS never decides alone.</div>`},

{id:'echo-15',cat:'Protocol',color:'#3b82d4',emoji:'😮‍💨',seed:true,
titleBn:'শ্বাসকষ্ট ও বুকে ব্যথা — heart + lung',titleEn:'Dyspnoea & chest pain — heart + lung',
bodyBn:`<p>শ্বাসকষ্টে আগে lung, তারপর হৃৎপিণ্ড। দুটো মেলালে কারণ প্রায়ই বিছানার পাশেই পরিষ্কার হয়।</p>
<div class="linkbtn" data-tool="lung">🔷 Lung BLUE tool খুলুন</div>
<h3>ধাপ ১ — হঠাৎ শ্বাসকষ্ট: lung দিয়ে শুরু</h3>
<ul>
<li>দুই দিকের সামনের জোনে sliding আর A/B-line দেখুন।</li>
<li>তারপর পাশে-নিচে (PLAPS) effusion বা consolidation।</li>
</ul>
<h3>ধাপ ২ — হৃৎপিণ্ড যোগ করুন</h3>
<table class="mini">
<tr><td><b>দুই দিকে B-line + LV দুর্বল + IVC মোটা</b></td><td>Cardiogenic pulmonary oedema। Fluid নয়; diuretic, NIV, vasodilator (BP অনুযায়ী)।</td></tr>
<tr><td><b>দুই দিকে B-line + LV স্বাভাবিক</b></td><td>ARDS বা non-cardiogenic কারণ; pneumonia ভাবুন।</td></tr>
<tr><td><b>A-line + sliding আছে + RV বড়, D-septum</b></td><td>Pulmonary embolism।</td></tr>
<tr><td><b>A-line + sliding আছে + হৃৎপিণ্ড স্বাভাবিক</b></td><td>COPD বা asthma exacerbation।</td></tr>
<tr><td><b>এক জায়গায় B-line / consolidation</b></td><td>Pneumonia।</td></tr>
<tr><td><b>Sliding নেই + lung point</b></td><td>Pneumothorax।</td></tr>
<tr><td><b>বড় pleural effusion</b></td><td>Drain করলে উপকার হতে পারে; কারণ খুঁজুন।</td></tr>
</table>
${SLOT('dysp-combo','Heart + lung মেলানোর উদাহরণ ছবি')}
<h3>ধাপ ৩ — বুকে ব্যথা</h3>
<p>এখানে <b>ECG ও troponin আগে</b>; POCUS সহায়ক।</p>
<table class="mini">
<tr><td>LV-র কোনো অংশ মোটা হচ্ছে না বা নড়ছে না</td><td>Ischaemia-র সন্দেহ (শুধু ইঙ্গিত)</td></tr>
<tr><td>RV বড় + D-septum</td><td>PE</td></tr>
<tr><td>Pericardial effusion</td><td>Pericarditis, বা dissection/rupture-এর সাথে রক্ত; tamponade দেখুন</td></tr>
<tr><td>Aortic root ৪ cm-এর বেশি, ভেতরে পর্দা, নতুন AR</td><td>Aortic dissection ভাবুন; জরুরি CT angiography</td></tr>
<tr><td>Sliding নেই</td><td>Pneumothorax</td></tr>
</table>
<div class="warn"><b>সতর্কতা:</b> স্বাভাবিক POCUS দিয়ে MI, PE বা dissection বাদ দেওয়া যায় না। সন্দেহ থাকলে নির্দিষ্ট পরীক্ষা চালিয়ে যান।</div>`,
bodyEn:`<p>In dyspnoea scan the lung first, then the heart.</p>
<div class="linkbtn" data-tool="lung">🔷 Open the Lung BLUE tool</div>
<h3>Step 1 — Lung first</h3><ul><li>Anterior zones: sliding, A/B-lines.</li><li>PLAPS: effusion, consolidation.</li></ul>
<h3>Step 2 — Add the heart</h3>
<table class="mini"><tr><td><b>Bilateral B-lines + poor LV + plethoric IVC</b></td><td>Cardiogenic pulmonary oedema; no fluid; diuretic, NIV, vasodilator.</td></tr><tr><td><b>Bilateral B-lines + normal LV</b></td><td>ARDS / non-cardiogenic; think pneumonia.</td></tr><tr><td><b>A-lines + sliding + big RV, D-septum</b></td><td>PE.</td></tr><tr><td><b>A-lines + sliding + normal heart</b></td><td>COPD / asthma.</td></tr><tr><td><b>Focal B-lines / consolidation</b></td><td>Pneumonia.</td></tr><tr><td><b>No sliding + lung point</b></td><td>Pneumothorax.</td></tr><tr><td><b>Large pleural effusion</b></td><td>Consider drainage.</td></tr></table>
${SLOT('dysp-combo','Example of heart + lung integration')}
<h3>Step 3 — Chest pain</h3><p><b>ECG and troponin first</b>.</p>
<table class="mini"><tr><td>Segment not thickening</td><td>Possible ischaemia</td></tr><tr><td>Big RV + D-septum</td><td>PE</td></tr><tr><td>Effusion</td><td>Pericarditis or haemopericardium</td></tr><tr><td>Root &gt; 4 cm, flap, new AR</td><td>Dissection — urgent CT angiography</td></tr><tr><td>No sliding</td><td>Pneumothorax</td></tr></table>
<div class="warn"><b>Caution:</b> a normal POCUS does not exclude MI, PE or dissection.</div>`},

/* ---------------------------------------------------- 16 */
{id:'echo-16',cat:'Protocol',color:'#b91c1c',emoji:'⚡',seed:true,
titleBn:'Cardiac arrest — ১০ সেকেন্ডের নিয়ম',titleEn:'Cardiac arrest — the 10-second rule',
bodyBn:`<p>Arrest-এ echo-র কাজ চারটি চিকিৎসাযোগ্য কারণ খোঁজা। সবচেয়ে কড়া নিয়ম: <b>স্ক্যানের জন্য কখনো chest compression থামাবেন না।</b></p>
<h3>ধাপ ১ — আগে থেকে প্রস্তুতি</h3>
<ul>
<li>CPR চলার সময়ই probe-এ gel দিয়ে subcostal-এর জায়গায় তৈরি থাকুন।</li>
<li>মেশিনে clip record চালু রাখুন।</li>
<li>দলের একজনকে দায়িত্ব দিন জোরে ১০ থেকে ০ গুনতে।</li>
</ul>
<h3>ধাপ ২ — Pulse check-এর ১০ সেকেন্ডে</h3>
<ul>
<li><b>Subcostal 4C</b> সবচেয়ে ভালো, কারণ compression-এর হাত বুকে থাকে। না এলে PLAX।</li>
<li>Pulse check শুরু হলেই probe বসান, <b>clip record</b> করুন, ১০ সেকেন্ডে probe তুলে নিন।</li>
<li>ছবি পড়ুন <b>compression আবার শুরু হওয়ার পরে</b>, record করা clip দেখে।</li>
</ul>
${SLOT('arrest-sc','Arrest-এ subcostal view — হাতের অবস্থান')}
<h3>ধাপ ৩ — চারটি জিনিস খুঁজুন</h3>
<table class="mini">
<tr><td><b>Tamponade</b></td><td>বড় effusion, হৃৎপিণ্ড চাপা → জরুরি pericardiocentesis।</td></tr>
<tr><td><b>Massive PE</b></td><td>খুব বড় RV, ছোট LV → thrombolysis ভাবুন।</td></tr>
<tr><td><b>Hypovolaemia</b></td><td>ছোট, ফাঁকা, জোরালো LV → fluid বা রক্ত।</td></tr>
<tr><td><b>হৃৎপিণ্ডের নড়াচড়া</b></td><td>নিচের অংশ দেখুন।</td></tr>
</table>
<h3>ধাপ ৪ — নড়াচড়া আছে কি না</h3>
<table class="mini">
<tr><td><b>Organised activity, pulse নেই (pseudo-PEA)</b></td><td>হৃৎপিণ্ড নড়ছে কিন্তু pulse পাওয়া যাচ্ছে না; খুব কম output। কারণের চিকিৎসা, vasopressor; এই রোগীদের পূর্বাভাস তুলনামূলক ভালো।</td></tr>
<tr><td><b>Cardiac standstill</b></td><td>দেয়ালের কোনো নড়াচড়া নেই। ভালো resuscitation-এর পরও থাকলে পূর্বাভাস খারাপ।</td></tr>
<tr><td><b>Fine VF</b></td><td>দেয়াল কাঁপছে কিন্তু monitor-এ asystole মনে হচ্ছে → shockable rhythm হিসেবে ভাবুন।</td></tr>
</table>
<div class="box"><b>Standstill দেখলেও</b> resuscitation বন্ধের সিদ্ধান্ত <b>পুরো দল মিলে</b>, পুরো ছবি দেখে নেবে: কতক্ষণ CPR, কারণ, EtCO2, রোগীর আগের অবস্থা। শুধু echo দেখে নয়।</div>
${SLOT('arrest-standstill','Standstill বনাম organised activity')}
<div class="warn"><b>সাধারণ ভুল:</b>
<ul><li>স্ক্যানের জন্য pulse check ১০ সেকেন্ডের বেশি লম্বা করা; প্রতি সেকেন্ড brain perfusion কমায়।</li><li>Compression-এর সময় দেখা ছবিকে হৃৎপিণ্ডের নিজের নড়াচড়া ভাবা।</li><li>Valve-এর নড়াচড়া বা রক্তের ঘূর্ণিকে দেয়ালের নড়াচড়া ভাবা।</li><li>Effusion না পেয়ে ভাবা tamponade নেই, যখন view-টাই ঠিক আসেনি।</li></ul></div>`,
bodyEn:`<p>Echo in arrest looks for four treatable causes. Hardest rule: <b>never pause compressions to scan.</b></p>
<h3>Step 1 — Prepare during CPR</h3><ul><li>Gel on, ready at subcostal.</li><li>Clip recording on.</li><li>One person counts aloud 10 to 0.</li></ul>
<h3>Step 2 — During the 10-second check</h3><ul><li><b>Subcostal 4C</b> first, else PLAX.</li><li>Probe on at the start, <b>record a clip</b>, off by 10 s.</li><li>Review the clip <b>after compressions resume</b>.</li></ul>
${SLOT('arrest-sc','Subcostal view in arrest — hand position')}
<h3>Step 3 — Four things</h3><table class="mini"><tr><td><b>Tamponade</b></td><td>Urgent pericardiocentesis.</td></tr><tr><td><b>Massive PE</b></td><td>Very large RV; consider thrombolysis.</td></tr><tr><td><b>Hypovolaemia</b></td><td>Small empty hyperdynamic LV; fluid/blood.</td></tr><tr><td><b>Motion</b></td><td>See below.</td></tr></table>
<h3>Step 4 — Motion</h3><table class="mini"><tr><td><b>Pseudo-PEA</b></td><td>Organised activity without pulse; treat cause, vasopressor; better prognosis.</td></tr><tr><td><b>Standstill</b></td><td>No wall motion; poor prognosis after adequate resuscitation.</td></tr><tr><td><b>Fine VF</b></td><td>Fibrillating walls with "asystole" on monitor — treat as shockable.</td></tr></table>
<div class="box">Stopping resuscitation is a <b>team decision</b> using the whole picture, never echo alone.</div>
${SLOT('arrest-standstill','Standstill vs organised activity')}
<div class="warn"><b>Pitfalls:</b> pulse checks longer than 10 s; reading compression artefact as cardiac motion; valve flutter or blood swirl as wall motion; missing tamponade because the view was inadequate.</div>`},

{id:'echo-17',cat:'Safety',color:'#64748b',emoji:'🛡️',seed:true,
titleBn:'ফাঁদ, সীমা ও কখন formal echo',titleEn:'Pitfalls, limits & when to refer',
bodyBn:`<p>POCUS ভুল হাতে বিপজ্জনক হতে পারে: আত্মবিশ্বাসী ভুল পড়া একটা সৎ "ছবি যথেষ্ট ভালো নয়"-এর চেয়ে অনেক খারাপ।</p>
<h3>সবচেয়ে সাধারণ ফাঁদ</h3>
<table class="mini">
<tr><td>Foreshortened A4C</td><td>LV ছোট ও EF বেশি মনে হয়; RV:LV ভুল</td></tr>
<tr><td>তেরছা PSAX</td><td>মিথ্যা D-septum</td></tr>
<tr><td>বেশি gain</td><td>মিথ্যা effusion, ধোঁয়া বা জমাট রক্ত</td></tr>
<tr><td>Fat pad</td><td>Effusion মনে হয়</td></tr>
<tr><td>Aorta মাপা</td><td>IVC ভেবে ভুল সিদ্ধান্ত</td></tr>
<tr><td>Ventilator-এ IVC</td><td>মোটা দেখালেও রোগী fluid-এ সাড়া দিতে পারে</td></tr>
<tr><td>Colour jet-এর আকার</td><td>Valve রোগের মাত্রা বলে না</td></tr>
<tr><td>Loculated effusion</td><td>Surgery-র পর transthoracic-এ ধরা না-ও পড়তে পারে</td></tr>
</table>
<h3>দুই দিনের প্রশিক্ষণের পর যা একা করবেন না</h3>
<table class="mini">
<tr><td>EF-এর সংখ্যা বা valve-এর গ্রেড লেখা</td><td>শুধু গ্রেড লিখুন, formal echo চান</td></tr>
<tr><td>Endocarditis, dissection, thrombus নিশ্চিত বা বাদ দেওয়া</td><td>সন্দেহ হলেই জরুরি formal imaging/TOE</td></tr>
<tr><td>স্বাভাবিক ছবি দেখে PE, tamponade বা ischaemia বাদ দেওয়া</td><td>অন্য পরীক্ষা চালিয়ে যান</td></tr>
<tr><td>শুধু echo দেখে resuscitation বন্ধ</td><td>দলের সিদ্ধান্ত</td></tr>
<tr><td>শুধু IVC দেখে fluid ঠিক করা</td><td>VTI ও পুরো ছবি মিলিয়ে</td></tr>
<tr><td>খারাপ ছবির ওপর সিদ্ধান্ত</td><td>"non-diagnostic" লিখে senior-কে জানান</td></tr>
</table>
<div class="box"><b>এক বাক্যে:</b> POCUS স্পষ্ট অস্বাভাবিকতা ধরতে পারে, কিন্তু সবকিছু স্বাভাবিক, এটা নিশ্চিত করতে পারে না।</div>
<h3>কখন formal echo (দেরি না করে)</h3>
<ul>
<li>যে ফলাফলের ওপর অস্ত্রোপচার, anticoagulation বা যন্ত্র বসানোর সিদ্ধান্ত নির্ভর করে।</li>
<li>Tamponade, বা pericardiocentesis ভাবছেন।</li>
<li>POCUS করেও shock-এর কারণ পরিষ্কার নয়, বা ছবি আর রোগীর অবস্থা মিলছে না।</li>
<li>কোনো সংখ্যা দরকার: EF, valve-এর মাত্রা, PA pressure, diastolic function।</li>
<li>নতুন murmur, নতুন regional wall motion abnormality, সন্দেহজনক vegetation বা mass।</li>
<li>POCUS-এর ছবি non-diagnostic, অথচ রোগী অসুস্থ।</li>
</ul>
<h3>ছবি সংরক্ষণ ও লেখা</h3>
<ul>
<li>প্রতিটি view-র ২–৩ beat-এর <b>clip</b> সেভ করুন, শুধু স্থির ছবি নয়; রোগীর ID-র সাথে।</li>
<li>রিপোর্টে লিখুন <b>"Focused POCUS, not a formal echocardiogram"</b>, আর ছবির মান: ভালো, সীমিত, বা non-diagnostic।</li>
<li>প্রথম ২৫–৫০টি স্ক্যান logbook-এ রাখুন; অভিজ্ঞ কাউকে দিয়ে নিয়মিত কিছু ছবি দেখিয়ে নিন।</li>
<li>পরে একটা স্বীকৃত critical care echo কোর্স বা accreditation-এর দিকে এগোন।</li>
</ul>
<h3>এই দুই দিনে যা বাদ</h3>
<p>Diastolic function, valve-এর সূক্ষ্ম মাপ (valve area, PISA, gradient), strain, 3D, contrast echo, TOE। এগুলো মাসের পর মাস প্রশিক্ষণের বিষয়।</p>`,
bodyEn:`<p>A confident wrong read is far worse than an honest "non-diagnostic".</p>
<h3>Common pitfalls</h3><table class="mini"><tr><td>Foreshortened A4C</td><td>Small LV, high EF, wrong RV:LV</td></tr><tr><td>Oblique PSAX</td><td>False D-septum</td></tr><tr><td>High gain</td><td>False effusion, smoke, clot</td></tr><tr><td>Fat pad</td><td>Mimics effusion</td></tr><tr><td>Measuring aorta</td><td>Wrong IVC conclusions</td></tr><tr><td>IVC on ventilator</td><td>Fat IVC yet fluid responsive</td></tr><tr><td>Colour jet size</td><td>Not severity</td></tr><tr><td>Loculated effusion</td><td>Missed on TTE post surgery</td></tr></table>
<h3>Do not do alone after 2 days</h3><table class="mini"><tr><td>Numerical EF or valve grade</td><td>Grade qualitatively; formal echo</td></tr><tr><td>Diagnose/exclude endocarditis, dissection, thrombus</td><td>Urgent formal imaging/TOE</td></tr><tr><td>Rule out PE, tamponade, ischaemia on a normal scan</td><td>Continue workup</td></tr><tr><td>Stop resuscitation on echo alone</td><td>Team decision</td></tr><tr><td>Fluids on IVC alone</td><td>VTI and whole picture</td></tr><tr><td>Act on a poor image</td><td>Call it non-diagnostic</td></tr></table>
<div class="box">POCUS rules in obvious abnormality; it cannot confirm normality.</div>
<h3>When to get formal echo</h3><ul><li>Findings driving surgery, anticoagulation or devices.</li><li>Tamponade / pericardiocentesis.</li><li>Shock still undifferentiated, or images and clinical picture disagree.</li><li>Any quantification needed.</li><li>New murmur, new RWMA, suspected vegetation or mass.</li><li>Non-diagnostic POCUS in a sick patient.</li></ul>
<h3>Storage and documentation</h3><ul><li>Save 2–3 beat <b>clips</b> per view, linked to patient ID.</li><li>Write <b>"Focused POCUS, not a formal echocardiogram"</b> and image quality.</li><li>Logbook of the first 25–50 scans with expert over-reads.</li><li>Work toward accredited critical care echo training.</li></ul>
<h3>Out of scope in 2 days</h3><p>Diastolic function, valve quantification, strain, 3D, contrast, TOE.</p>`},
